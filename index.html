function colFutureHTML(cards, total, estN){
  const f = (rate, y) => total * Math.pow(1 + rate, y);
  const rows = COL_YEARS.map(y =>
    '<tr><td>In ' + y + ' year' + (y === 1 ? "" : "s") + ' (' + (new Date().getFullYear() + y) + ')</td>'
    + '<td class="lo">' + money(f(COL_RATES.lo, y)) + '</td><td class="mid">' + money(f(COL_RATES.mid, y)) + '</td><td class="hi">' + money(f(COL_RATES.hi, y)) + '</td></tr>').join("");
  // the one real signal: Cardmarket's current trend against its own 30-day average
  let trend = 0, avg = 0, n = 0;
  for(const c of cards){
    const cm = (c.cardmarket && c.cardmarket.prices) || {};
    if(cm.trendPrice > 0 && cm.avg30 > 0){ trend += cm.trendPrice; avg += cm.avg30; n++; }
  }
  const move = n >= 5 ? trend / avg - 1 : null;
  const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
  return '<div class="future"><h3>What collecting every ' + esc(colName) + ' card might cost later</h3>'
    + '<p>Right now: <b>' + (estN ? "~" : "") + money(total) + '</b> for all ' + cards.length + ' cards.'
    + (move != null ? ' Lately these cards have been <b style="color:' + (move >= 0 ? "#7ee38a" : "#ffb4b4") + '">' + (Math.abs(move) < 0.005 ? "holding steady" : (move > 0 ? "going up" : "going down")) + '</b> — '
        + 'their European (Cardmarket) prices are ' + pct(move) + ' against their 30-day average, across ' + n + ' cards.' : '') + '</p>'
    + '<div class="ftable"><table><thead><tr><th></th><th>If prices fall<br>6% a year</th><th>If they grow<br>4% a year</th><th>If they grow<br>12% a year</th></tr></thead>'
    + '<tbody><tr class="now"><td>Today</td><td colspan="3" style="text-align:center">' + (estN ? "~" : "") + money(total) + '</td></tr>' + rows + '</tbody></table></div>'
    + '<p><b>These are what-ifs, not a prediction.</b> Nobody knows what card prices will do, and this site has no price history to go on — '
    + 'each column just shows where today\'s total ends up if prices changed by that much every year. Popular Pokémon and older cards have often gone up over time, '
    + 'but reprints, new sets and changing trends can push prices down, and a card you collect is only worth what someone will pay for it.</p>'
    + '</div>';
}

/* ---------------- energy tab ----------------
   Energy cards on their own, so finding what one is worth (or adding it to the collection) isn't
   a hunt through every Pokémon. All Energy cards (~400) load in one go through the saved-copy
   cache, then every filter is instant and local:
   - Basic / Special;
   - energy type. Basic Energy cards carry no `types` in the API, so the type also matches the
     card's name ("Fire Energy", "Basic Fire Energy", "Unit Energy FightingDarknessFairy");
   - what's typed in the search box (name, or set name);
   - sort: newest, price high→low, price low→high.
   Each type button shows how many cards it would leave, given the other filters. */
const ENERGY_TYPES = ["Grass","Fire","Water","Lightning","Psychic","Fighting","Darkness","Metal","Fairy","Dragon","Colorless"];
let energyCards = null, energyType = "", energyKind = "", energySort = "new", energyBusy = false;

async function loadEnergy(){

async function fetchEnergyCards(){
  let all = [], page = 1;
  while(true){

      + "&orderBy=-set.releaseDate,number&pageSize=250&page=" + page);

function energyIsType(c, t){

/* ---------------- prices ----------------
   What a sealed booster pack of the set costs, from PACK_PRICES above. Card-level
   prices come from the card data itself, so they cost no extra requests. */
/* One single booster pack you can actually buy, from a seller whose reviews hold up.
   The user asked for the cheapest pack that's in stock, from a trusted site, never a fake — and to
   "look and carefully read reviews". PACK_PICKS (baked, as of PACK_PICKS.d) comes from reading each
   pack's TCGplayer listings cheapest-first (check-pack-sellers.js) and taking the first that passes:
   - sold as the plain catalog pack, "Unopened" — no custom photo listings, which is where Korean,
     Chinese and other foreign packs get listed on the English pack's page, and no seller names
     hinting at foreign or weighed / resealed packs;
   - seller feedback 99%+ from at least 500 completed sales (their reviews);
   - at least half the usual sale price.
   Each entry: [price, shipping, seller, sellerPath, rating, sales, skippedForeignOrCustom,
   skippedReviews, skippedTooCheap], or [0, skippedForeignOrCustom, skippedReviews, skippedTooCheap]
   when nothing passed. The raw cheapest listing is never shown — if no seller passes, the site shows
   what packs usually sell for and says no trusted seller had one. PACK_PRICES.s[id].p is that usual
   (recent average sale) price; lu is the pack's TCGplayer product id for the buy link. */
/* A seller check goes stale as listings sell, and it can only be redone by hand (TCGplayer blocks
   scripts), while PACK_PRICES refreshes itself every day. So a pick older than PICK_MAX_DAYS isn't
   shown as "in stock" any more — the pack falls back to the daily usual price. */
const PICK_MAX_DAYS = 7;
function picksFresh(){
  const d = new Date(String(PACK_PICKS.d) + "T00:00:00Z");
  return Number.isFinite(d.getTime()) && (Date.now() - d.getTime()) / 86400000 <= PICK_MAX_DAYS;
}
function packInfo(id){
  const x = PACK_PRICES.s[id], k = picksFresh() ? PACK_PICKS.s[id] : null;
  if(!x && !k) return null;
  const avg = x && x.p != null ? x.p : null;
  let best = null, skipped = null;
  if(k && k[0] > 0){
    best = {price: k[0], ship: k[1], total: +(k[0] + k[1]).toFixed(2), seller: k[2], sellerPath: k[3], rating: k[4], sales: k[5], pid: x && x.lu};
    skipped = {foreign: k[6], reviews: k[7], cheap: k[8]};
  }else if(k){
    skipped = {foreign: k[1], reviews: k[2], cheap: k[3]};
  }
  if(!best && avg == null) return null;
  return {avg: avg, best: best, skipped: skipped, checked: !!k};
}
function packPrice(id){
  const i = packInfo(id);
  return i ? (i.best ? i.best.total : i.avg) : null;
}
function priceLabel(id){
  const i = packInfo(id);
  if(!i) return '<span class="pending">not sold in packs</span>';
  if(i.best) return '<b>' + money(i.best.total) + '</b> <span class="per">a pack</span><span class="stock">in stock · trusted seller</span>' + dealLine(id);
  return '<b>' + money(i.avg) + '</b> <span class="per">a pack</span><span class="stock warn">' + (picksFresh() ? "usual price · no trusted seller in stock" : "usual price · updated daily") + '</span>' + dealLine(id);
}
/* Is a box of packs cheaper than buying single packs? The user asked to be shown, in yellow under the
   pack price, when "a trainer box or something is worth it rather than buying the packs". PACK_PRICES.s[id].o
   (update-pack-prices.py) is {kind: [price, packs, productId]} — TCGplayer market price and the pack count
   from the product description. A box only shows when each pack in it costs at least DEAL_MIN less than
   the single-pack price shown on the page. */
const BOX_KINDS = {
  b: {name: "Booster Box", short: "booster box", extra: ""},
  h: {name: "Half Booster Box", short: "half booster box", extra: ""},
  u: {name: "Booster Bundle", short: "booster bundle", extra: ""},
  e: {name: "Elite Trainer Box", short: "Elite Trainer Box", extra: "Also comes with card sleeves, dice, Energy cards and a box to keep cards in."},
  c: {name: "Pokémon Center Elite Trainer Box", short: "Pokémon Center ETB", extra: "Also comes with card sleeves, dice, Energy cards, a promo card and a box to keep cards in."}
};
const DEAL_MIN = 0.05;
function boxDeals(id){
  const single = packPrice(id), o = (PACK_PRICES.s[id] || {}).o;
  if(single == null || !o) return {any: false, deals: []};
  const deals = Object.entries(o).filter(([k]) => BOX_KINDS[k]).map(([k, [price, packs, pid]]) => ({
    kind: k, price: price, packs: packs, pid: pid, each: price / packs,
    save: 1 - price / packs / single, saveUsd: single * packs - price
  })).filter(d => d.save >= DEAL_MIN).sort((a, b) => a.each - b.each);
  return {any: true, deals: deals, single: single};
}
function dealLine(id){
  const d = boxDeals(id).deals[0];
  if(!d) return '';
  return '<span class="deal">📦 ' + money(d.each) + ' a pack in a ' + BOX_KINDS[d.kind].short + ' · save ' + Math.round(d.save * 100) + '%</span>';
}
function dealBox(id){
  const r = boxDeals(id);
  if(!r.any) return '';
  if(!r.deals.length) return '<div class="dealbox none">📦 Buying single packs is the cheapest way right now — no booster box, bundle or Elite Trainer Box works out cheaper per pack.</div>';
  return '<div class="dealbox"><div class="dh">📦 Cheaper than buying single packs</div>'
    + r.deals.map(d => '<div class="drow"><div class="dp">' + money(d.each) + '<span> a pack</span></div>'

/* How long a TCGplayer order takes to reach your house, worked out from today. TCGplayer requires
   sellers to ship standard orders within 2 business days (Mon–Fri, not federal holidays), then USPS
   standard mail takes 2–5 days and delivers Saturdays too. So the earliest is "ships tomorrow, 2 mail
   days", the latest "ships on business day 2, 5 mail days". US addresses only. */
function usHolidays(y){
  const nth = (m, wd, n) => { const d = new Date(y, m, 1); d.setDate(1 + (wd - d.getDay() + 7) % 7 + (n - 1) * 7); return d; };
  const last = (m, wd) => { const d = new Date(y, m + 1, 0); d.setDate(d.getDate() - (d.getDay() - wd + 7) % 7); return d; };
  const fixed = (m, day) => { const d = new Date(y, m, day); if(d.getDay() === 6) d.setDate(day - 1); if(d.getDay() === 0) d.setDate(day + 1); return d; };
  return new Set([fixed(0, 1), nth(0, 1, 3), nth(1, 1, 3), last(4, 1), fixed(5, 19), fixed(6, 4), nth(8, 1, 1),
    nth(9, 1, 2), fixed(10, 11), nth(10, 4, 4), fixed(11, 25)].map(d => d.toDateString()));
}
function addDays(from, n, saturdays){
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  while(n > 0){
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if(wd === 0 || (wd === 6 && !saturdays) || usHolidays(d.getFullYear()).has(d.toDateString())) continue;
    n--;
  }
  return d;
}
function deliveryLine(){
  const now = new Date(), day = d => d.toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
  const soonest = addDays(addDays(now, 1, false), 2, true), latest = addDays(addDays(now, 2, false), 5, true);
  const days = d => Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return '<div class="eta">🚚 <span><b>Gets to your house ' + day(soonest) + ' – ' + day(latest) + '</b> if you order today'
    + ' (' + days(soonest) + '–' + days(latest) + ' days). The seller has 2 business days to ship it, then the mail takes 2–5 days.'
    + ' US addresses — Alaska, Hawaii and other countries take longer.</span></div>';
}

function money(n){
  if(n == null) return "—";
  if(n >= 1000) return "$" + Math.round(n).toLocaleString("en-US");
  return "$" + n.toFixed(2);
}

function cardPrice(c){
  const p = c.tcgplayer && c.tcgplayer.prices;
  if(!p) return null;
  // cheapest printing of the card — avoids 1st-edition variants inflating the set
  const vals = Object.values(p).map(v => v && v.market).filter(v => typeof v === "number" && v > 0);
  return vals.length ? Math.min(...vals) : null;
}

/* What a card is worth, and how much to trust it.
   Brand-new sets ship months before TCGplayer lists a single card — the four newest sets have
   661 cards with no price between them — so rather than showing a dash, fall back through
   the European market and then a same-rarity baseline, saying clearly which one was used.
   -> {v, est, why, weak}  (est = it's a guess, weak = a guess from very little data) */
function cardValue(c){
  const exact = cardPrice(c);
  if(exact != null) return {v:exact, est:false, why:"TCGplayer market price"};

  const cm = (c.cardmarket && c.cardmarket.prices) || {};
  const eu = cm.trendPrice || cm.averageSellPrice || cm.avg30;
  if(eu) return {v: eu * PRICE_EST.eur, est:true, basis:"eu",
                 why:"converted from its European (Cardmarket) price at €1 = " + money(PRICE_EST.eur)};

  const base = PRICE_EST.r[c.rarity];
  if(base) return {
    v: base[0], est:true, basis:"rarity", weak: base[1] < 10,
    why: "what a typical " + c.rarity + " from a recent set sells for, across "
       + base[1] + " comparable card" + (base[1] === 1 ? "" : "s")
  };
  if(PRICE_EST.any) return {
    v: PRICE_EST.any, est:true, basis:"rarity", weak:true,
    why:"what a typical card from a recent set sells for; nothing comparable to this rarity yet"
  };
  return null;
}
/* The yellow explain-yourself box under an estimated price. */
function warnBox(r, lead){
  return '<div class="warn"><b>⚠ This is an estimate, not a listed price.</b>'
    + (lead || "TCGplayer has no sale price for this card.")
    + (r.basis === "rarity" ? " Brand-new sets often go months before anything sells." : "")
    + " The figure above is " + esc(r.why) + "."
    + (r.weak ? ' <b>Treat it as very rough</b> — there is little to compare against.' : '')
    + '</div>';
}

/* Shown above a grid that contains guessed prices, so the ~ isn't a mystery. */
function estLegend(cards){
  const n = cards.filter(c => cardPrice(c) == null && cardValue(c)).length;
  if(!n) return "";
  return '<span class="legend"><b>~</b> ' + n + " of " + cards.length
    + " ha" + (n === 1 ? "s" : "ve") + " no sale price yet — those are estimates</span>";
}
function priceStats(cards){
  let total = 0, n = 0, hi = 0, hiName = "";
  for(const c of cards){
    const v = cardPrice(c);
    if(v == null) continue;
    total += v; n++;
    if(v > hi){ hi = v; hiName = c.name; }
  }
  return {v:total, n:n, hi:hi, hiName:hiName, of:cards.length};
}

  const byDate = s => s.releaseDate || "0000/00/00";
  const c = [...list];
  if(m === "new")  c.sort((a,b)=> byDate(b).localeCompare(byDate(a)));
  if(m === "old")  c.sort((a,b)=> byDate(a).localeCompare(byDate(b)));
  if(m === "az")   c.sort((a,b)=> a.name.localeCompare(b.name));
  if(m === "size") c.sort((a,b)=> (b.total||0) - (a.total||0));

  }

/* Evolution lines side by side.
   The grid stays in card-number order, except each Pokémon family is pulled together at the spot
   where its first card is numbered: Charmander, Charmeleon, Charizard, Charizard ex, then the
   secret-rare Charizard ex from the back of the set. Trainers and Energy don't move.
   Families join through names from both ends (evolvesFrom and evolvesTo), so a line still holds
   together when the middle stage isn't in the set, and rule-box cards (Charizard V, M Charizard-EX)
   join their species by name. */
const EVO_SUFFIX = /[\s-](?:EX|ex|GX|V|VMAX|VSTAR|V-UNION|BREAK|LV\.X|LEGEND|Prime|☆|δ|◇|♢)$/;
function species(name){
  let n = String(name || "").trim(), prev;
  do{ prev = n; n = n.replace(EVO_SUFFIX, "").replace(/^(?:M|Mega|Radiant|Shining)\s+/, "").trim(); }
  while(n && n !== prev);
  return n || String(name || "");
}
function evoOrder(cards){
  const isMon = c => /^Pok/.test(c.supertype || "");
  const up = Object.create(null);
  const find = n => { if(!(n in up)) up[n] = n; while(up[n] !== n){ up[n] = up[up[n]]; n = up[n]; } return n; };
  const join = (a, b) => { if(a && b) up[find(a)] = find(b); };
  const from = Object.create(null), into = Object.create(null);
  for(const c of cards){
    if(!isMon(c)) continue;
    join(c.name, species(c.name));
    if(c.evolvesFrom){ join(c.name, c.evolvesFrom); from[c.name] = c.evolvesFrom; }
    for(const t of c.evolvesTo || []){ join(c.name, t); if(!(t in into)) into[t] = c.name; }
  }
  // how far down its line a card sits: Basic 0, Stage 1 is 1, a VMAX one past its V
  const depthOf = Object.create(null);
  const depth = (n, hops) => {
    if(n in depthOf) return depthOf[n];
    if(hops > 8) return 0;                                   // guard against a looped chain
    let d = 0;
    if(from[n]) d = depth(from[n], hops + 1) + 1;
    else if(into[n]) d = depth(into[n], hops + 1) + 1;
    else if(species(n) !== n) d = depth(species(n), hops + 1);
    return depthOf[n] = d;
  };
  const rows = cards.map((c, i) => ({c, i, f: isMon(c) ? "p:" + find(c.name) : "c:" + c.id, d: isMon(c) ? depth(c.name, 0) : 0}));
  const first = Object.create(null), nameAt = Object.create(null);
  for(const r of rows){
    if(!(r.f in first)) first[r.f] = r.i;
    if(!(r.c.name in nameAt)) nameAt[r.c.name] = r.i;
  }
  return rows.sort((a, b) =>
    first[a.f] - first[b.f] || a.d - b.d || nameAt[a.c.name] - nameAt[b.c.name] || a.i - b.i
  ).map(r => r.c);
}

/* ---------------- booster pack simulator ---------------- */
function ripPack(){
  const pool = currentCards.filter(c => c.rarity);
  if(pool.length < 4){ alert("This set doesn't have enough rarity data to simulate a pack."); return; }
  const by = p => pool.filter(p);
  const commons   = by(c => /^Common/i.test(c.rarity));
  const uncommons = by(c => /^Uncommon/i.test(c.rarity));
  const rares     = by(c => /rare/i.test(c.rarity));
  const chase     = by(c => /(Ultra|Secret|Illustration|Hyper|Rainbow|Special|Amazing|Radiant|Shiny|Gold)/i.test(c.rarity));
  const pick = (arr, n) => {
    const out = [], src = arr.length ? arr : pool;
    for(let i=0;i<n;i++) out.push(src[Math.floor(Math.random()*src.length)]);
    return out;
  };
  const hit = (chase.length && Math.random() < 0.18) ? pick(chase,1) : pick(rares.length ? rares : pool, 1);
  const pull = [...pick(commons,5), ...pick(uncommons,3), ...hit];
  const grid = document.getElementById("grid");
  document.getElementById("shown").textContent = "your pull — 9 cards";
  grid.innerHTML = pull.map(c => cardTile(c, "pull")).join("");
  [...grid.children].forEach((el,i) => el.style.animationDelay = (i*70) + "ms");
  grid.scrollIntoView({behavior:"smooth", block:"start"});
}

      + 'You have to sign in so we can <b style="color:var(--gold)">save your stuff</b> — every card you add, and where it sits'
      + ' in your binder.<br>Pick a name and a password. Your collection saves on this device under that name.'
      + '<div class="egs" style="margin-top:22px"><button class="btn-gold" onclick="showSignIn()">Sign in</button></div></div>';
    return;
  }

      + '<div class="hint" style="padding-top:40px"><h3>Nothing in your collection yet</h3>'
      + 'Hit <b style="color:#7ee38a">+ Add to collection</b> on any card in Card search, '
      + 'or open a card and hit <b style="color:#7ee38a">✓ I have this card</b>.'
      + '<div class="egs"><button onclick="showSearch()">Search for a card</button>'

  }
  for(const s of list) if(!CARDS.has(s.id)) CARDS.set(s.id, snapToCard(s));
  const val = list.reduce((t,s) => t + (s.v || 0) * qtyOf(s), 0);
  const copies = list.reduce((t,s) => t + qtyOf(s), 0);
  app.innerHTML = head
    +   '<div class="stats">'
    +     '<div>Cards in your collection<b>' + list.length + '</b></div>'
    +     (copies > list.length ? '<div>Copies, counting doubles<b>' + copies + '</b></div>' : '')
    +     '<div>What they\'re worth<b style="color:#7ee38a">' + money(val) + '</b></div>'
    +   '</div></div></div>'
    + '<div class="tools">'
    +   '<input type="search" id="oq" placeholder="Search your collection…" value="' + esc(ownedTerm) + '">'
    +   '<select id="osort" aria-label="Sort your collection" onchange="ownedSort=this.value;store.set(\'pkOwnedSort\',ownedSort);drawOwned()">'
    +     OWNED_SORTS.map(o => '<option value="' + o[0] + '"' + (o[0] === ownedSort ? " selected" : "") + '>' + o[1] + '</option>').join("")
    +   '</select>'
    +   '<span class="count" id="oshown"></span>'
    + '</div>'
    + '<div class="found" id="ogrid" style="margin-top:18px"></div>';
  document.getElementById("oq").addEventListener("input", e => { ownedTerm = e.target.value; drawOwned(); });
  drawOwned();
}
/* "Added" order is the order cards went into OWNED (card ids aren't numbers, so object key order is
   insertion order). Prices are the value saved with the card when it was added. Cards with no
   price go last whichever way you sort by price. */
function sortOwned(list){
  const pos = {};
  Object.keys(OWNED).forEach((k, i) => pos[k] = i);
  const newest = (a, b) => pos[b.id] - pos[a.id];
  const noPrice = (a, b) => (a.v == null) - (b.v == null);
  const num = x => { const n = parseInt(x, 10); return isNaN(n) ? Infinity : n; };
  const c = list.slice();
  const by = {
    new: newest,
    old: (a, b) => pos[a.id] - pos[b.id],
    // by one card's price — how many you have doesn't move a card up or down
    hi: (a, b) => noPrice(a, b) || b.v - a.v || newest(a, b),
    lo: (a, b) => noPrice(a, b) || a.v - b.v || newest(a, b),
    az: (a, b) => (a.n || "").localeCompare(b.n || "") || (a.set || "").localeCompare(b.set || ""),
    set: (a, b) => (a.set || "").localeCompare(b.set || "") || num(a.num) - num(b.num) || String(a.num).localeCompare(String(b.num)),
    binder: (a, b) => (!slotNumber(a.slot)) - (!slotNumber(b.slot)) || (slotNumber(a.slot) || 0) - (slotNumber(b.slot) || 0) || newest(a, b)
  };
  return c.sort(by[ownedSort] || newest);
}
// matches a card's name, set or rarity, or its exact number ("199" or "#199")
function drawOwned(){
  const list = Object.values(OWNED);
  const term = ownedTerm.trim().toLowerCase();
  const num = term.replace(/^#/, "");
  const hits = list.filter(s => !term
    || (s.n || "").toLowerCase().includes(term) || (s.set || "").toLowerCase().includes(term)
    || (s.rar || "").toLowerCase().includes(term) || String(s.num).toLowerCase() === num
    || (s.pr && varLabel(s.pr).toLowerCase().includes(term)));
  document.getElementById("oshown").textContent = term ? hits.length + " / " + list.length + " cards" : "";
  // numbered 1…n top to bottom in the chosen order; a card keeps its number while you search
  const rank = {};
  sortOwned(list).forEach((s, i) => rank[s.id] = i + 1);
  document.getElementById("ogrid").innerHTML = sortOwned(hits).map(s => ownedTile(s, rank[s.id])).join("")
    || '<div class="msg" style="grid-column:1/-1">Nothing in your collection matches “' + esc(ownedTerm.trim()) + '”.</div>';
}

/* ---------------- accounts ----------------
   Making a collection needs signing in, so there's someone to save it for. Signing in is a name and
   a password — no Google, no outside service — and each name gets its own collection and binder
   layout, saved on this device:
     pkProfiles = {<lowercased name>: {name, owned, binder, pw:{salt, hash, it}}}
     pkUser     = the lowercased name signed in (a reload keeps you signed in)
   The password is never stored: pw is a PBKDF2-SHA256 hash with a random salt. It keeps other
   people using this device out of your collection on the site; it is not encryption — the
   collection itself is plain JSON that browser dev tools could read. There's no reset (no server),
   and the sign-in box says so. Browsing sets, prices and card search never needs signing in. */
let USER = null;                 // {key, name} of whoever is signed in
let pendingOwn = "";             // a card someone tried to add before signing in; added once they do
const NAME_MAX = 24, PW_MIN = 4, PW_ITER = 150000;

/* Accounts are the one thing on this site that can't be fetched again, so they're handled carefully.
   A site update only replaces index.html — it never touches localStorage — so the rule for any
   future change is: keep the key names pkProfiles / pkUser and the profile shape above, and if the
   shape ever has to change, convert old profiles when they're read. Never rename, clear or reformat
   them in place. On top of that:
   - pkProfilesBackup is the previous good copy, written just before every save. If pkProfiles is
     ever missing or unreadable, it comes back from the backup.
   - If pkProfiles can't be read, nothing writes over it: a copy goes to pkProfilesRescue and saving
     is refused until it can be read again.
   - A save that would leave out a name that already exists is refused — the site has no way to
     delete a name, so that can only be a bug.
   - navigator.storage.persist() asks the browser not to clear the site's storage to free up space. */
function parseProfiles(raw){
  try{ const o = JSON.parse(raw); return o && typeof o === "object" && !Array.isArray(o) ? o : null; }
  catch(e){ return null; }
}
function readProfiles(){
  let raw, backup;
  try{ raw = localStorage.getItem("pkProfiles"); backup = localStorage.getItem("pkProfilesBackup"); }
  catch(e){ return {ok: false, data: {}}; }                     // storage blocked
  const restore = () => {
    const b = backup != null ? parseProfiles(backup) : null;
    if(!b) return null;
    try{ localStorage.setItem("pkProfiles", backup); }catch(e){}
    return b;
  };
  if(raw == null){
    const b = restore();
    return {ok: true, data: b || {}};
  }
  const o = parseProfiles(raw);
  if(o) return {ok: true, data: o};
  try{ if(localStorage.getItem("pkProfilesRescue") == null) localStorage.setItem("pkProfilesRescue", raw); }catch(e){}
  const b = restore();
  return b ? {ok: true, data: b} : {ok: false, data: {}};
}
function profiles(){ return readProfiles().data; }
function writeProfiles(all){
  const cur = readProfiles();
  if(!cur.ok){
    toast("Your saved names couldn't be read, so nothing was saved — and nothing was deleted.");
    return false;
  }
  for(const k in cur.data){
    if(!(k in all)){ toast("Didn't save: that would have lost the name " + (cur.data[k].name || k) + "."); return false; }
  }
  try{
    const prev = localStorage.getItem("pkProfiles");
    if(prev != null) localStorage.setItem("pkProfilesBackup", prev);
    localStorage.setItem("pkProfiles", JSON.stringify(all));
    return true;
  }catch(e){
    toast("Couldn't save — this browser's storage is full or turned off.");
    return false;
  }
}
function keepStorage(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
}

function initAccounts(){
  const key = store.get("pkUser", "");
  const p = key && profiles()[key];
  if(p){ useProfile(key, p); keepStorage(); }
  drawAccount(); refreshView();
}
function useProfile(key, p){
  USER = {key: key, name: p.name};
  OWNED = p.owned || {};
  for(const k in OWNED){                       // old {page, pocket} slots become one number
    const n = slotNumber(OWNED[k].slot, p.binder);
    if(n) OWNED[k].slot = n; else delete OWNED[k].slot;
  }
}

function saveCollection(){
  if(!USER) return;
  const all = profiles();
  all[USER.key] = Object.assign({}, all[USER.key], {name: USER.name, owned: OWNED});   // keeps pw
  writeProfiles(all);
}

/* The gate: anything that changes the collection asks this first. */
function needSignIn(id){
  if(USER) return false;
  pendingOwn = id || "";
  showSignIn();
  return true;
}
function showSignIn(){
  if(document.getElementById("signin")) return;
  const names = Object.values(profiles()).map(p => p.name).slice(0, 8);
  const enter = ' onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();signIn();}"';
  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="signin" style="z-index:110" onclick="if(event.target===this)closeSignIn(true)">'
    + '<div class="sheet signin"><button class="x" onclick="closeSignIn(true)">&times;</button>'
    + '<div class="pokeball"></div>'
    + '<h2>Sign in to make your collection</h2>'
    + '<p>You have to sign in so we can <b>save your stuff</b> — every card you add, and where it sits in your binder.'
    + ' Your password keeps other people on this device out of your collection.</p>'
    + '<form onsubmit="signIn(event)" autocomplete="on">'
    +   '<input id="signname" maxlength="' + NAME_MAX + '" placeholder="Your name" autocomplete="username" aria-label="Your name"'
    +     ' oninput="signMode()"' + enter + '>'
    +   '<input id="signpw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"' + enter + '>'
    +   '<input id="signpw2" type="password" placeholder="Type the password again" autocomplete="new-password" aria-label="Type the password again" hidden' + enter + '>'
    +   '<div class="signhint" id="signhint"></div>'
    +   '<div class="signerr" id="signerr"></div>'
    +   '<button class="btn-gold" id="signbtn" type="submit">Sign in</button>'
    + '</form>'
    + (names.length ? '<div class="names">Signed in here before?' + names.map(n =>
        '<button type="button" onclick="signInAs(this.dataset.n)" data-n="' + esc(n) + '">' + esc(n) + '</button>').join("") + '</div>' : '')
    + '<small>Your collection saves on this device under your name. There\'s no way to reset a forgotten'
    + ' password, so pick one you\'ll remember.<br>Browsing sets, prices and card search never needs signing in.</small>'
    + '</div></div>');
  const inp = document.getElementById("signname");
  if(inp) inp.focus();
}
function closeSignIn(cancelled){
  const m = document.getElementById("signin"); if(m) m.remove();
  if(cancelled) pendingOwn = "";
}
function cleanName(v){ return String(v || "").trim().replace(/\s+/g, " ").slice(0, NAME_MAX); }

/* The box adapts as you type a name: an existing name just needs its password; a new name (or one
   made before passwords existed) needs one picked and typed twice, so a typo can't lock you out. */
function signMode(){
  const name = cleanName((document.getElementById("signname") || {}).value);
  const prof = name ? profiles()[name.toLowerCase()] : null;
  const mode = !name ? "" : !prof ? "new" : !prof.pw ? "set" : "have";
  const pw2 = document.getElementById("signpw2"), pw = document.getElementById("signpw");
  const hint = document.getElementById("signhint"), btn = document.getElementById("signbtn");
  if(!pw2) return mode;
  pw2.hidden = !(mode === "new" || mode === "set");
  pw.setAttribute("autocomplete", mode === "have" ? "current-password" : "new-password");
  hint.textContent = mode === "new" ? "New name — pick a password (at least " + PW_MIN + " characters) and type it twice."
    : mode === "set" ? prof.name + " doesn't have a password yet — pick one now." : "";
  btn.textContent = mode === "new" ? "Make my name" : mode === "set" ? "Set password & sign in" : "Sign in";
  document.getElementById("signerr").textContent = "";
  return mode;
}
function signInAs(name){
  const inp = document.getElementById("signname");
  if(inp) inp.value = name;
  signMode();
  const pw = document.getElementById("signpw");
  if(pw) pw.focus();
}
function signErr(msg, el){
  const e = document.getElementById("signerr");
  if(e) e.textContent = msg;
  if(el) el.focus();
}

const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const fromB64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
async function hashPw(pw, saltB64, iterations){
  const salt = saltB64 ? fromB64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const it = iterations || PW_ITER;
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: it}, key, 256);
  return {salt: toB64(salt), hash: toB64(bits), it: it};
}

let signBusy = false;
async function signIn(ev){
  if(ev) ev.preventDefault();
  if(signBusy) return;
  const nameIn = document.getElementById("signname"), pwIn = document.getElementById("signpw"),
        pw2In = document.getElementById("signpw2"), btn = document.getElementById("signbtn");
  if(!nameIn) return;
  const name = cleanName(nameIn.value);
  if(!name) return signErr("Type a name to sign in.", nameIn);
  if(!(window.crypto && crypto.subtle)) return signErr("This browser can't keep passwords safe here, so signing in is off. Open the site from its web address.");
  const pw = pwIn.value;
  const key = name.toLowerCase();
  const mode = signMode();
  const all = profiles();
  const prof = all[key];
  let pwRecord = null;

  if(mode === "have"){
    if(!pw) return signErr("Type your password.", pwIn);
  }else{
    if(pw.length < PW_MIN) return signErr("Pick a password with at least " + PW_MIN + " characters.", pwIn);
    if(pw !== pw2In.value){ pw2In.value = ""; return signErr("Those two passwords don't match — type it again.", pw2In); }
  }
  signBusy = true; btn.disabled = true;
  try{
    if(mode === "have"){
      const h = await hashPw(pw, prof.pw.salt, prof.pw.it);
      if(h.hash !== prof.pw.hash){ pwIn.value = ""; return signErr("That's not the password for " + prof.name + ".", pwIn); }
    }else{
      pwRecord = await hashPw(pw);
    }
  }catch(e){
    return signErr("Couldn't check the password — " + (e.message || e));
  }finally{
    signBusy = false; if(btn) btn.disabled = false;
  }

  const isNew = !prof;
  if(isNew) all[key] = {name: name, owned: {}, binder: 9};
  if(pwRecord) all[key].pw = pwRecord;

  // A collection saved on this browser before sign-in existed moves into the first name signed in.
  const old = store.get("pkOwned", null);
  let moved = 0;
  if(old && Object.keys(old).length){
    const mine = all[key], taken = {}, oldPerPage = store.get("pkBinder", 9);
    for(const k in mine.owned){ const n = slotNumber(mine.owned[k].slot, mine.binder); if(n) taken[n] = 1; }
    for(const k in old){
      if(mine.owned[k]) continue;
      const e = old[k], n = slotNumber(e.slot, oldPerPage);
      if(n && !taken[n]){ e.slot = n; taken[n] = 1; } else delete e.slot;   // one card per slot
      mine.owned[k] = e; moved++;
    }
  }
  if(!writeProfiles(all)) return;
  if(old){ localStorage.removeItem("pkOwned"); localStorage.removeItem("pkBinder"); }
  store.set("pkUser", key);
  useProfile(key, all[key]);
  keepStorage();

  closeSignIn(false);
  drawAccount(); refreshView(); redrawSheet();
  toast((isNew ? "Hi " + USER.name + "! Your collection saves on this device." : "Welcome back, " + USER.name + "!")
    + (moved ? " Moved " + moved + " card" + (moved === 1 ? "" : "s") + " you'd already saved into it." : ""));
  if(pendingOwn){
    const id = pendingOwn; pendingOwn = "";
    if(!OWNED[id] && CARDS.has(id)) toggleOwn(id);
  }
}
function signOut(){
  USER = null; OWNED = {}; pendingOwn = "";
  try{ localStorage.removeItem("pkUser"); }catch(e){}
  drawAccount(); refreshView(); redrawSheet();
}
function drawAccount(){
  const el = document.getElementById("acct"); if(!el) return;
  el.innerHTML = USER
    ? '<span class="who">' + esc(USER.name) + '</span><button class="back" onclick="signOut()">Sign out</button>'
    : '<button class="btn-gold" onclick="showSignIn()">Sign in</button>';
}
function redrawSheet(){
  if(!modalCard || !document.getElementById("modal")) return;
  const b = document.getElementById("ownbtn");
  if(b) b.outerHTML = ownBtn(modalCard.id);
  redrawQty(modalCard.id);
  redrawCopy(modalCard.id);
  redrawBinder(modalCard.id);
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("on"), 5000);
}

/* ---------------- card modal ---------------- */
let modalCard = null, modalVar = "", modalPicked = false;   // picked: the printing was chosen by hand

// what each TCGplayer printing actually looks like, so you can tell which one is in your hand
const VARIANTS = {
  normal:              ["Normal", "no shine — plain card stock"],
  holofoil:            ["Holofoil", "the artwork itself is shiny"],
  reverseHolofoil:     ["Reverse holofoil", "shiny everywhere except the artwork"],
  "1stEdition":        ["1st Edition", "has the 1st Edition stamp beside the art"],
  "1stEditionNormal":  ["1st Edition", "1st Edition stamp, no shine"],
  "1stEditionHolofoil":["1st Edition holofoil", "1st Edition stamp and shiny art"],
  unlimited:           ["Unlimited", "no 1st Edition stamp"],
  unlimitedHolofoil:   ["Unlimited holofoil", "shiny art, no 1st Edition stamp"]
};
function varLabel(k){
  if(VARIANTS[k]) return VARIANTS[k][0];
  return k.replace(/([A-Z])/g, " $1").replace(/^./, m => m.toUpperCase());
}
function varNote(k){ return VARIANTS[k] ? VARIANTS[k][1] : ""; }

function selectVar(k){
  modalVar = k;
  modalPicked = k !== HOLO_MISSING;
  const pane = document.getElementById("pricepane");
  if(pane) pane.innerHTML = priceBlock(modalCard);
}

function openCard(id){
  const c = CARDS.get(id); if(!c) return;
  closeCard();            // never stack two sheets — duplicate ids would cross their wires
  modalCard = c;
  slotEditing = false;
  const tp = (c.tcgplayer && c.tcgplayer.prices) || {};
  const withPrice = Object.keys(tp).filter(k => tp[k] && tp[k].market != null);
  modalVar = withPrice[0] || Object.keys(tp)[0] || "";
  modalPicked = false;
  const mine = OWNED[id];
  if(mine && mine.pr && tp[mine.pr]) modalVar = mine.pr;     // show the price of the copy you own
  if(c._snap) setTimeout(() => upgradeCard(id), 0);
  const typeChips = (c.types || []).map(t => '<span class="chip t" style="background:' + (TYPE_COLORS[t] || "#ccc") + '">' + esc(t) + '</span>').join("");
  const subChips  = (c.subtypes || []).map(s => '<span class="chip">' + esc(s) + '</span>').join("");

  let body = "";
  if(c.abilities && c.abilities.length){
    body += '<div class="blk"><h4>' + esc(c.abilities[0].type || "Ability") + '</h4>'
      + c.abilities.map(a => '<div class="atk"><div><div class="nm">' + esc(a.name) + '</div><div class="txt">' + esc(a.text || "") + '</div></div></div>').join("")
      + '</div>';
  }
  if(c.attacks && c.attacks.length){
    body += '<div class="blk"><h4>Attacks</h4>' + c.attacks.map(a =>
        '<div class="atk"><div><div class="nm">' + energy(a.cost) + ' ' + esc(a.name) + '</div>'
        + (a.text ? '<div class="txt">' + esc(a.text) + '</div>' : '') + '</div>'
        + '<div class="dmg">' + esc(a.damage || "") + '</div></div>').join("") + '</div>';
  }
  const wr = [];
  if(c.weaknesses)  wr.push("Weakness: " + c.weaknesses.map(w => w.type + " " + w.value).join(", "));
  if(c.resistances) wr.push("Resistance: " + c.resistances.map(w => w.type + " " + w.value).join(", "));
  if(c.retreatCost) wr.push("Retreat: " + c.retreatCost.length);
  if(wr.length) body += '<div class="blk"><div style="color:var(--dim);font-size:13px">' + esc(wr.join("   •   ")) + '</div></div>';
  if(c.rules)     body += '<div class="blk"><h4>Rules</h4><div style="color:var(--dim);font-size:13px">' + c.rules.map(esc).join("<br><br>") + '</div></div>';
  if(c.flavorText)body += '<div class="blk"><div style="font-style:italic;color:var(--dim);font-size:13px">' + esc(c.flavorText) + '</div></div>';

  const s = c.set || {};
  const total = s.printedTotal || s.total || "?";
  const idBlock = '<div class="idcard">'
    + '<div><small>Set</small><b>'
    +   (s.images && s.images.symbol ? '<img src="' + s.images.symbol + '" alt="">' : '')
    +   esc(s.name || "—") + '</b></div>'
    + '<div><small>Card number</small><b>' + esc(String(c.number)) + ' / ' + esc(String(total)) + '</b></div>'
    + '<div><small>Rarity</small><b>' + esc(c.rarity || "—") + '</b></div>'
    + '<div><small>Released</small><b>' + fmtDate(s.releaseDate) + '</b></div>'
    + (c.artist ? '<div><small>Illustrator</small><b>' + esc(c.artist) + '</b></div>' : '')
    + '</div>'
    + '<div style="margin:-6px 0 14px;display:flex;gap:8px;flex-wrap:wrap">' + ownBtn(c.id)
    + (s.id && SETS.some(x => x.id === s.id)
        ? '<button class="back" style="padding:6px 12px;font-size:13px" '
          + 'onclick="closeCard(); openSet(\'' + s.id + '\')">See the whole ' + esc(s.name) + ' set &rarr;</button>'
        : '')
    + '</div>';

  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="modal" onclick="if(event.target===this)closeCard()">'
    + '<div class="sheet"><button class="x" onclick="closeCard()">&times;</button>'
    + '<img class="hero" src="' + ((c.images && (c.images.large || c.images.small)) || "") + '" alt="' + esc(c.name) + '">'
    + '<div class="info"><h2>' + esc(c.name) + (c.hp ? ' <span style="color:var(--dim);font-size:16px">HP ' + esc(c.hp) + '</span>' : '') + '</h2>'
    + '<div class="sub">' + esc(c.supertype || "") + ' &nbsp;•&nbsp; check these against the card in your hand</div>'
    + idBlock
    + qtyBlock(c.id)
    + copyBlock(c.id)
    + binderBlock(c.id)
    + '<div id="pricepane">' + priceBlock(c) + '</div>'
    + '<div class="chips">' + typeChips + subChips + '</div>'
    + body + '</div></div></div>');
}

/* Price for the printing currently selected, plus the picker to change it. */
/* Commons, uncommons and plain rares are only printed normal and reverse holo in their set, so
   TCGplayer has no holofoil price for them — but holo versions of the same card often exist
   elsewhere (promos, McDonald's, blister "cosmos holo", illustration rares). For those cards the
   picker adds a dashed "Holofoil" choice that explains this and lists the holo printings of that
   exact name, with their prices. */
const HOLO_MISSING = "holofoilMissing";
function lacksHolo(kinds){
  return kinds.length > 0 && kinds.some(k => k === "normal" || k === "reverseHolofoil")
    && !kinds.some(k => /holofoil/i.test(k) && k !== "reverseHolofoil");
}
function priceBlock(c){
  const tp = (c.tcgplayer && c.tcgplayer.prices) || {};
  const kinds = Object.keys(tp);
  let out = "";
  const noHolo = lacksHolo(kinds);
  // normal, then holofoil, then reverse — the order the choices go from plain to shiny
  const order = ["normal", "holofoil", HOLO_MISSING, "reverseHolofoil"];
  const choices = kinds.concat(noHolo ? [HOLO_MISSING] : [])
    .sort((a, b) => (order.indexOf(a) < 0 ? 9 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 9 : order.indexOf(b)));

  if(choices.length > 1){
    out += '<div class="blk" style="border-top:0;padding-top:0"><h4>' + (OWNED[c.id] ? "Prices by printing" : "Which printing do you have?") + '</h4>'
      + '<div class="vars">' + choices.map(k => k === HOLO_MISSING
          ? '<button class="missing' + (k === modalVar ? " on" : "") + '" onclick="selectVar(\'' + k + '\')">Holofoil'
            + '<small>the artwork itself is shiny — not in this set</small></button>'
          : '<button class="' + (k === modalVar ? "on" : "") + '" onclick="selectVar(\'' + k + '\')">'
            + esc(varLabel(k))
            + '<small>' + esc(varNote(k) || (tp[k] && tp[k].market != null ? money(tp[k].market) : "no price")) + '</small>'
            + '</button>').join("")
      + '</div></div>';
  }

  if(modalVar === HOLO_MISSING){
    out += '<div class="warn"><b>No holofoil version of this card in ' + esc((c.set && c.set.name) || "this set") + '</b>'
      + 'In its set, ' + esc(c.name) + ' was only printed plain and reverse holo (shiny everywhere except the artwork), so TCGplayer has no holofoil price for it. '
      + 'If the artwork on yours is shiny, it\'s a different printing — a promo, a special collection, or an illustration rare. Holo versions of ' + esc(c.name) + ' are below; tap the one that matches yours.</div>'
      + '<div class="holoalts" id="holoalts"><div class="msg" style="padding:14px 0"><div class="spinner" style="width:22px;height:22px;margin-bottom:6px"></div>Looking for holo versions of ' + esc(c.name) + '…</div></div>';
    setTimeout(() => loadHoloAlts(c), 0);
  }

  const v = tp[modalVar];
  const mk = v ? (v.market != null ? v.market : (v.mid != null ? v.mid : v.low)) : null;
  if(modalVar === HOLO_MISSING){
    // the explanation and the list above say it all
  }else if(v && mk != null){
    out += '<div class="bigprice"><b>' + money(mk) + '</b>'
        +  '<span>' + esc(kinds.length > 1 ? varLabel(modalVar).toLowerCase() : "market price")
        +  ' &middot; TCGplayer</span></div>';
    const rows = [["low","Low"],["mid","Mid"],["high","High"],["directLow","Direct low"]]
      .filter(([k]) => v[k] != null)
      .map(([k,lab]) => '<div class="price"><small>' + lab + '</small><b>' + money(v[k]) + '</b></div>').join("");
    if(rows) out += '<div class="prices" style="margin-bottom:12px">' + rows + '</div>';
  } else if(v){
    // the printing is listed but has no sales behind it yet
    const r = cardValue(c);
    out += '<div class="bigprice est"><b>' + (r ? "~" + money(r.v) : "—") + '</b>'
        +  '<span><span class="tag">estimate</span> no sales yet for this printing</span></div>'
        +  (r ? warnBox(r, "TCGplayer lists this printing but has no sales behind it.") : "");
  } else if(!kinds.length){
    const r = cardValue(c);
    if(r && r.est){
      out += '<div class="bigprice est"><b>~' + money(r.v) + '</b>'
          +  '<span><span class="tag">estimate</span> not a real sale price</span></div>'
          +  warnBox(r);
    } else {
      out += '<div class="bigprice"><b style="color:var(--dim);font-size:18px">No price listed</b>'
          +  '<span>TCGplayer has no sales data for this card</span></div>';
    }
  }

  const cm = c.cardmarket && c.cardmarket.prices;
  if(cm && cm.trendPrice){
    out += '<div class="blk"><h4>Cardmarket (EU)</h4><div class="prices">'
      + '<div class="price"><small>trend</small><b>€' + cm.trendPrice.toFixed(2) + '</b></div>'
      + (cm.lowPrice ? '<div class="price"><small>low</small><b>€' + cm.lowPrice.toFixed(2) + '</b></div>' : '')
      + (cm.avg30 ? '<div class="price"><small>30-day avg</small><b>€' + cm.avg30.toFixed(2) + '</b></div>' : '')
      + '</div></div>';
  }
  return out;
}
async function loadHoloAlts(c){
  const box = () => document.getElementById("holoalts");
  const name = c.name;
  let cards;
  try{
    const q = 'name:"' + name.replace(/["\\]/g, " ") + '"';
    cards = (await cachedFetch("holo:" + name.toLowerCase(), () => getJSON(API + "/cards?q=" + encodeURIComponent(q)
      + "&orderBy=-set.releaseDate&pageSize=250"), fresh => {
        if(modalCard === c && modalVar === HOLO_MISSING) showHoloAlts(c, fresh.data);
      })).data;
  }catch(e){
    if(box() && modalCard === c) box().innerHTML = '<div class="msg" style="padding:14px 0">' + esc(e.message)
      + '<br><br><button class="back" onclick="loadHoloAlts(modalCard)">Try again</button></div>';
    return;
  }
  if(modalCard === c && modalVar === HOLO_MISSING) showHoloAlts(c, cards);
}
function showHoloAlts(c, cards){
  const el = document.getElementById("holoalts"); if(!el) return;
  const price = x => { const h = ((x.tcgplayer || {}).prices || {}).holofoil; return h ? (h.market != null ? h.market : h.mid) : null; };
  // the same name exactly ("Pikachu", not "Pikachu ex"), with a holofoil price, cheapest first
  const holo = cards.filter(x => x.name === c.name && x.id !== c.id && price(x) != null)
    .sort((a, b) => price(a) - price(b)).slice(0, 12);
  remember(holo);
  tileHolo = true;
  const tiles = holo.map(x => findTile(x)).join("");
  tileHolo = false;
  el.innerHTML = holo.length
    ? '<div class="found">' + tiles + '</div>'
    : '<div class="msg" style="padding:14px 0">TCGplayer doesn\'t list any holofoil ' + esc(c.name) + '. If the artwork on yours is shiny, it may be a "cosmos holo" from a blister pack or a theme deck, which TCGplayer sells separately and this price data doesn\'t include.</div>';
}
function energy(cost){
  if(!cost || !cost.length) return "";
  return cost.map(t => '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'
    + (TYPE_COLORS[t] || "#ccc") + ';vertical-align:-2px;margin-right:2px;border:1px solid rgba(0,0,0,.4)" title="' + esc(t) + '"></span>').join("");
}
function closeCard(){ const m = document.getElementById("modal"); if(m) m.remove(); }
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(document.getElementById("signin")) closeSignIn(true);
    else if(document.getElementById("modal")) closeCard();
    else if(VIEW === "set" || VIEW === "search" || VIEW === "energy" || VIEW === "collecting") showSets();
  }
});

/* ---------------- misc ---------------- */
function showSets(){
  closeCard();
  if(VIEW === "search" || VIEW === "energy" || VIEW === "collecting") qIn.value = "";   // the set list filters on the same box
  qIn.placeholder = "Search sets…";
  VIEW = "sets";
  setTab();
  renderSets();
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function fmtDate(d){
  if(!d) return "—";
  const p = d.split("/");
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (M[parseInt(p[1],10)-1] || "") + " " + parseInt(p[2],10) + ", " + p[0];
}
qIn.addEventListener("input", () => {
  if(VIEW === "search") onSearchTyping();
  else if(VIEW === "energy") drawEnergy();
  else if(VIEW === "collecting") onCollectTyping();
  else if(VIEW === "sets") renderSets();
  else showSets();                       // typing while inside a set backs out to the set list
});
qIn.addEventListener("keydown", e => {
  if(e.key === "Enter" && VIEW === "search"){ clearTimeout(typeTimer); runSearch(qIn.value.trim()); }
});
sortIn.addEventListener("change", () => { if(VIEW === "sets") renderSets(); });
document.getElementById("snap").textContent = PACK_PRICES.d || "—";
loadSets();
initAccounts();
</script>
