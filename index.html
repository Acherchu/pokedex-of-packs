<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex of Packs — Every Pokémon TCG Set</title>
<style>
  :root{
    /* Pokémon blue and yellow */
    --bg:#0a1a3f; --panel:#12295c; --panel2:#183474;
    --line:#2b4a8f; --text:#eef3ff; --dim:#a9bbe0; --gold:#ffcb05; --blue:#3d7dca;
    --navy:#0a1a3f; --red:#ee1515; --shadow:0 10px 30px rgba(2,8,24,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, #2155b4 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(255,203,5,.16) 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font:15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height:100vh;
  }
  a{color:inherit}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px 80px}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(36,85,176,.96),rgba(24,63,138,.96));backdrop-filter:blur(10px);
    border-bottom:3px solid var(--gold);
  }
  .top-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px;cursor:pointer;user-select:none}
  .pokeball{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--red) 0 47%,#fff 47% 53%,#f2f2f2 53% 100%);
    border:2px solid #0a0a0a;position:relative;flex:0 0 auto;box-shadow:0 2px 8px rgba(238,21,21,.35)}
  .pokeball:after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #0a0a0a}
  .logo span{color:var(--gold);text-shadow:2px 2px 0 var(--navy),-1px -1px 0 var(--navy),1px -1px 0 var(--navy),-1px 1px 0 var(--navy)}
  .grow{flex:1 1 auto}
  input[type=search], select{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit;
  }
  input[type=search]{min-width:230px}
  input[type=search]:focus, select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,5,.22)}
  .count{color:var(--dim);font-size:13px;white-space:nowrap}
  .tabs{display:flex;gap:4px;background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tabs button{
    background:none;border:0;color:var(--dim);font:inherit;font-size:14px;font-weight:600;
    padding:6px 14px;border-radius:8px;cursor:pointer;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--gold);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.4)}

  /* ---------- card search ---------- */
  .hint{color:var(--dim);text-align:center;padding:70px 20px}
  .hint h3{color:var(--text);font-size:22px;margin:0 0 8px}
  .hint .egs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .hint .egs button{
    background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;
    padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .hint .egs button:hover{border-color:var(--gold);color:var(--gold)}
  .found{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-top:18px}
  .find{
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:12px;padding:10px;cursor:pointer;transition:transform .15s ease,border-color .15s;
  }
  .find:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
  .find img.art{width:100%;border-radius:7px;display:block;aspect-ratio:245/342;object-fit:cover;background:var(--panel)}
  .find .fnm{font-weight:700;font-size:14px;margin:9px 0 3px;line-height:1.2}
  .find .fset{color:var(--dim);font-size:11.5px;display:flex;align-items:center;gap:5px;line-height:1.3}
  .find .fset img{width:14px;height:14px;object-fit:contain;flex:0 0 auto}
  .find .frow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:7px}
  .find .frow .rr{color:var(--dim);font-size:11px}
  .find .frow .pp{color:#7ee38a;font-weight:800;font-size:15px}
  .more{display:block;margin:26px auto 0}

  /* ---------- printing picker ---------- */
  .idcard{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;
  }
  .idcard div small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .idcard div b{font-size:14px;display:flex;align-items:center;gap:5px}
  .idcard div b img{width:16px;height:16px;object-fit:contain}
  .vars{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .vars button{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;
    padding:7px 13px;border-radius:9px;cursor:pointer;text-align:left;
  }
  .vars button:hover{border-color:var(--gold)}
  .vars button.on{border-color:var(--gold);background:rgba(255,203,5,.10);color:var(--gold);font-weight:700}
  .vars button small{display:block;font-size:11px;color:var(--dim);font-weight:400}
  .vars button.on small{color:var(--gold);opacity:.8}
  .vars button.missing{border-style:dashed}
  .holoalts .found{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
  .bigprice{
    display:flex;align-items:baseline;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:10px;
  }
  .bigprice b{font-size:30px;color:#7ee38a;font-weight:800;line-height:1}
  .bigprice span{color:var(--dim);font-size:12px}

  /* ---------- estimated prices ---------- */
  .bigprice.est{border-color:rgba(255,203,5,.45);background:rgba(255,203,5,.07)}
  .bigprice.est b{color:var(--gold)}
  .tag{
    display:inline-block;background:rgba(255,203,5,.18);color:var(--gold);border:1px solid rgba(255,203,5,.4);
    border-radius:5px;padding:1px 5px;font-size:10px;font-weight:800;text-transform:uppercase;
    letter-spacing:.5px;vertical-align:1px;
  }
  .warn{
    background:rgba(255,203,5,.08);border:1px solid rgba(255,203,5,.32);border-radius:10px;
    padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#e3d9b4;line-height:1.5;
  }
  .warn b{color:var(--gold);display:block;margin-bottom:3px}
  .card .pr.est{color:var(--gold);background:rgba(6,18,46,.9)}
  .find .frow .pp.est{color:var(--gold);font-size:14px}
  .find .frow .pp.est .tag{font-size:9px;padding:0 4px;margin-left:2px}
  .legend{
    display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  }
  .legend b{color:var(--gold);font-weight:800}

  /* ---------- the rest of the tabs ----------
     Same row, same buttons — "View more" just reveals the ones past the first two. */
  .tabs .extra{display:none}
  .tabs.open .extra{display:block}
  .tabs .morebtn{color:var(--gold);opacity:.85}
  .tabs .morebtn:hover{opacity:1;color:var(--gold)}

  /* ---------- owning ---------- */
  .addbar{display:flex;gap:6px;margin-top:8px}
  .find{display:flex;flex-direction:column}
  .find .addbar{margin-top:auto;padding-top:8px}   /* buttons line up even when a rarity wraps */
  .addbar button{
    flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;
    font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:8px;cursor:pointer;
  }
  .addbar button.own.yes{border-color:#7ee38a;color:#7ee38a;background:rgba(126,227,138,.10)}
  .ownbtn{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;
    font-size:13px;font-weight:700;padding:6px 12px;border-radius:9px;cursor:pointer;
  }
  .ownbtn:hover{border-color:#7ee38a;color:#7ee38a}
  .ownbtn.yes{border-color:#7ee38a;color:#7ee38a;background:rgba(126,227,138,.10)}
  .addbar button.own:hover{border-color:#7ee38a;color:#7ee38a}
  .tagline{color:var(--gold);font-weight:600;font-size:15px;margin:-2px 0 12px}
  .find .fslot{color:var(--gold);font-size:11.5px;font-weight:600;margin-top:3px}
  .find .fprint{color:#9fd0ff;font-size:11.5px;font-weight:600;margin-top:3px}
  .find .fprint.unset{color:var(--dim);font-weight:400;font-style:italic}
  .copy .vars{margin-bottom:6px}
  .copy .copyhint{color:var(--dim);font-size:12.5px;line-height:1.45}
  .copy .copyhint b{color:var(--gold)}

  /* ---------- binder slot (card sheet) ---------- */
  .binder{margin-bottom:6px}
  .slotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .slotadd{
    width:42px;height:42px;border-radius:50%;border:2px dashed var(--gold);background:rgba(255,203,5,.08);
    color:var(--gold);font:inherit;font-size:26px;font-weight:700;line-height:1;cursor:pointer;padding:0;
  }
  .slotadd:hover{background:rgba(255,203,5,.2)}
  .slothint{color:var(--dim);font-size:13px}
  .slotnum{font-size:24px;font-weight:800;color:var(--gold);margin-right:4px}
  .slotrow input{
    width:110px;background:var(--panel);border:1px solid var(--gold);color:var(--text);border-radius:9px;
    padding:8px 10px;font:inherit;font-size:15px;outline:none;
  }
  .slotrow .back,.slotrow .btn-gold{padding:7px 13px;font-size:13px}
  .sloterr{color:#ffb4b4;font-size:13px;font-weight:600;margin-top:7px}
  .sloterr:empty{display:none}
  .rankmark{
    position:absolute;top:6px;left:6px;background:var(--gold);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.45);
    font-weight:900;font-size:12px;border-radius:999px;min-width:22px;height:22px;line-height:22px;text-align:center;padding:0 6px;
  }
  .ownmark{
    position:absolute;top:6px;right:6px;background:rgba(126,227,138,.92);color:#0c2412;
    font-weight:900;font-size:11px;border-radius:999px;min-width:19px;height:19px;line-height:19px;text-align:center;padding:0 5px;
  }
  .find .fqty{color:#7ee38a;font-size:11.5px;font-weight:600;margin-top:3px}
  .qtyrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .qtyrow button{
    width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    font:inherit;font-size:20px;font-weight:700;line-height:1;cursor:pointer;padding:0;
  }
  .qtyrow button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
  .qtyrow button:disabled{opacity:.4;cursor:default}
  .qtyrow input{
    width:64px;text-align:center;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;
    padding:7px 6px;font:inherit;font-size:17px;font-weight:700;outline:none;
  }
  .qtyrow input:focus{border-color:var(--gold)}
  .qtyrow span{color:var(--dim);font-size:13px}
  .qtyrow span b{color:#7ee38a}

  /* ---------- set grid ---------- */
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:28px}
  .set{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:16px 14px 13px;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;transition:transform .16s ease, border-color .16s, box-shadow .16s;
    text-align:center;
  }
  .set:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
  .set .logo-box{height:74px;display:flex;align-items:center;justify-content:center}
  .set .logo-box img{max-height:74px;max-width:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .set .nm{font-weight:700;font-size:15px;line-height:1.25;display:flex;align-items:center;justify-content:center;gap:6px}
  .set .nm img{width:16px;height:16px;object-fit:contain}
  .set .ser{color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:-6px}
  .set .meta{color:var(--dim);font-size:12px;display:flex;justify-content:center;gap:8px}
  .set .meta b{color:#d6e2ff;font-weight:600}
  .set .val{
    margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--dim);
  }
  .set .val b{color:#7ee38a;font-size:16px;font-weight:800}
  .set .val .per{font-size:11px}
  .set .val .pending{font-size:11px;opacity:.6;font-style:italic}
  .set .val .stock{display:block;font-size:11px;color:var(--dim);margin-top:1px}
  .set .val .stock.warn{color:var(--gold)}
  .set .val .deal{display:block;font-size:11px;font-weight:700;color:var(--gold);margin-top:2px}
  .dealbox{margin:10px 0 0;border:1px solid rgba(255,203,5,.5);background:rgba(255,203,5,.08);border-radius:12px;padding:10px 14px}
  .dealbox.none{border-color:var(--line);background:transparent;color:var(--dim);font-size:13px}
  .dealbox .dh{color:var(--gold);font-weight:800;font-size:14px;margin-bottom:4px}
  .dealbox .drow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid rgba(255,203,5,.2)}
  .dealbox .dh + .drow{border-top:0}
  .dealbox .dp{color:var(--gold);font-weight:800;font-size:22px;line-height:1;min-width:92px}
  .dealbox .dp span{font-size:11px;font-weight:600}
  .dealbox .dt{flex:1 1 240px;color:var(--dim);font-size:13px;line-height:1.45}
  .dealbox .dt b{color:var(--text)}
  .dealbox .dt b.ds{color:var(--gold)}
  .dealbox .dlink{color:var(--gold);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
  .dealbox .dlink:hover{text-decoration:underline}
  .dealbox .dn{color:var(--dim);font-size:11px;margin-top:4px}
  .buybox{margin:14px 0 0;background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .buybox .bp{font-size:26px;font-weight:800;color:#7ee38a;line-height:1}
  .buybox .bt{flex:1 1 240px;color:var(--dim);font-size:13px;line-height:1.45}
  .buybox .bt b{color:var(--text)}
  .buybox.sus{border-color:rgba(255,203,5,.45);background:rgba(255,203,5,.07)}
  .buybox.sus .bp{color:var(--gold)}
  .buybtn{display:inline-block;background:linear-gradient(180deg,#ffd633,#f0b90b);color:var(--navy);font-weight:800;
    text-decoration:none;border-radius:10px;padding:9px 14px;font-size:14px;white-space:nowrap}
  .buybtn:hover{filter:brightness(1.08)}
  .buybox .eta{flex:1 1 100%;display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px;color:var(--dim);font-size:13px;line-height:1.45}
  .buybox .eta b{color:var(--text)}

  /* ---------- set detail ---------- */
  .back{
    background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:9px 14px;cursor:pointer;font-size:14px;font-family:inherit;
  }
  .back:hover{border-color:var(--gold);color:var(--gold)}
  .set-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:26px 0 10px;
    background:linear-gradient(180deg,var(--panel2),transparent);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  .set-head img.big{max-height:96px;max-width:300px;object-fit:contain}
  .set-head h1{margin:0 0 6px;font-size:26px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13px}
  .stats b{color:var(--text);display:block;font-size:15px;font-weight:700}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 4px}
  .btn-gold{
    background:linear-gradient(180deg,#ffd633,#f0b90b);color:var(--navy);border:0;border-radius:10px;
    padding:10px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;
    box-shadow:0 4px 14px rgba(240,185,11,.28);
  }
  .btn-gold:hover{filter:brightness(1.08)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px;scroll-margin-top:140px}
  .card{
    cursor:pointer;border-radius:10px;position:relative;transition:transform .15s ease;
    background:var(--panel);aspect-ratio:245/342;overflow:hidden;border:1px solid var(--line);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card:hover{transform:translateY(-5px) scale(1.03);z-index:2;box-shadow:var(--shadow)}
  .card .no{
    position:absolute;left:6px;bottom:6px;background:rgba(6,18,46,.85);border-radius:6px;
    padding:2px 6px;font-size:11px;color:#fff;opacity:0;transition:opacity .15s;
  }
  .card:hover .no{opacity:1}
  .card .pr{
    position:absolute;right:6px;bottom:6px;background:rgba(6,18,46,.88);border-radius:6px;
    padding:2px 6px;font-size:11px;font-weight:700;color:#7ee38a;
  }

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(4,12,32,.82);backdrop-filter:blur(6px);
    display:flex;padding:24px;overflow:auto}
  /* centred with margin:auto, not align-items:center — that clips the top of a sheet taller than
     the screen (like the card sheet) where it can't be scrolled back to */
  .modal > .sheet{margin:auto}
  .sheet{
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:18px;max-width:900px;width:100%;padding:24px;display:flex;gap:26px;flex-wrap:wrap;
    box-shadow:var(--shadow);position:relative;
  }
  .sheet .x{position:absolute;right:14px;top:12px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1}
  .sheet .x:hover{color:#fff}
  .sheet img.hero{width:300px;max-width:100%;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);align-self:flex-start}
  .info{flex:1 1 320px;min-width:280px}
  .info h2{margin:0 0 4px;font-size:26px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px}
  .chip.t{border-color:transparent;color:#111;font-weight:700}
  .blk{border-top:1px solid var(--line);padding:12px 0}
  .blk h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
  .atk{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
  .atk .nm{font-weight:700}
  .atk .txt{color:var(--dim);font-size:13px}
  .atk .dmg{font-weight:800;font-size:18px}
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .price{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .price small{display:block;color:var(--dim);font-size:11px;text-transform:capitalize}
  .price b{font-size:17px;color:#7ee38a}

  .msg{padding:60px 0;text-align:center;color:var(--dim)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;
    margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pull{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:40px 0 10px}

  /* ---------- card search: energy types ---------- */
  .etypes{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 4px}
  .etypes button{
    display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .etypes button:hover{border-color:var(--dim)}
  .etypes button i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.45)}
  .etypes button.on{border-color:currentColor;background:rgba(255,255,255,.08)}

  /* ---------- energy tab ---------- */
  .ekind{display:flex;gap:4px;background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:3px}
  .ekind button{background:none;border:0;color:var(--dim);font:inherit;font-size:13.5px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer}
  .ekind button:hover{color:var(--text)}
  .ekind button.on{background:var(--gold);color:var(--navy)}
  .etypes button b{font-weight:400;color:var(--dim);font-size:12px}

  /* ---------- collecting ---------- */
  .colhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .colhead h2{margin:0;font-size:26px}
  .colevo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
  .colevo input{accent-color:var(--gold);width:17px;height:17px}
  .colline{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 2px}
  .colline button{background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13.5px;
    font-weight:600;padding:6px 13px;border-radius:999px;cursor:pointer}
  .colline button b{font-weight:400;color:var(--dim);font-size:12px;margin-left:3px}
  .colline button.off{opacity:.45;text-decoration:line-through}
  .colline button:hover{border-color:var(--gold)}
  .colline i{color:var(--dim);font-style:normal;align-self:center}
  .future{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
  .future h3{margin:0 0 4px;font-size:18px}
  .future p{color:var(--dim);font-size:13px;margin:6px 0;line-height:1.5}
  .future p b{color:var(--text)}
  .ftable{overflow-x:auto;margin:10px 0}
  .ftable table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
  .ftable th,.ftable td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .ftable th:first-child,.ftable td:first-child{text-align:left}
  .ftable th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .ftable td.lo{color:#ffb4b4}.ftable td.mid{color:var(--gold);font-weight:700}.ftable td.hi{color:#7ee38a}
  .ftable tr.now td{color:var(--text);font-weight:700}
  .ftable td.up{color:#7ee38a}.ftable td.down{color:#ffb4b4}
  /* price history chart — series #1baf7a (validated against the #12295c panel: lightness band,
     chroma, 3:1 contrast all pass; the site's #ffcb05 gold failed the lightness band) */
  .hchart{position:relative;margin:12px 0 6px;touch-action:pan-y}
  .hchart svg{display:block;width:100%;height:auto;overflow:visible}
  .hchart .grid{stroke:rgba(255,255,255,.08);stroke-width:1}
  .hchart .axis{fill:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .hchart .line{fill:none;stroke:#1baf7a;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .hchart .wash{fill:#1baf7a;opacity:.1}
  .hchart .dot{fill:#1baf7a;stroke:#12295c;stroke-width:2}
  .hchart .endlab{fill:var(--text);font-size:12.5px;font-weight:700}
  .hchart .cross{stroke:rgba(255,255,255,.35);stroke-width:1}
  .hchart .tip{position:absolute;pointer-events:none;background:var(--navy);border:1px solid var(--line);border-radius:9px;
    padding:7px 10px;font-size:12.5px;color:var(--dim);white-space:nowrap;box-shadow:var(--shadow);transform:translate(-50%,-110%)}
  .hchart .tip b{display:block;color:var(--text);font-size:15px}
  .hchart .tip i{display:inline-block;width:12px;height:2px;background:#1baf7a;vertical-align:middle;margin-right:5px;font-style:normal}
  .hchart:focus{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
  details.htable summary{cursor:pointer;color:var(--dim);font-size:13px;margin-top:4px}

  /* ---------- accounts ---------- */
  #acct{display:flex;align-items:center;gap:8px}
  #acct .who{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
  #acct .btn-gold{padding:7px 14px;font-size:13px}
  #acct .back{padding:6px 11px;font-size:13px}
  .signin{max-width:430px;flex-direction:column;align-items:center;text-align:center;gap:0;padding:30px 28px 24px}
  .signin .pokeball{width:52px;height:52px;margin-bottom:14px}
  .signin .pokeball:after{width:15px;height:15px}
  .signin h2{margin:0 0 10px;font-size:24px}
  .signin p{color:var(--dim);margin:0 0 18px;line-height:1.55}
  .signin p b{color:var(--gold)}
  .signin small{color:var(--dim);margin-top:14px;font-size:12px;line-height:1.5}
  .signin form{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
  .signin form input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:15px;outline:none;
  }
  .signin form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,5,.22)}
  .signin form .btn-gold{margin-top:2px}
  .signin form .btn-gold:disabled{opacity:.6;cursor:default}
  .signin .signhint{font-size:12.5px;color:var(--gold);min-height:0;text-align:left}
  .signin .signerr{font-size:13px;color:#ffb4b4;font-weight:600;text-align:left}
  .signin .signhint:empty, .signin .signerr:empty{display:none}
  .signin .names{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:12px;color:var(--dim);align-items:center}
  .signin .names button{
    background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;
    padding:5px 12px;border-radius:999px;cursor:pointer;
  }
  .signin .names button:hover{border-color:var(--gold);color:var(--gold)}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:200;opacity:0;pointer-events:none;
    background:var(--panel2);border:1px solid var(--gold);color:var(--text);border-radius:10px;padding:10px 16px;
    font-size:14px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

const CARDS = new Map();     // every card seen this session, id -> card (what openCard reads)

function remember(cards){ for(const c of cards) CARDS.set(c.id, c); }

/* ---------------- fetching ---------------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* The free pokemontcg.io tier throws intermittent 500s, so every call retries. */
async function getJSON(url, tries){
  tries = tries || 5;
  let last = "";
  for(let i=0;i<tries;i++){
    try{
      const r = await fetch(url);
      if(r.ok) return await r.json();
      if(r.status === 429){ last = "rate limited"; await sleep(2000 * (i+1)); continue; }
      if(r.status >= 500){ last = "server error " + r.status; await sleep(300 * (i+1)); continue; }
      throw new Error("Request failed (" + r.status + ")");
    }catch(e){
      if(/^Request failed/.test(e.message)) throw e;
      last = e.message || "network error";
      await sleep(500 * (i+1));
    }
  }
  throw new Error("The Pokémon TCG API isn't answering right now (" + last + ").");
}
/* ---------------- saved copies of card data ----------------
   Sets, set card lists and search results are kept on the device so they show instantly — but
   every time one is used, the API is asked again in the background. If the answer changed (new
   prices, a new set), the saved copy is replaced and whatever is on screen redraws in place.
   Only a failed or unchanged answer leaves things as they are.

   Storage is IndexedDB ("pokedex-cache"), NOT localStorage: a set's cards are hundreds of KB, and
   localStorage holds the accounts, which must never be squeezed out. Up to CACHE_MAX entries are
   kept, least recently used dropped first. If IndexedDB is unavailable (some private windows),
   everything just loads from the network like before.

   The user asked for prices to be fresh every time they're looked at, so every use checks —
   CACHE_RECHECK_MS is 0. (Only a check already under way is shared, not started twice.) */
const CACHE_MAX = 250, CACHE_RECHECK_MS = 0, CACHE_RETRY = [4000, 15000, 45000];
const cacheMem = new Map();      // key -> {s: JSON string, d: parsed}, this visit
const cacheChecked = new Map();  // key -> when it was last checked against the API, this visit
const cacheFlight = new Map();   // key -> the API request already under way
let cacheDbP = null;
function cacheDb(){
  if(!cacheDbP){
    cacheDbP = new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error("no IndexedDB"));
      const r = indexedDB.open("pokedex-cache", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("c", {keyPath: "k"}).createIndex("t", "t");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("IndexedDB blocked"));
    });
    cacheDbP.catch(() => {});
  }
  return cacheDbP;
}
async function cacheRead(key){
  try{
    const db = await cacheDb();
    return await new Promise(res => {
      const q = db.transaction("c").objectStore("c").get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}
async function cacheWrite(key, str){
  try{
    const db = await cacheDb();
    const tx = db.transaction("c", "readwrite"), st = tx.objectStore("c");
    st.put({k: key, t: Date.now(), s: str});
    const n = st.count();
    n.onsuccess = () => {                         // over the limit: drop the least recently used
      let extra = n.result - CACHE_MAX;
      if(extra <= 0) return;
      const cur = st.index("t").openCursor();
      cur.onsuccess = () => { const c = cur.result; if(c && extra-- > 0){ c.delete(); c.continue(); } };
    };
  }catch(e){ /* no saved copy this time — the data on screen is still right */ }
}

/* Returns the saved copy right away if there is one (and checks the API behind it, calling
   onUpdate(freshData) if the answer changed); with no saved copy, waits for the API. */
async function cachedFetch(key, fetcher, onUpdate){
  let hit = cacheMem.get(key);
  if(!hit){
    const row = await cacheRead(key);
    if(row){ try{ hit = {s: row.s, d: JSON.parse(row.s)}; cacheMem.set(key, hit); }catch(e){ hit = null; } }
  }
  const check = () => {
    if(cacheFlight.has(key)) return cacheFlight.get(key);
    const job = (async () => {
      const fresh = await fetcher();
      const str = JSON.stringify(fresh);
      const before = cacheMem.get(key);
      const changed = !before || before.s !== str;
      cacheMem.set(key, {s: str, d: fresh});
      cacheChecked.set(key, Date.now());
      cacheWrite(key, str);                       // also refreshes its "last used" time
      return {data: fresh, changed: changed};
    })();
    cacheFlight.set(key, job);
    job.then(() => cacheFlight.delete(key), () => cacheFlight.delete(key));
    return job;
  };
  if(!hit) return (await check()).data;
  if(Date.now() - (cacheChecked.get(key) || 0) >= CACHE_RECHECK_MS){
    // the free API often fails a request outright; a failed check tries again rather than
    // leaving an out-of-date copy on screen
    const background = attempt => check()
      .then(r => { if(r.changed && onUpdate) onUpdate(r.data); })
      .catch(() => { if(attempt < CACHE_RETRY.length) setTimeout(() => background(attempt + 1), CACHE_RETRY[attempt]); });
    background(0);
  }
  return hit.d;
}

async function loadSets(){
  // the old 24-hour copy in localStorage: use it once as the starting copy, then free that space
  try{
    const old = localStorage.getItem("pkSets");
    if(old){
      const o = JSON.parse(old);
      localStorage.removeItem("pkSets");
      if(o && o.d && !(await cacheRead("sets"))) await cacheWrite("sets", JSON.stringify(o.d));
    }
  }catch(e){ try{ localStorage.removeItem("pkSets"); }catch(e2){} }
  try{
    SETS = await cachedFetch("sets", async () => (await getJSON(API + "/sets?pageSize=250")).data, fresh => {
      SETS = fresh;
      if(current) current = SETS.find(x => x.id === current.id) || current;
      if(VIEW === "sets") keepScroll(renderSets);
    });
    renderSets();
  }catch(e){
    app.innerHTML = '<div class="msg">' + esc(e.message)
      + '<br><br>(This site pulls live data from pokemontcg.io — check you\'re online.)'
      + '<br><br><button class="btn-gold" onclick="loadSets()">Try again</button></div>';
  }
}
function sortByNumber(all){
  return all.slice().sort((a,b)=>{
    const na = parseInt(a.number,10), nb = parseInt(b.number,10);
    if(isNaN(na) || isNaN(nb)) return String(a.number).localeCompare(String(b.number));
    return na - nb || String(a.number).localeCompare(String(b.number));
  });
}
async function fetchSetCards(setId){
  let all = [], page = 1;
  while(true){
    const d = await getJSON(API + "/cards?q=set.id:" + encodeURIComponent(setId) + "&pageSize=250&page=" + page);
    all = all.concat(d.data);
    if(d.data.length < 250) break;
    page++;
  }
  return sortByNumber(all);
}
async function loadCards(setId){
  const all = await cachedFetch("set:" + setId, () => fetchSetCards(setId), fresh => {
    remember(fresh);
    if(VIEW === "set" && current && current.id === setId) refreshSetBody(fresh);
  });
  remember(all);
  return all;
}
/* Redraw without jumping: keep the scroll position (and, for a set, what's typed in its filters). */
function keepScroll(fn){
  const y = window.scrollY;
  fn();
  window.scrollTo({top: y});
}
function refreshSetBody(fresh){
  const shown = document.getElementById("shown");
  currentCards = fresh;
  if(shown && /^your pull/.test(shown.textContent)) return;   // don't wipe a booster pack mid-reveal
  const vals = ["cq","cr","ct"].map(id => { const el = document.getElementById(id); return el ? el.value : ""; });
  keepScroll(() => {
    renderSetBody();
    ["cq","cr","ct"].forEach((id, i) => { const el = document.getElementById(id); if(el && vals[i]) el.value = vals[i]; });
    drawCards();
  });
}

/* ---------------- saved stuff ----------------
   Your collection is saved under the name you signed in with, in this browser's localStorage
   (see "accounts" below). Each card in it stores a small snapshot (name, set, number, art, price)
   so the collection renders in full without re-fetching every card. */
const store = {
  get(k, fallback){
    try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; }
  },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let OWNED = {};                             // cardId -> snapshot, for whoever is signed in

function snapOf(c){
  const r = cardValue(c);
  return {
    id: c.id, n: c.name, num: String(c.number), set: (c.set && c.set.name) || "",
    sid: (c.set && c.set.id) || "",
    // both sizes are stored rather than derived: older cards are images.pokemontcg.io/<set>/<n>.png
    // with a _hires twin, newer ones are images.scrydex.com/... where no such twin exists
    img: (c.images && c.images.small) || "", big: (c.images && c.images.large) || "",
    rar: c.rarity || "", t: (c.types || [])[0] || "",
    v: r ? +r.v.toFixed(2) : null, est: !!(r && r.est),
    vs: printPrices(c)                        // each printing's price, so "your copy" can be picked later
  };
}
/* A card's price per printing ("normal", "holofoil", "reverseHolofoil", "1stEditionHolofoil"…),
   market, else mid, else low. null when TCGplayer lists the printing without a price. */
function printPrices(c){
  const tp = (c && c.tcgplayer && c.tcgplayer.prices) || {}, out = {};
  for(const k in tp){
    const v = tp[k] || {};
    const n = [v.market, v.mid, v.low].find(x => typeof x === "number" && x > 0);
    out[k] = n != null ? +n.toFixed(2) : null;
  }
  return out;
}
const PRINT_ORDER = ["normal","holofoil","reverseHolofoil","1stEditionNormal","1stEdition","1stEditionHolofoil","unlimited","unlimitedHolofoil"];
function sortPrintings(keys){
  const at = k => { const i = PRINT_ORDER.indexOf(k); return i < 0 ? 99 : i; };
  return keys.slice().sort((a, b) => at(a) - at(b));
}
/* --- owning --- */
function owns(id){ return !!OWNED[id]; }
function toggleOwn(id, ev){
  if(ev) ev.stopPropagation();               // the tile behind opens the card sheet
  if(needSignIn(id)) return;                 // no account, nowhere to save it
  if(OWNED[id]) delete OWNED[id];
  else{
    const c = CARDS.get(id);
    if(!c) return;
    const e = OWNED[id] = snapOf(c);
    // picked a printing in the price list first, then "I have this card"? that's the one you have
    if(modalCard && modalCard.id === id && modalPicked && e.vs && modalVar in e.vs) applyCopy(e, modalVar);
  }
  saveCollection();
  refreshView();
  const b = document.getElementById("ownbtn");   // the card sheet, if it's open
  if(b) b.outerHTML = ownBtn(id);
  redrawQty(id);
  redrawCopy(id);
  redrawBinder(id);
  if(modalCard && modalCard.id === id && document.getElementById("pricepane")){
    const keep = modalPicked; selectVar(modalVar); modalPicked = keep;   // heading follows owned / not owned
  }
}
function ownBtn(id){
  const have = owns(id);
  return '<button class="ownbtn' + (have ? " yes" : "") + '" id="ownbtn" onclick="toggleOwn(\'' + id + '\',event)">'
    + (have ? "✓ In your collection" : "✓ I have this card") + '</button>';
}

/* --- how many you have ---
   OWNED[id].qty is how many copies of that card you have (missing = 1, so older saves are one
   copy). Every copy shares the card's picked printing. A card's worth in the collection is its
   value × qty; the collection shows cards and copies separately. The − button stops at 1 —
   taking the card out is still the "In your collection" button, so a slip can't delete it. */
const QTY_MAX = 999;
function qtyOf(e){ return e && e.qty > 1 ? e.qty : 1; }
function ownMark(id){ const n = qtyOf(OWNED[id]); return n > 1 ? "×" + n : "✓"; }
function qtyBlock(id){
  const e = OWNED[id];
  if(!e) return '<div id="qtypane"></div>';
  const n = qtyOf(e), q = "'" + id + "'";
  return '<div id="qtypane" class="blk"><h4>How many do you have?</h4><div class="qtyrow">'
    + '<button onclick="setQty(' + q + ',' + (n - 1) + ')"' + (n <= 1 ? " disabled" : "") + ' aria-label="One less">−</button>'
    + '<input id="qtyin" type="number" min="1" max="' + QTY_MAX + '" step="1" inputmode="numeric" value="' + n + '" aria-label="How many"'
    +   ' onchange="setQty(' + q + ',this.value)" onkeydown="if(event.key===&quot;Enter&quot;)this.blur()">'
    + '<button onclick="setQty(' + q + ',' + (n + 1) + ')"' + (n >= QTY_MAX ? " disabled" : "") + ' aria-label="One more">+</button>'
    + (n > 1 && e.v != null ? '<span>' + n + ' × ' + money(e.v) + ' = <b>' + money(e.v * n) + '</b></span>' : '')
    + '</div></div>';
}
function redrawQty(id){
  const el = document.getElementById("qtypane");
  if(el) el.outerHTML = qtyBlock(id);
}
function setQty(id, n){
  const e = OWNED[id]; if(!e) return;
  if(needSignIn()) return;
  n = Math.round(Number(n));
  if(!Number.isFinite(n) || n < 1) n = 1;
  if(n > QTY_MAX) n = QTY_MAX;
  if(n === 1) delete e.qty; else e.qty = n;
  saveCollection();
  redrawQty(id);
  refreshView();
}

/* --- your copy: which printing you own ---
   A card's value in the collection starts as its cheapest printing. Picking the printing you
   actually have — normal, holofoil, reverse holofoil, 1st edition… — sets pr on the OWNED entry
   and uses that printing's price (from vs, saved with the card), so the collection's total is
   right. Tap the chosen one again to un-pick it. Cards saved before vs existed get it filled in
   from the API the next time their sheet opens (upgradeCard). */
function applyCopy(e, key){
  e.pr = key;
  const p = e.vs && e.vs[key];
  if(p != null){ e.v = p; e.est = false; }
}
function clearCopy(e){
  delete e.pr;
  const vals = Object.values(e.vs || {}).filter(x => x != null);
  if(vals.length){ e.v = Math.min(...vals); e.est = false; }
}
function copyBlock(id){
  const e = OWNED[id];
  if(!e) return '<div id="copypane"></div>';
  const card = CARDS.get(id);
  if(!e.vs || !Object.keys(e.vs).length){
    if(card && !card._snap) e.vs = printPrices(card);
    else return '<div id="copypane" class="blk copy"><h4>Your copy</h4><div class="copyhint">Checking which printings this card came in…</div></div>';
  }
  const keys = sortPrintings(Object.keys(e.vs));
  if(!keys.length) return '<div id="copypane"></div>';
  if(keys.length === 1){
    return '<div id="copypane" class="blk copy"><h4>Your copy</h4><div class="copyhint">This card was only printed one way: <b>'
      + esc(varLabel(keys[0])) + '</b>' + (varNote(keys[0]) ? ' — ' + esc(varNote(keys[0])) : '') + '.</div></div>';
  }
  const q = "'" + id + "'";
  return '<div id="copypane" class="blk copy"><h4>Your copy — which one do you have?</h4>'
    + '<div class="vars">' + keys.map(k => '<button class="' + (e.pr === k ? "on" : "") + '" onclick="setCopy(' + q + ',\'' + k + '\')">'
        + esc(varLabel(k)) + '<small>' + esc(varNote(k) ? varNote(k) + " · " : "") + (e.vs[k] != null ? money(e.vs[k]) : "no price") + '</small></button>').join("")
    + '</div>'
    + '<div class="copyhint">' + (e.pr
        ? 'Counted in your collection at <b>' + (e.v != null ? money(e.v) : "—") + '</b>. Tap it again to un-pick.'
        : 'Pick the one in your hand so it\'s valued right — until then it counts as the cheapest, <b>' + (e.v != null ? money(e.v) : "—") + '</b>.')
    + (lacksHolo(keys) ? '<br>Shiny artwork? That\'s a different printing — tap <b>Holofoil</b> in the prices below to find it.' : '')
    + '</div></div>';
}
function redrawCopy(id){
  const el = document.getElementById("copypane");
  if(el) el.outerHTML = copyBlock(id);
}
function setCopy(id, key){
  const e = OWNED[id]; if(!e) return;
  if(needSignIn()) return;
  if(e.pr === key) clearCopy(e); else applyCopy(e, key);
  saveCollection();
  redrawCopy(id);
  redrawQty(id);
  if(modalCard && modalCard.id === id && e.pr && ((modalCard.tcgplayer || {}).prices || {})[e.pr]) selectVar(e.pr);
  else if(modalCard && modalCard.id === id) selectVar(modalVar);        // redraw the price heading
  refreshView();
}
/* A card opened from a saved snapshot (after a reload) has no price data; fetch the full card so
   its printings and prices can be shown, and fill in the saved card's vs if it's missing. */
async function upgradeCard(id){
  let full;
  try{
    full = await cachedFetch("card:" + id, async () => (await getJSON(API + "/cards/" + encodeURIComponent(id))).data);
  }catch(e){
    const el = document.getElementById("copypane");
    if(el && modalCard && modalCard.id === id) el.innerHTML = '<h4>Your copy</h4><div class="copyhint">Couldn\'t load this card\'s printings right now.</div>';
    return;
  }
  if(!full) return;
  const had = CARDS.get(id);
  if(!had || had._snap) CARDS.set(id, full);
  const e = OWNED[id];
  if(e && (!e.vs || !Object.keys(e.vs).length)){ e.vs = printPrices(full); saveCollection(); }
  if(modalCard && modalCard.id === id && modalCard._snap && document.getElementById("modal")){
    const sheet = document.querySelector("#modal"), y = sheet ? sheet.scrollTop : 0;
    openCard(id);                               // redraw the sheet with real prices
    const again = document.querySelector("#modal"); if(again) again.scrollTop = y;
  }
}

/* --- binder slots ---
   Where a card sits in your real binder: one number, kept on its OWNED entry as slot (1, 2, 3…).
   In the card sheet an empty slot is a "+" button; tap it, type the number, Save. One card per
   number — a number that's already taken says which card has it and doesn't save. Taking a card
   out of the collection drops its slot with it.
   Older saves stored slot as {p: page, s: pocket} with 4, 9 or 12 pockets a page (profile.binder).
   Those are converted to the same position number when a profile is read (slotNumber) — never
   thrown away. */
let slotEditing = false;                    // is the card sheet's slot box open for typing
function slotNumber(sl, perPage){
  if(typeof sl === "number") return sl >= 1 ? Math.floor(sl) : null;
  if(sl && sl.p >= 1 && sl.s >= 1) return (sl.p - 1) * ([4, 9, 12].indexOf(perPage) >= 0 ? perPage : 9) + sl.s;
  return null;
}
function binderBlock(id){
  const e = OWNED[id];
  if(!e) return '<div id="binderpane"></div>';   // not in the collection — nothing to place
  const n = slotNumber(e.slot), q = "'" + id + "'";
  let row;
  if(slotEditing){
    row = '<input id="slotin" type="number" min="1" step="1" inputmode="numeric" placeholder="Slot number" value="' + (n || "") + '"'
      + ' onkeydown="if(event.key===&quot;Enter&quot;)saveSlot(' + q + ');if(event.key===&quot;Escape&quot;){event.stopPropagation();editSlot(' + q + ',false)}">'
      + '<button class="btn-gold" onclick="saveSlot(' + q + ')">Save</button>'
      + '<button class="back" onclick="editSlot(' + q + ',false)">Cancel</button>';
  }else if(n){
    row = '<span class="slotnum">#' + n + '</span>'
      + '<button class="back" onclick="editSlot(' + q + ',true)">Change</button>'
      + '<button class="back" onclick="clearSlot(' + q + ')">Remove</button>';
  }else{
    row = '<button class="slotadd" onclick="editSlot(' + q + ',true)" title="Put it in a binder slot" aria-label="Put it in a binder slot">+</button>'
      + '<span class="slothint">Put it in a binder slot</span>';
  }
  return '<div class="blk binder" id="binderpane"><h4>Binder slot</h4><div class="slotrow">' + row + '</div>'
    + '<div class="sloterr" id="sloterr"></div></div>';
}
function redrawBinder(id){
  const el = document.getElementById("binderpane");
  if(el) el.outerHTML = binderBlock(id);
}
function editSlot(id, on){
  slotEditing = on;
  redrawBinder(id);
  const inp = document.getElementById("slotin");
  if(inp){ inp.focus(); inp.select(); }
}
function saveSlot(id){
  const e = OWNED[id]; if(!e) return;
  if(needSignIn()) return;
  const inp = document.getElementById("slotin"), err = document.getElementById("sloterr");
  const n = Number(inp && inp.value);
  if(!Number.isInteger(n) || n < 1 || n > 99999){
    if(err) err.textContent = "Type a slot number, like 12.";
    if(inp) inp.focus();
    return;
  }
  for(const k in OWNED){
    if(k !== id && slotNumber(OWNED[k].slot) === n){
      if(err) err.textContent = "Slot " + n + " already has " + OWNED[k].n + " (" + OWNED[k].set + ").";
      if(inp){ inp.focus(); inp.select(); }
      return;
    }
  }
  e.slot = n;
  slotEditing = false;
  saveCollection();
  redrawBinder(id);
  refreshView();                            // the collection tile shows the slot too
}
function clearSlot(id){
  const e = OWNED[id]; if(!e) return;
  if(needSignIn()) return;
  delete e.slot;
  slotEditing = false;
  saveCollection();
  redrawBinder(id);
  refreshView();
}

// a saved snapshot is enough to re-open the card sheet after a reload
function snapToCard(s){
  return {
    id:s.id, name:s.n, number:s.num, rarity:s.rar, types:s.t ? [s.t] : [],
    images:{small:s.img, large:s.big || s.img},
    set:{id:s.sid, name:s.set}, tcgplayer:null, cardmarket:null, _snap:true
  };
}

/* ---------------- card search ----------------
   Searches every card ever printed by name. Each result is one specific printing, because
   knowing which one you own is the whole point — the same Charizard exists in dozens of sets
   at wildly different values. */
const PAGE = 60;
let searchTerm = "", searchPage = 1, searchTotal = 0, searchHits = [], searchBusy = false, searchSeq = 0;
/* Card search narrows by energy type rather than by set: pick Fire and only Fire Pokémon come back.
   The type goes into the API query itself, so counts and "Load more" stay right, and a type on its
   own (no name typed) browses every card of that type, newest first. */
const ENERGY = ["Grass","Fire","Water","Lightning","Psychic","Fighting","Darkness","Metal","Fairy","Dragon","Colorless"];
let searchType = "";

function showSearch(){
  closeCard();
  VIEW = "search";
  setTab();
  qIn.placeholder = "Search every card…";
  qIn.value = searchTerm;
  countEl.textContent = searchTotal ? searchTotal.toLocaleString("en-US") + " printings" : "";
  renderSearch();
  qIn.focus();
}
const TAB_OF = {sets:"tab-packs", set:"tab-packs", search:"tab-cards", energy:"tab-energy", collecting:"tab-collecting", owned:"tab-owned"};
const EXTRA_TABS = ["tab-collecting", "tab-owned"];
function setTab(){
  const active = TAB_OF[VIEW];
  for(const id in TAB_OF) document.getElementById(TAB_OF[id]).classList.remove("on");
  if(active) document.getElementById(active).classList.add("on");
  if(EXTRA_TABS.indexOf(active) >= 0) openMore(true);   // never hide the section you're in
  sortIn.style.display = VIEW === "sets" ? "" : "none";
  qIn.style.display = (VIEW === "sets" || VIEW === "set" || VIEW === "search" || VIEW === "energy" || VIEW === "collecting") ? "" : "none";
}
function openMore(yes){
  document.getElementById("tabs").classList.toggle("open", yes);
  document.getElementById("tab-more").textContent = yes ? "Fewer ‹" : "View more ›";
}
function toggleMore(){
  openMore(!document.getElementById("tabs").classList.contains("open"));
}

/* Re-draw whatever is on screen after the collection changes. */
function refreshView(){
  if(document.getElementById("holoalts") && modalCard) loadHoloAlts(modalCard);   // holo list in the card sheet
  if(VIEW === "owned") renderOwned();
  else if(VIEW === "search") drawFound();
  else if(VIEW === "energy") drawEnergy();
  else if(VIEW === "collecting") keepScroll(renderCollecting);
  else if(VIEW === "set") drawCards();
}
function exampleSearch(t){ qIn.value = t; runSearch(t); }

let typeTimer = null;
function onSearchTyping(){
  clearTimeout(typeTimer);
  const t = qIn.value.trim();
  typeTimer = setTimeout(() => runSearch(t), 350);
}
function searchReady(term){ return term.length >= 2 || !!searchType; }
function pickEnergy(t){
  searchType = searchType === t ? "" : t;       // tap the chosen type again to clear it
  runSearch(qIn.value.trim());
}
async function runSearch(term){
  searchTerm = term;
  if(!searchReady(term)){ searchHits = []; searchTotal = 0; renderSearch(); return; }
  const seq = ++searchSeq;
  searchPage = 1; searchBusy = true;
  const what = [searchType ? searchType + " type" : "", term ? "“" + term + "”" : ""].filter(Boolean).join(" · ");
  app.innerHTML = energyBar() + '<div class="msg"><div class="spinner"></div>Looking for ' + esc(what) + '…</div>';
  try{
    const d = await fetchPage(term, 1, seq);
    if(seq !== searchSeq) return;            // a newer search already started
    searchHits = d.data; searchTotal = d.totalCount;
    remember(d.data);
  }catch(e){
    if(seq !== searchSeq) return;
    app.innerHTML = energyBar() + '<div class="msg">' + esc(e.message)
      + '<br><br><button class="btn-gold" onclick="runSearch(' + JSON.stringify(term).replace(/"/g, "&quot;") + ')">Try again</button></div>';
    searchBusy = false;
    return;
  }
  searchBusy = false;
  renderSearch();
}
function fetchPage(term, page, seq){
  // quoted wildcards, so "mr. mime" and partial words both work
  const parts = [];
  if(term.length >= 2) parts.push('name:"*' + term.replace(/["\\]/g, " ") + '*"');
  if(searchType) parts.push("types:" + searchType);
  const q = parts.join(" ");
  const url = API + "/cards?q=" + encodeURIComponent(q) + "&orderBy=-set.releaseDate,number&pageSize=" + PAGE + "&page=" + page;
  const key = "search:" + (searchType || "") + "|" + term.toLowerCase() + "|" + page;
  return cachedFetch(key, () => getJSON(url), fresh => {
    // only if that exact search is still the one on screen
    if(seq !== searchSeq || VIEW !== "search") return;
    remember(fresh.data);
    const start = (page - 1) * PAGE;
    if(start > searchHits.length) return;
    searchHits = searchHits.slice(0, start).concat(fresh.data, searchHits.slice(start + PAGE));
    searchTotal = fresh.totalCount;
    keepScroll(renderSearch);
  });
}
async function moreResults(){
  if(searchBusy) return;
  searchBusy = true;
  const btn = document.getElementById("more");
  if(btn){ btn.textContent = "Loading…"; btn.disabled = true; }
  try{
    const d = await fetchPage(searchTerm, searchPage + 1, searchSeq);
    searchPage++;
    searchHits = searchHits.concat(d.data);
    remember(d.data);
    renderSearch();
  }catch(e){
    if(btn){ btn.textContent = "Couldn't load more — retry"; btn.disabled = false; }
  }
  searchBusy = false;
}
function renderSearch(){
  VIEW = "search";
  setTab();
  if(!searchReady(searchTerm)){
    countEl.textContent = "";
    app.innerHTML = energyBar() + '<div class="hint" style="padding-top:40px"><h3>Find any card ever printed</h3>'
      + 'Type a name above, pick a Pokémon type, or both. Every printing comes back separately — set, card number and rarity —<br>'
      + 'so you can pick the exact one you own and see what it is worth.'
      + '<div class="egs">'
      + ['Charizard','Pikachu','Umbreon','Mew','Rayquaza','Mr. Mime'].map(n =>
          '<button onclick="exampleSearch(\'' + n + '\')">' + n + '</button>').join("")
      + '</div></div>';
    return;
  }
  countEl.textContent = searchTotal.toLocaleString("en-US") + " printing" + (searchTotal === 1 ? "" : "s");
  if(!searchHits.length){
    app.innerHTML = energyBar() + '<div class="hint" style="padding-top:40px"><h3>No '
      + (searchType ? esc(searchType) + '-type ' : '') + 'card' + (searchTerm.length >= 2 ? ' called “' + esc(searchTerm) + '”' : 's') + '</h3>'
      + (searchType && searchTerm ? 'Try another energy type, or All types.' : 'Check the spelling, or try part of the name.') + '</div>';
    return;
  }
  app.innerHTML =
      energyBar()
    + '<div class="tools">'
    +   '<span class="count" id="fshown"></span>'
    +   estLegend(searchHits)
    + '</div>'
    + '<div class="found" id="found"></div>'
    + (searchHits.length < searchTotal
        ? '<button class="btn-gold more" id="more" onclick="moreResults()">Load more ('
          + (searchTotal - searchHits.length).toLocaleString("en-US") + ' left)</button>'
        : '');
  drawFound();
}
/* ---------------- collecting ----------------
   Pick a Pokémon and see every card of it ever printed — Charizard, Charizard ex, Dark Charizard,
   M Charizard-EX… — optionally with its whole evolution line, what collecting all of them costs,
   what's already in your collection, and what that total might become.

   Cards: name:"<Pokémon>" supertype:Pokémon (a quoted name matches it as a word, so "Mew" doesn't
   pull in Mewtwo), every page, through the saved-copy cache (col:<name>). If nothing matches what
   was typed, a wildcard search finds the Pokémon the typing is part of ("chariz" → Charizard).
   Evolutions: the cards' own evolvesFrom / evolvesTo names, reduced to the species (colBase strips
   ex / V / GX, Mega, Dark, Alolan, "Blaine's" …), followed out up to 3 steps, at most 12 Pokémon.

   Value: each card at its cheapest printing (cardValue — estimates count, and are marked).
   The years ahead: there is no price history in this data and nobody can predict card prices, so
   it shows three labelled what-ifs, not a forecast — prices falling 6% a year, growing 4%, growing
   12% — next to the one real signal available: Cardmarket's price trend against its 30-day average
   for these cards. */
const COL_RATES = {lo: -0.06, mid: 0.04, hi: 0.12}, COL_YEARS = [1, 2, 3, 5, 10];
const COL_MAX_SPECIES = 12, COL_EXAMPLES = ["Charizard","Pikachu","Eevee","Gengar","Mewtwo","Umbreon"];
const COL_PREFIX = /^(?:Dark|Light|Shining|Radiant|Alolan|Galarian|Hisuian|Paldean|Mega|M|Detective|Surfing|Flying|Imposter|Special Delivery|Team Rocket's|[A-Z][A-Za-z.]*'s)\s+/;
let colName = "", colCards = {}, colEvo = true, colHidden = new Set(), colSort = "line", colSeq = 0;
let colBusy = false, colLineBusy = false, colLineDone = false, colError = "", colFuture = false, colTypeTimer = null;
const colMissing = new Set();
let colHistory = false;          // is the price-history panel open   // evolutions that couldn't be loaded (API failed) — offered as a retry

function colBase(n){
  let x = species(n), prev;
  do{ prev = x; x = x.replace(COL_PREFIX, "").trim(); }while(x && x !== prev);
  return x;
}
function showCollecting(){
  closeCard();
  if(VIEW !== "collecting") qIn.value = colName;
  VIEW = "collecting"; setTab();
  qIn.placeholder = "Choose a Pokémon…";
  renderCollecting();
}
function onCollectTyping(){
  clearTimeout(colTypeTimer);
  const t = qIn.value.trim();
  colTypeTimer = setTimeout(() => pickSpecies(t), 500);
}
function exampleCollect(n){ qIn.value = n; pickSpecies(n); }

async function fetchAllCards(q){
  let all = [], page = 1;
  while(true){
    const d = await getJSON(API + "/cards?q=" + encodeURIComponent(q) + "&orderBy=-set.releaseDate&pageSize=250&page=" + page);
    all = all.concat(d.data);
    if(d.data.length < 250 || page >= 8) break;
    page++;
  }
  return all;
}
function speciesCards(name, seq){
  const q = 'name:"' + name.replace(/["\\]/g, " ") + '" supertype:Pokémon';
  return cachedFetch("col:" + name.toLowerCase(), () => fetchAllCards(q), fresh => {
    remember(fresh);
    if(seq === colSeq && colCards[name]){ colCards[name] = fresh; if(VIEW === "collecting") keepScroll(renderCollecting); }
  });
}
async function pickSpecies(term){
  term = String(term || "").trim().replace(/\s+/g, " ");
  if(term.toLowerCase() === colName.toLowerCase() && Object.keys(colCards).length) return;
  const seq = ++colSeq;
  colError = ""; colLineDone = false; colHidden.clear(); colMissing.clear();
  if(term.length < 2){ colName = ""; colCards = {}; colBusy = false; if(VIEW === "collecting") renderCollecting(); return; }
  colBusy = true; colName = term; colCards = {};
  if(VIEW === "collecting") renderCollecting();
  try{
    let name = term, cards = await speciesCards(term, seq);
    if(seq !== colSeq) return;
    if(cards.length){
      // the name as it's printed ("Mr. Mime", not "mr. mime")
      const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
      const hit = cards.map(c => re.exec(c.name)).find(Boolean);
      if(hit) name = hit[0];
    }else{
      const found = await cachedFetch("colfind:" + term.toLowerCase(), async () =>
        (await getJSON(API + "/cards?q=" + encodeURIComponent('name:"*' + term.replace(/["\\]/g, " ") + '*" supertype:Pokémon')
          + "&orderBy=-set.releaseDate&pageSize=60")).data);
      if(seq !== colSeq) return;
      const tally = {};
      for(const c of found){ const b = colBase(c.name); if(b.toLowerCase().includes(term.toLowerCase())) tally[b] = (tally[b] || 0) + 1; }
      const best = Object.entries(tally).sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0];
      if(!best) throw new Error("No Pokémon called “" + term + "” — check the spelling.");
      name = best[0];
      cards = await speciesCards(name, seq);
      if(seq !== colSeq) return;
    }
    remember(cards);
    colName = name; colCards = {}; colCards[name] = cards;
    colBusy = false;
    if(VIEW === "collecting") renderCollecting();
    if(colEvo) loadLine(seq);
  }catch(e){
    if(seq !== colSeq) return;
    colBusy = false; colError = e.message;
    if(VIEW === "collecting") renderCollecting();
  }
}
async function loadLine(seq){
  if(colLineBusy || colLineDone) return;
  colLineBusy = true;
  if(VIEW === "collecting") keepScroll(renderCollecting);
  const known = new Set(Object.keys(colCards).map(n => n.toLowerCase()));
  let frontier = Object.keys(colCards);
  for(let step = 0; step < 3 && frontier.length; step++){
    const next = new Set();
    for(const n of frontier) for(const c of colCards[n] || []){
      // only this Pokémon's own cards — a TAG TEAM like "Charizard & Braixen-GX" would drag in
      // Braixen's whole line
      if(colBase(c.name).toLowerCase() !== n.toLowerCase()) continue;
      if(c.evolvesFrom) next.add(colBase(c.evolvesFrom));
      for(const t of c.evolvesTo || []) next.add(colBase(t));
    }
    // skip variants of a Pokémon already in the line ("Charizard G" is Charizard's cards again)
    const word = (big, small) => new RegExp("(^|[^a-z])" + small.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z]|$)").test(big.toLowerCase());
    const todo = [...next].filter(n => n && !known.has(n.toLowerCase()) && ![...known].some(k => word(n, k)))
      .slice(0, Math.max(0, COL_MAX_SPECIES - known.size));
    if(!todo.length) break;
    todo.forEach(n => known.add(n.toLowerCase()));
    let got = await Promise.allSettled(todo.map(n => speciesCards(n, seq)));
    if(seq !== colSeq){ colLineBusy = false; return; }
    // the free API fails whole requests now and then; give the ones that failed another go
    const failed = todo.filter((n, i) => got[i].status === "rejected");
    if(failed.length){
      await sleep(3000);
      const again = await Promise.allSettled(failed.map(n => speciesCards(n, seq)));
      if(seq !== colSeq){ colLineBusy = false; return; }
      got = got.map((r, i) => r.status === "rejected" ? again[failed.indexOf(todo[i])] : r);
    }
    const added = [];
    got.forEach((r, i) => {
      if(r.status === "fulfilled" && r.value.length){ remember(r.value); colCards[todo[i]] = r.value; added.push(todo[i]); colMissing.delete(todo[i]); }
      else if(r.status === "rejected") colMissing.add(todo[i]);
    });
    frontier = added;
    if(VIEW === "collecting") keepScroll(renderCollecting);
  }
  colLineBusy = false;
  colLineDone = true;
  if(seq === colSeq && VIEW === "collecting") keepScroll(renderCollecting);
}
async function retryColMissing(){
  const seq = colSeq, names = [...colMissing];
  colMissing.clear(); colLineBusy = true; keepScroll(renderCollecting);
  const got = await Promise.allSettled(names.map(n => speciesCards(n, seq)));
  if(seq !== colSeq) return;
  got.forEach((r, i) => {
    if(r.status === "fulfilled" && r.value.length){ remember(r.value); colCards[names[i]] = r.value; }
    else if(r.status === "rejected") colMissing.add(names[i]);
  });
  colLineBusy = false;
  if(VIEW === "collecting") keepScroll(renderCollecting);
}
function setColEvo(on){
  colEvo = !!on;
  renderCollecting();
  if(colEvo && colName && !colLineDone) loadLine(colSeq);
}
function toggleColSpecies(n){
  if(colHidden.has(n)) colHidden.delete(n); else colHidden.add(n);
  keepScroll(renderCollecting);
}
/* Where each Pokémon sits in the line: 0 for a basic, +1 per evolution, from the cards' evolvesFrom. */
function colDepths(){
  const names = Object.keys(colCards), depth = {};
  const fromOf = n => {
    const t = {};
    for(const c of colCards[n]) if(c.evolvesFrom){ const b = colBase(c.evolvesFrom); t[b] = (t[b] || 0) + 1; }
    const best = Object.entries(t).sort((a, b) => b[1] - a[1])[0];
    return best ? best[0] : null;
  };
  const d = (n, hops) => {
    if(n in depth) return depth[n];
    if(hops > 6) return 0;
    const f = fromOf(n);
    const match = f && names.find(x => x.toLowerCase() === f.toLowerCase());
    return depth[n] = match ? d(match, hops + 1) + 1 : (f ? 1 : 0);
  };
  names.forEach(n => d(n, 0));
  return depth;
}
function colVisible(){
  const depth = colDepths();
  const names = Object.keys(colCards).filter(n => (colEvo || n === colName) && !colHidden.has(n))
    .sort((a, b) => depth[a] - depth[b] || a.localeCompare(b));
  const seen = new Set(), list = [];
  names.forEach((n, i) => (colCards[n] || []).forEach(c => { if(!seen.has(c.id)){ seen.add(c.id); list.push({c: c, line: i}); } }));
  return {names: names, depth: depth, list: list};
}
function colSortList(list){
  const v = x => { const r = cardValue(x.c); return r ? r.v : null; };
  const date = x => (x.c.set && x.c.set.releaseDate) || "";
  const out = list.slice();
  if(colSort === "line") out.sort((a, b) => a.line - b.line || date(b).localeCompare(date(a)));
  if(colSort === "new")  out.sort((a, b) => date(b).localeCompare(date(a)));
  if(colSort === "old")  out.sort((a, b) => date(a).localeCompare(date(b)));
  if(colSort === "hi" || colSort === "lo") out.sort((a, b) => (v(a) == null) - (v(b) == null) || (colSort === "hi" ? v(b) - v(a) : v(a) - v(b)));
  return out.map(x => x.c);
}
function renderCollecting(){
  if(VIEW !== "collecting") return;
  const head = '<div class="set-head" style="margin-top:22px"><div style="flex:1"><h1>Collecting</h1>'
    + '<div class="tagline">Pick a Pokémon and see every card of it — what collecting them all costs, and where that could go</div></div></div>';
  const examples = '<div class="egs">' + COL_EXAMPLES.map(n => '<button onclick="exampleCollect(\'' + n + '\')">' + n + '</button>').join("") + '</div>';
  countEl.textContent = "";
  if(!colName){
    app.innerHTML = head + '<div class="hint" style="padding-top:34px"><h3>Which Pokémon do you want to collect?</h3>'
      + 'Type its name in the box at the top, or pick one:' + examples + '</div>';
    return;
  }
  if(colError){
    app.innerHTML = head + '<div class="hint" style="padding-top:34px"><h3>' + esc(colError) + '</h3>Try another name:' + examples
      + '<div class="egs"><button class="btn-gold" onclick="colName=\'\';pickSpecies(qIn.value)">Try again</button></div></div>';
    return;
  }
  if(colBusy){
    app.innerHTML = head + '<div class="msg"><div class="spinner"></div>Finding every ' + esc(colName) + ' card…</div>';
    return;
  }
  const vis = colVisible(), cards = vis.list;
  const others = Object.keys(colCards).filter(n => n !== colName);
  const vals = cards.map(x => cardValue(x.c));
  const total = vals.reduce((t, r) => t + (r ? r.v : 0), 0);
  const estN = vals.filter(r => r && r.est).length, noPrice = vals.filter(r => !r).length;
  const mine = cards.filter(x => owns(x.c.id));
  const mineVal = mine.reduce((t, x) => { const r = cardValue(x.c); return t + (r ? r.v : 0); }, 0);
  countEl.textContent = cards.length + " cards";

  const lineChips = colEvo
    ? '<div class="colline">' + vis.names.concat([...colHidden].filter(n => colCards[n])).filter((n, i, a) => a.indexOf(n) === i)
        .sort((a, b) => vis.depth[a] - vis.depth[b]).map((n, i, a) =>
          (i && vis.depth[n] > vis.depth[a[i - 1]] ? '<i>→</i>' : '')
          + '<button class="' + (colHidden.has(n) ? "off" : "") + '" data-n="' + esc(n) + '" onclick="toggleColSpecies(this.dataset.n)" title="'
          + (colHidden.has(n) ? "Add back" : "Leave out") + '">' + esc(n) + '<b>' + colCards[n].length + '</b></button>').join("")
        + (colLineBusy ? '<i><span class="spinner" style="display:inline-block;width:13px;height:13px;margin:0 5px -2px 0;border-width:2px"></span>finding its evolutions…</i>'
           : colMissing.size ? '<button onclick="retryColMissing()">Couldn\'t load ' + esc([...colMissing].join(", ")) + ' — try again</button>'
           : !others.length ? '<i>' + esc(colName) + ' doesn\'t evolve from or into anything</i>' : '')
        + '</div>'
    : '';

  app.innerHTML = head
    + '<div class="set-head" style="margin-top:14px;display:block">'
    +   '<div class="colhead"><h2>' + esc(colName) + '</h2>'
    +     '<label class="colevo"><input type="checkbox"' + (colEvo ? " checked" : "") + ' onchange="setColEvo(this.checked)">Also collect its evolutions</label>'
    +   '</div>'
    +   lineChips
    +   '<div class="stats" style="margin-top:12px">'
    +     '<div>Cards to collect<b>' + cards.length + '</b></div>'
    +     '<div>To collect them all<b style="color:' + (estN ? "var(--gold)" : "#7ee38a") + '">' + (estN ? "~" : "") + money(total) + '</b></div>'
    +     '<div>You already have<b>' + mine.length + ' <span style="font-size:12px;color:var(--dim);font-weight:400">(' + money(mineVal) + ')</span></b></div>'
    +     '<div>Still to get<b style="color:#7ee38a">' + (estN ? "~" : "") + money(Math.max(0, total - mineVal)) + '</b></div>'
    +   '</div>'
    +   '<div style="color:var(--dim);font-size:12px;margin-top:6px">Each card counted at its cheapest version.'
    +     (estN ? ' ' + estN + ' of them have no sale price yet, so they\'re estimates (marked ~).' : '')
    +     (noPrice ? ' ' + noPrice + ' have no price at all and count as $0.' : '') + '</div>'
    + '</div>'
    + '<div class="tools">'
    +   '<button class="btn-gold" onclick="colHistory=!colHistory;keepScroll(renderCollecting)">' + (colHistory ? "Hide the price history" : "📊 How prices have changed") + '</button>'
    +   '<button class="btn-gold" onclick="colFuture=!colFuture;keepScroll(renderCollecting)">' + (colFuture ? "Hide the value estimate" : "📈 Estimated value in the coming years") + '</button>'
    +   '<select aria-label="Sort" onchange="colSort=this.value;keepScroll(renderCollecting)">'
    +     [["line","Evolution order"],["new","Newest first"],["old","Oldest first"],["hi","Price: high to low"],["lo","Price: low to high"]]
            .map(o => '<option value="' + o[0] + '"' + (o[0] === colSort ? " selected" : "") + '>' + o[1] + '</option>').join("")
    +   '</select>'
    +   estLegend(cards.map(x => x.c))
    + '</div>'
    + (colHistory ? '<div class="future" id="colhist">' + colHistoryHTML(cards.map(x => x.c)) + '</div>' : '')
    + (colFuture ? colFutureHTML(cards.map(x => x.c), total, estN) : '')
    + '<div class="found">' + colSortList(cards).map(findTile).join("") + '</div>';
  if(colHistory) drawHistoryChart();
}
/* ---- price history ----
   price-history.json is built by update-price-history.py from tcgcsv.com's daily TCGplayer
   snapshots (nothing free goes back before Feb 2024): {d: [dates], c: {setId: {number: [cents…]}}},
   each card at its cheapest printing's market price that day. It's a separate file, fetched only
   when this panel opens, through the saved-copy cache — so it doesn't slow the rest of the site, and
   opening index.html straight from disk just can't show it.
   The line is the SAME cards on every date: only cards with a price on every snapshot and today
   count, so a new set arriving doesn't look like prices rising. Today's point is the live price. */
let historyData = null, historyError = "", historyBusy = false;
function loadHistory(){
  if(historyData || historyBusy) return;
  historyBusy = true; historyError = "";
  cachedFetch("price-history", async () => {
    const r = await fetch("price-history.json", {cache: "no-cache"});
    if(!r.ok) throw new Error("price history file missing (" + r.status + ")");
    return r.json();
  }, fresh => { historyData = fresh; if(VIEW === "collecting" && colHistory) keepScroll(renderCollecting); })
    .then(d => { historyData = d; })
    .catch(e => { historyError = location.protocol === "file:" ? "The price history only loads on the website, not from a file on your computer." : "Couldn't load the price history — " + e.message; })
    .finally(() => { historyBusy = false; if(VIEW === "collecting" && colHistory) keepScroll(renderCollecting); });
}
function historyRow(c){
  if(!historyData) return null;
  const i = c.id.indexOf("-");
  const sid = c.id.slice(0, i), num = c.id.slice(i + 1);
  const bySet = historyData.c[sid];
  if(!bySet) return null;
  return bySet[num] || bySet[/^\d+$/.test(num) ? String(parseInt(num, 10)) : num] || null;
}
function historySeries(cards){
  const dates = historyData.d, sums = dates.map(() => 0);
  let today = 0, used = 0, partial = 0, none = 0;
  for(const c of cards){
    const row = historyRow(c), now = cardPrice(c);
    if(!row){ none++; continue; }
    if(row.some(v => !v) || now == null){ partial++; continue; }
    row.forEach((v, i) => sums[i] += v / 100);
    today += now; used++;
  }
  const pts = dates.map((d, i) => ({t: new Date(d + "T12:00:00"), v: sums[i], label: fmtDate(d.replace(/-/g, "/"))}));
  pts.push({t: new Date(), v: today, label: "Today", today: true});
  return {pts: pts, used: used, partial: partial, none: none};
}
function colHistoryHTML(cards){
  if(!historyData){
    loadHistory();
    return '<h3>How prices have changed</h3>' + (historyError
      ? '<p>' + esc(historyError) + '</p><p><button class="back" onclick="historyError=\'\';loadHistory()">Try again</button></p>'
      : '<div class="msg" style="padding:18px 0"><div class="spinner"></div>Loading price history…</div>');
  }
  const h = historySeries(cards), pts = h.pts;
  const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
  if(h.used === 0){
    return '<h3>How prices have changed</h3><p>None of these cards have prices going back to '
      + esc(pts[0].label) + ' — they\'re all too new, or TCGplayer never listed them.</p>';
  }
  const first = pts[0], last = pts[pts.length - 1];
  const years = (last.t - first.t) / 31557600000;
  const cagr = first.v > 0 ? Math.pow(last.v / first.v, 1 / years) - 1 : null;
  const rows = pts.map((p, i) => {
    const prev = i ? pts[i - 1].v : null, ch = prev ? p.v / prev - 1 : null;
    return '<tr' + (p.today ? ' class="now"' : '') + '><td>' + esc(p.label) + '</td><td>' + money(p.v) + '</td>'
      + '<td class="' + (ch == null ? "" : ch >= 0 ? "up" : "down") + '">' + (ch == null ? "—" : pct(ch)) + '</td></tr>';
  }).join("");
  return '<h3>How prices have changed</h3>'
    + '<p>What the same <b>' + h.used + '</b> ' + esc(colName) + ' card' + (h.used === 1 ? "" : "s") + ' cost on each date, at TCGplayer market prices. '
    + 'From ' + esc(first.label) + ' to today they went from <b>' + money(first.v) + '</b> to <b>' + money(last.v) + '</b> — '
    + '<b style="color:' + (last.v >= first.v ? "#7ee38a" : "#ffb4b4") + '">' + pct(last.v / first.v - 1) + '</b>'
    + (cagr != null && years > 1 ? ', about ' + pct(cagr) + ' a year' : '') + '.</p>'
    + '<div class="hchart" id="hchart" tabindex="0" aria-label="Line chart of what these cards cost on each date; use the arrow keys to read each point"></div>'
    + '<details class="htable"><summary>Show as a table</summary><div class="ftable"><table><thead><tr><th>Date</th><th>These cards cost</th><th>Change since the last date</th></tr></thead><tbody>'
    + rows + '</tbody></table></div></details>'
    + '<p>Price history only goes back to February 2024 — that\'s as far as free price records go. '
    + (h.partial ? h.partial + ' newer card' + (h.partial === 1 ? " isn't" : "s aren't") + ' in the line because ' + (h.partial === 1 ? "it" : "they") + ' didn\'t have a price on every date. ' : '')
    + (h.none ? h.none + ' card' + (h.none === 1 ? " has" : "s have") + ' no price records at all. ' : '')
    + 'Past prices don\'t tell you what happens next.</p>';
}
function drawHistoryChart(){
  const box = document.getElementById("hchart");
  if(!box || !historyData) return;
  const cards = colVisible().list.map(x => x.c);
  const pts = historySeries(cards).pts;
  const W = Math.max(300, box.clientWidth), H = 240, L = 62, R = 74, T = 14, B = 30;
  const t0 = pts[0].t.getTime(), t1 = pts[pts.length - 1].t.getTime();
  const maxV = Math.max(...pts.map(p => p.v), 1);
  const step = (() => { const raw = maxV / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))); return [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw); })();
  const top = Math.ceil(maxV / step) * step;
  const x = t => L + (t - t0) / (t1 - t0 || 1) * (W - L - R);
  const y = v => T + (1 - v / top) * (H - T - B);
  const short = v => v >= 1000 ? "$" + (v / 1000).toLocaleString("en-US", {maximumFractionDigits: 1}) + "k" : "$" + Math.round(v);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-hidden="true">';
  for(let v = 0; v <= top + 1e-9; v += step){
    svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>'
      + '<text class="axis" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + short(v) + '</text>';
  }
  // x labels: first, last, and each date that has room
  let lastX = -1e9;
  pts.forEach((p, i) => {
    const px = x(p.t.getTime()), label = p.today ? "Today" : p.label.replace(/ \d+,/, "");
    if(i && i < pts.length - 1 && (px - lastX < 62 || x(pts[pts.length - 1].t.getTime()) - px < 62)) return;
    svg += '<text class="axis" x="' + px + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(label) + '</text>';
    lastX = px;
  });
  const path = pts.map((p, i) => (i ? "L" : "M") + x(p.t.getTime()).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  svg += '<path class="wash" d="' + path + ' L' + x(t1) + ' ' + y(0) + ' L' + x(t0) + ' ' + y(0) + ' Z"/>'
    + '<path class="line" d="' + path + '"/>'
    + pts.map(p => '<circle class="dot" r="4.5" cx="' + x(p.t.getTime()) + '" cy="' + y(p.v) + '"/>').join("")
    + '<text class="endlab" x="' + (x(t1) + 10) + '" y="' + (y(pts[pts.length - 1].v) + 4) + '">' + money(pts[pts.length - 1].v) + '</text>'
    + '<line class="cross" id="hcross" y1="' + T + '" y2="' + (H - B) + '" x1="-9" x2="-9" style="display:none"/>'
    + '</svg><div class="tip" id="htip" hidden></div>';
  box.innerHTML = svg;
  const tip = box.querySelector("#htip"), cross = box.querySelector("#hcross");
  let focusIdx = pts.length - 1;
  const show = i => {
    focusIdx = i;
    const p = pts[i], prev = i ? pts[i - 1] : null, px = x(p.t.getTime());
    const scale = box.clientWidth / W;
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
    tip.hidden = false;
    tip.textContent = "";
    const b = document.createElement("b"); b.textContent = money(p.v);
    const line = document.createElement("div");
    const key = document.createElement("i"); line.appendChild(key); line.appendChild(document.createTextNode(p.today ? "Today" : p.label));
    tip.appendChild(b); tip.appendChild(line);
    if(prev && prev.v){
      const ch = p.v / prev.v - 1, d = document.createElement("div");
      d.textContent = (ch >= 0 ? "+" : "") + (ch * 100).toFixed(1) + "% since " + (prev.today ? "then" : prev.label);
      tip.appendChild(d);
    }
    tip.style.left = Math.min(Math.max(px * scale, 70), box.clientWidth - 70) + "px";
    tip.style.top = (y(p.v) * scale) + "px";
  };
  const hide = () => { tip.hidden = true; cross.style.display = "none"; };
  const nearest = ev => {
    const r = box.getBoundingClientRect(), mx = (ev.clientX - r.left) / (r.width / W);
    let best = 0;
    pts.forEach((p, i) => { if(Math.abs(x(p.t.getTime()) - mx) < Math.abs(x(pts[best].t.getTime()) - mx)) best = i; });
    return best;
  };
  box.onpointermove = ev => show(nearest(ev));
  box.onpointerdown = ev => show(nearest(ev));
  box.onpointerleave = hide;
  box.onblur = hide;
  box.onfocus = () => show(focusIdx);
  box.onkeydown = ev => {
    if(ev.key === "ArrowRight"){ ev.preventDefault(); show(Math.min(pts.length - 1, focusIdx + 1)); }
    if(ev.key === "ArrowLeft"){ ev.preventDefault(); show(Math.max(0, focusIdx - 1)); }
  };
}
