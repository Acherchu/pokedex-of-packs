<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex of Packs — Every Pokémon TCG Set</title>
<style>
  :root{
    /* Pokémon blue and yellow */
    --bg:#0a1a3f; --panel:#12295c; --panel2:#183474;
    --line:#2b4a8f; --text:#eef3ff; --dim:#a9bbe0; --gold:#ffcb05; --blue:#3d7dca;
    --navy:#0a1a3f; --red:#ee1515; --shadow:0 10px 30px rgba(2,8,24,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, #2155b4 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(255,203,5,.16) 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font:15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height:100vh;
  }
  a{color:inherit}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px 80px}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,rgba(36,85,176,.96),rgba(24,63,138,.96));backdrop-filter:blur(10px);
    border-bottom:3px solid var(--gold);
  }
  .top-in{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.5px;cursor:pointer;user-select:none}
  .pokeball{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,var(--red) 0 47%,#fff 47% 53%,#f2f2f2 53% 100%);
    border:2px solid #0a0a0a;position:relative;flex:0 0 auto;box-shadow:0 2px 8px rgba(238,21,21,.35)}
  .pokeball:after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #0a0a0a}
  .logo span{color:var(--gold);text-shadow:2px 2px 0 var(--navy),-1px -1px 0 var(--navy),1px -1px 0 var(--navy),-1px 1px 0 var(--navy)}
  .grow{flex:1 1 auto}
  input[type=search], select{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit;
  }
  input[type=search]{min-width:230px}
  input[type=search]:focus, select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,5,.22)}
  .count{color:var(--dim);font-size:13px;white-space:nowrap}
  .tabs{display:flex;gap:4px;background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tabs button{
    background:none;border:0;color:var(--dim);font:inherit;font-size:14px;font-weight:600;
    padding:6px 14px;border-radius:8px;cursor:pointer;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:var(--gold);color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.4)}

  /* ---------- card search ---------- */
  .hint{color:var(--dim);text-align:center;padding:70px 20px}
  .hint h3{color:var(--text);font-size:22px;margin:0 0 8px}
  .hint .egs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .hint .egs button{
    background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;
    padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .hint .egs button:hover{border-color:var(--gold);color:var(--gold)}
  .found{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;margin-top:18px}
  .find{
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:12px;padding:10px;cursor:pointer;transition:transform .15s ease,border-color .15s;
  }
  .find:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
  .find img.art{width:100%;border-radius:7px;display:block;aspect-ratio:245/342;object-fit:cover;background:var(--panel)}
  .find .fnm{font-weight:700;font-size:14px;margin:9px 0 3px;line-height:1.2}
  .find .fset{color:var(--dim);font-size:11.5px;display:flex;align-items:center;gap:5px;line-height:1.3}
  .find .fset img{width:14px;height:14px;object-fit:contain;flex:0 0 auto}
  .find .frow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:7px}
  .find .frow .rr{color:var(--dim);font-size:11px}
  .find .frow .pp{color:#7ee38a;font-weight:800;font-size:15px}
  .more{display:block;margin:26px auto 0}

  /* ---------- printing picker ---------- */
  .idcard{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;
  }
  .idcard div small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .idcard div b{font-size:14px;display:flex;align-items:center;gap:5px}
  .idcard div b img{width:16px;height:16px;object-fit:contain}
  .vars{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .vars button{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;
    padding:7px 13px;border-radius:9px;cursor:pointer;text-align:left;
  }
  .vars button:hover{border-color:var(--gold)}
  .vars button.on{border-color:var(--gold);background:rgba(255,203,5,.10);color:var(--gold);font-weight:700}
  .vars button small{display:block;font-size:11px;color:var(--dim);font-weight:400}
  .vars button.on small{color:var(--gold);opacity:.8}
  .bigprice{
    display:flex;align-items:baseline;gap:10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:12px 16px;margin-bottom:10px;
  }
  .bigprice b{font-size:30px;color:#7ee38a;font-weight:800;line-height:1}
  .bigprice span{color:var(--dim);font-size:12px}

  /* ---------- estimated prices ---------- */
  .bigprice.est{border-color:rgba(255,203,5,.45);background:rgba(255,203,5,.07)}
  .bigprice.est b{color:var(--gold)}
  .tag{
    display:inline-block;background:rgba(255,203,5,.18);color:var(--gold);border:1px solid rgba(255,203,5,.4);
    border-radius:5px;padding:1px 5px;font-size:10px;font-weight:800;text-transform:uppercase;
    letter-spacing:.5px;vertical-align:1px;
  }
  .warn{
    background:rgba(255,203,5,.08);border:1px solid rgba(255,203,5,.32);border-radius:10px;
    padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:#e3d9b4;line-height:1.5;
  }
  .warn b{color:var(--gold);display:block;margin-bottom:3px}
  .card .pr.est{color:var(--gold);background:rgba(6,18,46,.9)}
  .find .frow .pp.est{color:var(--gold);font-size:14px}
  .find .frow .pp.est .tag{font-size:9px;padding:0 4px;margin-left:2px}
  .legend{
    display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;
  }
  .legend b{color:var(--gold);font-weight:800}

  /* ---------- the rest of the tabs ----------
     Same row, same buttons — "View more" just reveals the ones past the first two. */
  .tabs .extra{display:none}
  .tabs.open .extra{display:block}
  .tabs .morebtn{color:var(--gold);opacity:.85}
  .tabs .morebtn:hover{opacity:1;color:var(--gold)}

  /* ---------- owning ---------- */
  .addbar{display:flex;gap:6px;margin-top:8px}
  .find{display:flex;flex-direction:column}
  .find .addbar{margin-top:auto;padding-top:8px}   /* buttons line up even when a rarity wraps */
  .addbar button{
    flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;
    font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:8px;cursor:pointer;
  }
  .addbar button.own.yes{border-color:#7ee38a;color:#7ee38a;background:rgba(126,227,138,.10)}
  .ownbtn{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;
    font-size:13px;font-weight:700;padding:6px 12px;border-radius:9px;cursor:pointer;
  }
  .ownbtn:hover{border-color:#7ee38a;color:#7ee38a}
  .ownbtn.yes{border-color:#7ee38a;color:#7ee38a;background:rgba(126,227,138,.10)}
  .addbar button.own:hover{border-color:#7ee38a;color:#7ee38a}
  .tagline{color:var(--gold);font-weight:600;font-size:15px;margin:-2px 0 12px}
  .find .fslot{color:var(--gold);font-size:11.5px;font-weight:600;margin-top:3px}

  /* ---------- binder slot (card sheet) ---------- */
  .binder{margin-bottom:6px}
  .slotrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .slotadd{
    width:42px;height:42px;border-radius:50%;border:2px dashed var(--gold);background:rgba(255,203,5,.08);
    color:var(--gold);font:inherit;font-size:26px;font-weight:700;line-height:1;cursor:pointer;padding:0;
  }
  .slotadd:hover{background:rgba(255,203,5,.2)}
  .slothint{color:var(--dim);font-size:13px}
  .slotnum{font-size:24px;font-weight:800;color:var(--gold);margin-right:4px}
  .slotrow input{
    width:110px;background:var(--panel);border:1px solid var(--gold);color:var(--text);border-radius:9px;
    padding:8px 10px;font:inherit;font-size:15px;outline:none;
  }
  .slotrow .back,.slotrow .btn-gold{padding:7px 13px;font-size:13px}
  .sloterr{color:#ffb4b4;font-size:13px;font-weight:600;margin-top:7px}
  .sloterr:empty{display:none}
  .ownmark{
    position:absolute;top:6px;right:6px;background:rgba(126,227,138,.92);color:#0c2412;
    font-weight:900;font-size:11px;border-radius:50%;width:19px;height:19px;line-height:19px;text-align:center;
  }

  /* ---------- set grid ---------- */
  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:28px}
  .set{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:16px 14px 13px;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;transition:transform .16s ease, border-color .16s, box-shadow .16s;
    text-align:center;
  }
  .set:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
  .set .logo-box{height:74px;display:flex;align-items:center;justify-content:center}
  .set .logo-box img{max-height:74px;max-width:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .set .nm{font-weight:700;font-size:15px;line-height:1.25;display:flex;align-items:center;justify-content:center;gap:6px}
  .set .nm img{width:16px;height:16px;object-fit:contain}
  .set .ser{color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-top:-6px}
  .set .meta{color:var(--dim);font-size:12px;display:flex;justify-content:center;gap:8px}
  .set .meta b{color:#d6e2ff;font-weight:600}
  .set .val{
    margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--dim);
  }
  .set .val b{color:#7ee38a;font-size:16px;font-weight:800}
  .set .val .per{font-size:11px}
  .set .val .pending{font-size:11px;opacity:.6;font-style:italic}

  /* ---------- set detail ---------- */
  .back{
    background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:9px 14px;cursor:pointer;font-size:14px;font-family:inherit;
  }
  .back:hover{border-color:var(--gold);color:var(--gold)}
  .set-head{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:26px 0 10px;
    background:linear-gradient(180deg,var(--panel2),transparent);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  .set-head img.big{max-height:96px;max-width:300px;object-fit:contain}
  .set-head h1{margin:0 0 6px;font-size:26px}
  .stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13px}
  .stats b{color:var(--text);display:block;font-size:15px;font-weight:700}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 4px}
  .btn-gold{
    background:linear-gradient(180deg,#ffd633,#f0b90b);color:var(--navy);border:0;border-radius:10px;
    padding:10px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;
    box-shadow:0 4px 14px rgba(240,185,11,.28);
  }
  .btn-gold:hover{filter:brightness(1.08)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px;scroll-margin-top:140px}
  .card{
    cursor:pointer;border-radius:10px;position:relative;transition:transform .15s ease;
    background:var(--panel);aspect-ratio:245/342;overflow:hidden;border:1px solid var(--line);
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block}
  .card:hover{transform:translateY(-5px) scale(1.03);z-index:2;box-shadow:var(--shadow)}
  .card .no{
    position:absolute;left:6px;bottom:6px;background:rgba(6,18,46,.85);border-radius:6px;
    padding:2px 6px;font-size:11px;color:#fff;opacity:0;transition:opacity .15s;
  }
  .card:hover .no{opacity:1}
  .card .pr{
    position:absolute;right:6px;bottom:6px;background:rgba(6,18,46,.88);border-radius:6px;
    padding:2px 6px;font-size:11px;font-weight:700;color:#7ee38a;
  }

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(4,12,32,.82);backdrop-filter:blur(6px);
    display:flex;padding:24px;overflow:auto}
  /* centred with margin:auto, not align-items:center — that clips the top of a sheet taller than
     the screen (like the card sheet) where it can't be scrolled back to */
  .modal > .sheet{margin:auto}
  .sheet{
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:18px;max-width:900px;width:100%;padding:24px;display:flex;gap:26px;flex-wrap:wrap;
    box-shadow:var(--shadow);position:relative;
  }
  .sheet .x{position:absolute;right:14px;top:12px;background:none;border:0;color:var(--dim);font-size:26px;cursor:pointer;line-height:1}
  .sheet .x:hover{color:#fff}
  .sheet img.hero{width:300px;max-width:100%;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);align-self:flex-start}
  .info{flex:1 1 320px;min-width:280px}
  .info h2{margin:0 0 4px;font-size:26px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px}
  .chip.t{border-color:transparent;color:#111;font-weight:700}
  .blk{border-top:1px solid var(--line);padding:12px 0}
  .blk h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
  .atk{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
  .atk .nm{font-weight:700}
  .atk .txt{color:var(--dim);font-size:13px}
  .atk .dmg{font-weight:800;font-size:18px}
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .price{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .price small{display:block;color:var(--dim);font-size:11px;text-transform:capitalize}
  .price b{font-size:17px;color:#7ee38a}

  .msg{padding:60px 0;text-align:center;color:var(--dim)}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;
    margin:0 auto 14px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pull{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:40px 0 10px}

  /* ---------- card search: energy types ---------- */
  .etypes{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 4px}
  .etypes button{
    display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .etypes button:hover{border-color:var(--dim)}
  .etypes button i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.45)}
  .etypes button.on{border-color:currentColor;background:rgba(255,255,255,.08)}

  /* ---------- accounts ---------- */
  #acct{display:flex;align-items:center;gap:8px}
  #acct .who{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
  #acct .btn-gold{padding:7px 14px;font-size:13px}
  #acct .back{padding:6px 11px;font-size:13px}
  .signin{max-width:430px;flex-direction:column;align-items:center;text-align:center;gap:0;padding:30px 28px 24px}
  .signin .pokeball{width:52px;height:52px;margin-bottom:14px}
  .signin .pokeball:after{width:15px;height:15px}
  .signin h2{margin:0 0 10px;font-size:24px}
  .signin p{color:var(--dim);margin:0 0 18px;line-height:1.55}
  .signin p b{color:var(--gold)}
  .signin small{color:var(--dim);margin-top:14px;font-size:12px;line-height:1.5}
  .signin form{display:flex;flex-direction:column;gap:8px;width:100%;max-width:300px}
  .signin form input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:15px;outline:none;
  }
  .signin form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,203,5,.22)}
  .signin form .btn-gold{margin-top:2px}
  .signin form .btn-gold:disabled{opacity:.6;cursor:default}
  .signin .signhint{font-size:12.5px;color:var(--gold);min-height:0;text-align:left}
  .signin .signerr{font-size:13px;color:#ffb4b4;font-weight:600;text-align:left}
  .signin .signhint:empty, .signin .signerr:empty{display:none}
  .signin .names{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px;font-size:12px;color:var(--dim);align-items:center}
  .signin .names button{
    background:var(--panel);border:1px solid var(--line);color:var(--text);font:inherit;font-size:13px;
    padding:5px 12px;border-radius:999px;cursor:pointer;
  }
  .signin .names button:hover{border-color:var(--gold);color:var(--gold)}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:200;opacity:0;pointer-events:none;
    background:var(--panel2);border:1px solid var(--gold);color:var(--text);border-radius:10px;padding:10px 16px;
    font-size:14px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo" onclick="showSets()"><div class="pokeball"></div><span>Pokédex of Packs</span></div>
    <nav class="tabs" id="tabs">
      <button id="tab-packs" class="on" onclick="showSets()">Packs</button>
      <button id="tab-cards" onclick="showSearch()">Card search</button>
      <button id="tab-owned" class="extra" onclick="showOwned()">My collection</button>
      <button id="tab-more" class="morebtn" onclick="toggleMore()">View more ›</button>
    </nav>
    <div class="grow"></div>
    <input type="search" id="q" placeholder="Search sets…" autocomplete="off">
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="val">Priciest pack</option>
      <option value="az">A to Z</option>
      <option value="size">Most cards</option>
    </select>
    <span class="count" id="count"></span>
    <div id="acct"></div>
  </div>
</header>

<div class="wrap" id="app">
  <div class="msg"><div class="spinner"></div>Loading every Pokémon set…</div>
</div>

<footer>Cards &amp; images from the <a href="https://pokemontcg.io" target="_blank" rel="noopener">Pokémon TCG API</a>; sealed pack prices are TCGplayer market data via <a href="https://tcgcsv.com" target="_blank" rel="noopener">tcgcsv.com</a>, as of <span id="snap"></span>. Card images © The Pokémon Company.</footer>

<script>
const API = "https://api.pokemontcg.io/v2";

/* Sealed booster-pack prices (TCGplayer market, via tcgcsv.com). Baked in because tcgcsv
   sends no CORS headers, so the browser can't fetch them — refresh with update-pack-prices.py.

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* The free pokemontcg.io tier throws intermittent 500s, so every call retries. */
async function getJSON(url, tries){
  tries = tries || 5;
  let last = "";
  for(let i=0;i<tries;i++){
    try{
      const r = await fetch(url);
      if(r.ok) return await r.json();
      if(r.status === 429){ last = "rate limited"; await sleep(2000 * (i+1)); continue; }
      if(r.status >= 500){ last = "server error " + r.status; await sleep(300 * (i+1)); continue; }
      throw new Error("Request failed (" + r.status + ")");
    }catch(e){
      if(/^Request failed/.test(e.message)) throw e;
      last = e.message || "network error";
      await sleep(500 * (i+1));
    }
  }
  throw new Error("The Pokémon TCG API isn't answering right now (" + last + ").");
}
/* ---------------- saved copies of card data ----------------
   Sets, set card lists and search results are kept on the device so they show instantly — but
   every time one is used, the API is asked again in the background. If the answer changed (new
   prices, a new set), the saved copy is replaced and whatever is on screen redraws in place.
   Only a failed or unchanged answer leaves things as they are.

   Storage is IndexedDB ("pokedex-cache"), NOT localStorage: a set's cards are hundreds of KB, and
   localStorage holds the accounts, which must never be squeezed out. Up to CACHE_MAX entries are
   kept, least recently used dropped first. If IndexedDB is unavailable (some private windows),
   everything just loads from the network like before.

   "Every time" has one allowance: the same thing isn't re-checked within CACHE_RECHECK_MS in one
   visit (flicking back and forth between two sets), because the free API allows ~1000 calls a day. */
const CACHE_MAX = 250, CACHE_RECHECK_MS = 60000, CACHE_RETRY = [4000, 15000, 45000];
const cacheMem = new Map();      // key -> {s: JSON string, d: parsed}, this visit
const cacheChecked = new Map();  // key -> when it was last checked against the API, this visit
const cacheFlight = new Map();   // key -> the API request already under way
let cacheDbP = null;
function cacheDb(){
  if(!cacheDbP){
    cacheDbP = new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error("no IndexedDB"));
      const r = indexedDB.open("pokedex-cache", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("c", {keyPath: "k"}).createIndex("t", "t");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("IndexedDB blocked"));
    });
    cacheDbP.catch(() => {});
  }
  return cacheDbP;
}
async function cacheRead(key){
  try{
    const db = await cacheDb();
    return await new Promise(res => {
      const q = db.transaction("c").objectStore("c").get(key);
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}
async function cacheWrite(key, str){
  try{
    const db = await cacheDb();
    const tx = db.transaction("c", "readwrite"), st = tx.objectStore("c");
    st.put({k: key, t: Date.now(), s: str});
    const n = st.count();
    n.onsuccess = () => {                         // over the limit: drop the least recently used
      let extra = n.result - CACHE_MAX;
      if(extra <= 0) return;
      const cur = st.index("t").openCursor();
      cur.onsuccess = () => { const c = cur.result; if(c && extra-- > 0){ c.delete(); c.continue(); } };
    };
  }catch(e){ /* no saved copy this time — the data on screen is still right */ }
}

/* Returns the saved copy right away if there is one (and checks the API behind it, calling
   onUpdate(freshData) if the answer changed); with no saved copy, waits for the API. */
async function cachedFetch(key, fetcher, onUpdate){
  let hit = cacheMem.get(key);
  if(!hit){
    const row = await cacheRead(key);
    if(row){ try{ hit = {s: row.s, d: JSON.parse(row.s)}; cacheMem.set(key, hit); }catch(e){ hit = null; } }
  }
  const check = () => {
    if(cacheFlight.has(key)) return cacheFlight.get(key);
    const job = (async () => {
      const fresh = await fetcher();
      const str = JSON.stringify(fresh);
      const before = cacheMem.get(key);
      const changed = !before || before.s !== str;
      cacheMem.set(key, {s: str, d: fresh});
      cacheChecked.set(key, Date.now());
      cacheWrite(key, str);                       // also refreshes its "last used" time
      return {data: fresh, changed: changed};
    })();
    cacheFlight.set(key, job);
    job.then(() => cacheFlight.delete(key), () => cacheFlight.delete(key));
    return job;
  };
  if(!hit) return (await check()).data;
  if(Date.now() - (cacheChecked.get(key) || 0) >= CACHE_RECHECK_MS){
    // the free API often fails a request outright; a failed check tries again rather than
    // leaving an out-of-date copy on screen
    const background = attempt => check()
      .then(r => { if(r.changed && onUpdate) onUpdate(r.data); })
      .catch(() => { if(attempt < CACHE_RETRY.length) setTimeout(() => background(attempt + 1), CACHE_RETRY[attempt]); });
    background(0);
  }
  return hit.d;
}

async function loadSets(){
  // the old 24-hour copy in localStorage: use it once as the starting copy, then free that space
  try{

      const o = JSON.parse(old);
      localStorage.removeItem("pkSets");
      if(o && o.d && !(await cacheRead("sets"))) await cacheWrite("sets", JSON.stringify(o.d));
    }
  }catch(e){ try{ localStorage.removeItem("pkSets"); }catch(e2){} }
  try{
    SETS = await cachedFetch("sets", async () => (await getJSON(API + "/sets?pageSize=250")).data, fresh => {
      SETS = fresh;
      if(current) current = SETS.find(x => x.id === current.id) || current;
      if(VIEW === "sets") keepScroll(renderSets);
    });

  }catch(e){
    app.innerHTML = '<div class="msg">' + esc(e.message)

      + '<br><br><button class="btn-gold" onclick="loadSets()">Try again</button></div>';
  }
}
function sortByNumber(all){
  return all.slice().sort((a,b)=>{
    const na = parseInt(a.number,10), nb = parseInt(b.number,10);
    if(isNaN(na) || isNaN(nb)) return String(a.number).localeCompare(String(b.number));
    return na - nb || String(a.number).localeCompare(String(b.number));
  });
}
async function fetchSetCards(setId){
  let all = [], page = 1;
  while(true){
    const d = await getJSON(API + "/cards?q=set.id:" + encodeURIComponent(setId) + "&pageSize=250&page=" + page);
    all = all.concat(d.data);
    if(d.data.length < 250) break;
    page++;
  }
  return sortByNumber(all);
}
async function loadCards(setId){
  const all = await cachedFetch("set:" + setId, () => fetchSetCards(setId), fresh => {
    remember(fresh);

}

/* --- binder slots ---
   Where a card sits in your real binder: one number, kept on its OWNED entry as slot (1, 2, 3…).
   In the card sheet an empty slot is a "+" button; tap it, type the number, Save. One card per
   number — a number that's already taken says which card has it and doesn't save. Taking a card
   out of the collection drops its slot with it.
   Older saves stored slot as {p: page, s: pocket} with 4, 9 or 12 pockets a page (profile.binder).
   Those are converted to the same position number when a profile is read (slotNumber) — never
   thrown away. */
let slotEditing = false;                    // is the card sheet's slot box open for typing
function slotNumber(sl, perPage){
  if(typeof sl === "number") return sl >= 1 ? Math.floor(sl) : null;
  if(sl && sl.p >= 1 && sl.s >= 1) return (sl.p - 1) * ([4, 9, 12].indexOf(perPage) >= 0 ? perPage : 9) + sl.s;
  return null;
}
function binderBlock(id){
  const e = OWNED[id];
  if(!e) return '<div id="binderpane"></div>';   // not in the collection — nothing to place
  const n = slotNumber(e.slot), q = "'" + id + "'";
  let row;

    row = '<input id="slotin" type="number" min="1" step="1" inputmode="numeric" placeholder="Slot number" value="' + (n || "") + '"'
      + ' onkeydown="if(event.key===&quot;Enter&quot;)saveSlot(' + q + ');if(event.key===&quot;Escape&quot;){event.stopPropagation();editSlot(' + q + ',false)}">'
      + '<button class="btn-gold" onclick="saveSlot(' + q + ')">Save</button>'
      + '<button class="back" onclick="editSlot(' + q + ',false)">Cancel</button>';
  }else if(n){
    row = '<span class="slotnum">#' + n + '</span>'
      + '<button class="back" onclick="editSlot(' + q + ',true)">Change</button>'
      + '<button class="back" onclick="clearSlot(' + q + ')">Remove</button>';
  }else{
    row = '<button class="slotadd" onclick="editSlot(' + q + ',true)" title="Put it in a binder slot" aria-label="Put it in a binder slot">+</button>'
      + '<span class="slothint">Put it in a binder slot</span>';

function editSlot(id, on){

function saveSlot(id){
  const e = OWNED[id]; if(!e) return;
  if(needSignIn()) return;
  const inp = document.getElementById("slotin"), err = document.getElementById("sloterr");
  const n = Number(inp && inp.value);
  if(!Number.isInteger(n) || n < 1 || n > 99999){
    if(err) err.textContent = "Type a slot number, like 12.";
    if(inp) inp.focus();
    return;
  }
  for(const k in OWNED){
    if(k !== id && slotNumber(OWNED[k].slot) === n){
      if(err) err.textContent = "Slot " + n + " already has " + OWNED[k].n + " (" + OWNED[k].set + ").";
      if(inp){ inp.focus(); inp.select(); }
      return;
    }
  }
  e.slot = n;
  slotEditing = false;
  saveCollection();
  redrawBinder(id);
  refreshView();                            // the collection tile shows the slot too
}
function clearSlot(id){
  const e = OWNED[id]; if(!e) return;
  if(needSignIn()) return;

  app.innerHTML = energyBar() + '<div class="msg"><div class="spinner"></div>Looking for ' + esc(what) + '…</div>';
  try{
    const d = await fetchPage(term, 1, seq);
    if(seq !== searchSeq) return;            // a newer search already started
    searchHits = d.data; searchTotal = d.totalCount;
    remember(d.data);
  }catch(e){
    if(seq !== searchSeq) return;
    app.innerHTML = energyBar() + '<div class="msg">' + esc(e.message)
      + '<br><br><button class="btn-gold" onclick="runSearch(' + JSON.stringify(term).replace(/"/g, "&quot;") + ')">Try again</button></div>';
    searchBusy = false;
    return;
  }
  searchBusy = false;
  renderSearch();
}
function fetchPage(term, page, seq){
  // quoted wildcards, so "mr. mime" and partial words both work
  const parts = [];
  if(term.length >= 2) parts.push('name:"*' + term.replace(/["\\]/g, " ") + '*"');
  if(searchType) parts.push("types:" + searchType);
  const q = parts.join(" ");
  const url = API + "/cards?q=" + encodeURIComponent(q) + "&orderBy=-set.releaseDate,number&pageSize=" + PAGE + "&page=" + page;
  const key = "search:" + (searchType || "") + "|" + term.toLowerCase() + "|" + page;
  return cachedFetch(key, () => getJSON(url), fresh => {
    // only if that exact search is still the one on screen
    if(seq !== searchSeq || VIEW !== "search") return;
    remember(fresh.data);
    const start = (page - 1) * PAGE;
    if(start > searchHits.length) return;
    searchHits = searchHits.slice(0, start).concat(fresh.data, searchHits.slice(start + PAGE));
    searchTotal = fresh.totalCount;
    keepScroll(renderSearch);
  });
}

/* ---------------- prices ----------------
   What a sealed booster pack of the set costs, from PACK_PRICES above. Card-level
   prices come from the card data itself, so they cost no extra requests. */
function packPrice(id){
  const p = PACK_PRICES.s[id];
  return p && p.p != null ? p.p : null;
}
function priceLabel(id){
  const p = packPrice(id);
  if(p == null) return '<span class="pending">not sold in packs</span>';
  return '<b>' + money(p) + '</b> <span class="per">a pack</span>';
}
function money(n){
  if(n == null) return "—";
  if(n >= 1000) return "$" + Math.round(n).toLocaleString("en-US");
  return "$" + n.toFixed(2);
}

function cardPrice(c){
  const p = c.tcgplayer && c.tcgplayer.prices;
  if(!p) return null;
  // cheapest printing of the card — avoids 1st-edition variants inflating the set
  const vals = Object.values(p).map(v => v && v.market).filter(v => typeof v === "number" && v > 0);
  return vals.length ? Math.min(...vals) : null;
}

/* What a card is worth, and how much to trust it.
   Brand-new sets ship months before TCGplayer lists a single card — the four newest sets have
   661 cards with no price between them — so rather than showing a dash, fall back through
   the European market and then a same-rarity baseline, saying clearly which one was used.
   -> {v, est, why, weak}  (est = it's a guess, weak = a guess from very little data) */
function cardValue(c){
  const exact = cardPrice(c);
  if(exact != null) return {v:exact, est:false, why:"TCGplayer market price"};

  const cm = (c.cardmarket && c.cardmarket.prices) || {};
  const eu = cm.trendPrice || cm.averageSellPrice || cm.avg30;
  if(eu) return {v: eu * PRICE_EST.eur, est:true, basis:"eu",
                 why:"converted from its European (Cardmarket) price at €1 = " + money(PRICE_EST.eur)};

  const base = PRICE_EST.r[c.rarity];
  if(base) return {
    v: base[0], est:true, basis:"rarity", weak: base[1] < 10,
    why: "what a typical " + c.rarity + " from a recent set sells for, across "
       + base[1] + " comparable card" + (base[1] === 1 ? "" : "s")
  };
  if(PRICE_EST.any) return {
    v: PRICE_EST.any, est:true, basis:"rarity", weak:true,
    why:"what a typical card from a recent set sells for; nothing comparable to this rarity yet"
  };
  return null;
}
/* The yellow explain-yourself box under an estimated price. */
function warnBox(r, lead){
  return '<div class="warn"><b>⚠ This is an estimate, not a listed price.</b>'
    + (lead || "TCGplayer has no sale price for this card.")
    + (r.basis === "rarity" ? " Brand-new sets often go months before anything sells." : "")
    + " The figure above is " + esc(r.why) + "."
    + (r.weak ? ' <b>Treat it as very rough</b> — there is little to compare against.' : '')
    + '</div>';
}

/* Shown above a grid that contains guessed prices, so the ~ isn't a mystery. */
function estLegend(cards){
  const n = cards.filter(c => cardPrice(c) == null && cardValue(c)).length;
  if(!n) return "";
  return '<span class="legend"><b>~</b> ' + n + " of " + cards.length
    + " ha" + (n === 1 ? "s" : "ve") + " no sale price yet — those are estimates</span>";
}
function priceStats(cards){
  let total = 0, n = 0, hi = 0, hiName = "";
  for(const c of cards){
    const v = cardPrice(c);
    if(v == null) continue;
    total += v; n++;
    if(v > hi){ hi = v; hiName = c.name; }
  }
  return {v:total, n:n, hi:hi, hiName:hiName, of:cards.length};
}

/* ---------------- set list ---------------- */
function sortSets(list){
  const m = sortIn.value;
  const byDate = s => s.releaseDate || "0000/00/00";
  const c = [...list];
  if(m === "new")  c.sort((a,b)=> byDate(b).localeCompare(byDate(a)));
  if(m === "old")  c.sort((a,b)=> byDate(a).localeCompare(byDate(b)));
  if(m === "az")   c.sort((a,b)=> a.name.localeCompare(b.name));
  if(m === "size") c.sort((a,b)=> (b.total||0) - (a.total||0));
  if(m === "val"){
    const v = s => { const p = packPrice(s.id); return p == null ? -1 : p; };
    c.sort((a,b)=> v(b) - v(a));
  }
  return c;
}

/* Evolution lines side by side.
   The grid stays in card-number order, except each Pokémon family is pulled together at the spot
   where its first card is numbered: Charmander, Charmeleon, Charizard, Charizard ex, then the
   secret-rare Charizard ex from the back of the set. Trainers and Energy don't move.
   Families join through names from both ends (evolvesFrom and evolvesTo), so a line still holds
   together when the middle stage isn't in the set, and rule-box cards (Charizard V, M Charizard-EX)
   join their species by name. */
const EVO_SUFFIX = /[\s-](?:EX|ex|GX|V|VMAX|VSTAR|V-UNION|BREAK|LV\.X|LEGEND|Prime|☆|δ|◇|♢)$/;
function species(name){
  let n = String(name || "").trim(), prev;
  do{ prev = n; n = n.replace(EVO_SUFFIX, "").replace(/^(?:M|Mega|Radiant|Shining)\s+/, "").trim(); }
  while(n && n !== prev);
  return n || String(name || "");
}
function evoOrder(cards){
  const isMon = c => /^Pok/.test(c.supertype || "");
  const up = Object.create(null);
  const find = n => { if(!(n in up)) up[n] = n; while(up[n] !== n){ up[n] = up[up[n]]; n = up[n]; } return n; };
  const join = (a, b) => { if(a && b) up[find(a)] = find(b); };
  const from = Object.create(null), into = Object.create(null);
  for(const c of cards){
    if(!isMon(c)) continue;
    join(c.name, species(c.name));
    if(c.evolvesFrom){ join(c.name, c.evolvesFrom); from[c.name] = c.evolvesFrom; }
    for(const t of c.evolvesTo || []){ join(c.name, t); if(!(t in into)) into[t] = c.name; }
  }
  // how far down its line a card sits: Basic 0, Stage 1 is 1, a VMAX one past its V
  const depthOf = Object.create(null);
  const depth = (n, hops) => {
    if(n in depthOf) return depthOf[n];
    if(hops > 8) return 0;                                   // guard against a looped chain
    let d = 0;
    if(from[n]) d = depth(from[n], hops + 1) + 1;
    else if(into[n]) d = depth(into[n], hops + 1) + 1;
    else if(species(n) !== n) d = depth(species(n), hops + 1);
    return depthOf[n] = d;
  };
  const rows = cards.map((c, i) => ({c, i, f: isMon(c) ? "p:" + find(c.name) : "c:" + c.id, d: isMon(c) ? depth(c.name, 0) : 0}));
  const first = Object.create(null), nameAt = Object.create(null);
  for(const r of rows){
    if(!(r.f in first)) first[r.f] = r.i;
    if(!(r.c.name in nameAt)) nameAt[r.c.name] = r.i;
  }
  return rows.sort((a, b) =>
    first[a.f] - first[b.f] || a.d - b.d || nameAt[a.c.name] - nameAt[b.c.name] || a.i - b.i
  ).map(r => r.c);
}

/* ---------------- booster pack simulator ---------------- */
function ripPack(){
  const pool = currentCards.filter(c => c.rarity);
  if(pool.length < 4){ alert("This set doesn't have enough rarity data to simulate a pack."); return; }
  const by = p => pool.filter(p);
  const commons   = by(c => /^Common/i.test(c.rarity));
  const uncommons = by(c => /^Uncommon/i.test(c.rarity));
  const rares     = by(c => /rare/i.test(c.rarity));
  const chase     = by(c => /(Ultra|Secret|Illustration|Hyper|Rainbow|Special|Amazing|Radiant|Shiny|Gold)/i.test(c.rarity));
  const pick = (arr, n) => {
    const out = [], src = arr.length ? arr : pool;
    for(let i=0;i<n;i++) out.push(src[Math.floor(Math.random()*src.length)]);
    return out;
  };
  const hit = (chase.length && Math.random() < 0.18) ? pick(chase,1) : pick(rares.length ? rares : pool, 1);
  const pull = [...pick(commons,5), ...pick(uncommons,3), ...hit];
  const grid = document.getElementById("grid");
  document.getElementById("shown").textContent = "your pull — 9 cards";
  grid.innerHTML = pull.map(c => cardTile(c, "pull")).join("");
  [...grid.children].forEach((el,i) => el.style.animationDelay = (i*70) + "ms");
  grid.scrollIntoView({behavior:"smooth", block:"start"});
}

  const list = Object.values(OWNED);
  const head = '<div class="set-head" style="margin-top:22px"><div style="flex:1"><h1>My collection</h1>'
    + '<div class="tagline">An online way to keep track of your Pokémon</div>';
  countEl.textContent = "";
  if(!USER){
    app.innerHTML = head + '</div></div>'
      + '<div class="hint" style="padding-top:40px"><h3>Sign in to make your collection</h3>'
      + 'You have to sign in so we can <b style="color:var(--gold)">save your stuff</b> — every card you add, and where it sits'
      + ' in your binder.<br>Pick a name and a password. Your collection saves on this device under that name.'
      + '<div class="egs" style="margin-top:22px"><button class="btn-gold" onclick="showSignIn()">Sign in</button></div></div>';
    return;
  }
  countEl.textContent = list.length + " card" + (list.length === 1 ? "" : "s");
  if(!list.length){
    app.innerHTML = head + '</div></div>'
      + '<div class="hint" style="padding-top:40px"><h3>Nothing in your collection yet</h3>'
      + 'Hit <b style="color:#7ee38a">+ Add to collection</b> on any card in Card search, '
      + 'or open a card and hit <b style="color:#7ee38a">✓ I have this card</b>.'
      + '<div class="egs"><button onclick="showSearch()">Search for a card</button>'
      + '<button onclick="showSets()">Browse the sets</button></div></div>';
    return;
  }
  for(const s of list) if(!CARDS.has(s.id)) CARDS.set(s.id, snapToCard(s));
  const val = list.reduce((t,s) => t + (s.v || 0), 0);
  app.innerHTML = head
    +   '<div class="stats">'
    +     '<div>Cards in your collection<b>' + list.length + '</b></div>'
    +     '<div>What they\'re worth<b style="color:#7ee38a">' + money(val) + '</b></div>'
    +   '</div></div></div>'
    + '<div class="tools">'
    +   '<input type="search" id="oq" placeholder="Search your collection…" value="' + esc(ownedTerm) + '">'
    +   '<select id="osort" aria-label="Sort your collection" onchange="ownedSort=this.value;store.set(\'pkOwnedSort\',ownedSort);drawOwned()">'
    +     OWNED_SORTS.map(o => '<option value="' + o[0] + '"' + (o[0] === ownedSort ? " selected" : "") + '>' + o[1] + '</option>').join("")
    +   '</select>'
    +   '<span class="count" id="oshown"></span>'
    + '</div>'
    + '<div class="found" id="ogrid" style="margin-top:18px"></div>';
  document.getElementById("oq").addEventListener("input", e => { ownedTerm = e.target.value; drawOwned(); });
  drawOwned();
}
/* "Added" order is the order cards went into OWNED (card ids aren't numbers, so object key order is
   insertion order). Prices are the value saved with the card when it was added. Cards with no
   price go last whichever way you sort by price. */
function sortOwned(list){
  const pos = {};
  Object.keys(OWNED).forEach((k, i) => pos[k] = i);
  const newest = (a, b) => pos[b.id] - pos[a.id];
  const noPrice = (a, b) => (a.v == null) - (b.v == null);
  const num = x => { const n = parseInt(x, 10); return isNaN(n) ? Infinity : n; };
  const c = list.slice();
  const by = {
    new: newest,
    old: (a, b) => pos[a.id] - pos[b.id],
    hi: (a, b) => noPrice(a, b) || b.v - a.v || newest(a, b),
    lo: (a, b) => noPrice(a, b) || a.v - b.v || newest(a, b),
    az: (a, b) => (a.n || "").localeCompare(b.n || "") || (a.set || "").localeCompare(b.set || ""),
    set: (a, b) => (a.set || "").localeCompare(b.set || "") || num(a.num) - num(b.num) || String(a.num).localeCompare(String(b.num)),
    binder: (a, b) => (!slotNumber(a.slot)) - (!slotNumber(b.slot)) || (slotNumber(a.slot) || 0) - (slotNumber(b.slot) || 0) || newest(a, b)
  };
  return c.sort(by[ownedSort] || newest);
}
// matches a card's name, set or rarity, or its exact number ("199" or "#199")
function drawOwned(){
  const list = Object.values(OWNED);
  const term = ownedTerm.trim().toLowerCase();
  const num = term.replace(/^#/, "");
  const hits = list.filter(s => !term
    || (s.n || "").toLowerCase().includes(term) || (s.set || "").toLowerCase().includes(term)
    || (s.rar || "").toLowerCase().includes(term) || String(s.num).toLowerCase() === num);
  document.getElementById("oshown").textContent = term ? hits.length + " / " + list.length + " cards" : "";
  document.getElementById("ogrid").innerHTML = sortOwned(hits).map(ownedTile).join("")
    || '<div class="msg" style="grid-column:1/-1">Nothing in your collection matches “' + esc(ownedTerm.trim()) + '”.</div>';
}

/* ---------------- accounts ----------------
   Making a collection needs signing in, so there's someone to save it for. Signing in is a name and
   a password — no Google, no outside service — and each name gets its own collection and binder
   layout, saved on this device:
     pkProfiles = {<lowercased name>: {name, owned, binder, pw:{salt, hash, it}}}
     pkUser     = the lowercased name signed in (a reload keeps you signed in)
   The password is never stored: pw is a PBKDF2-SHA256 hash with a random salt. It keeps other
   people using this device out of your collection on the site; it is not encryption — the
   collection itself is plain JSON that browser dev tools could read. There's no reset (no server),
   and the sign-in box says so. Browsing sets, prices and card search never needs signing in. */
let USER = null;                 // {key, name} of whoever is signed in
let pendingOwn = "";             // a card someone tried to add before signing in; added once they do
const NAME_MAX = 24, PW_MIN = 4, PW_ITER = 150000;

/* Accounts are the one thing on this site that can't be fetched again, so they're handled carefully.
   A site update only replaces index.html — it never touches localStorage — so the rule for any
   future change is: keep the key names pkProfiles / pkUser and the profile shape above, and if the
   shape ever has to change, convert old profiles when they're read. Never rename, clear or reformat
   them in place. On top of that:
   - pkProfilesBackup is the previous good copy, written just before every save. If pkProfiles is
     ever missing or unreadable, it comes back from the backup.
   - If pkProfiles can't be read, nothing writes over it: a copy goes to pkProfilesRescue and saving
     is refused until it can be read again.
   - A save that would leave out a name that already exists is refused — the site has no way to
     delete a name, so that can only be a bug.
   - navigator.storage.persist() asks the browser not to clear the site's storage to free up space. */
function parseProfiles(raw){
  try{ const o = JSON.parse(raw); return o && typeof o === "object" && !Array.isArray(o) ? o : null; }
  catch(e){ return null; }
}
function readProfiles(){
  let raw, backup;
  try{ raw = localStorage.getItem("pkProfiles"); backup = localStorage.getItem("pkProfilesBackup"); }
  catch(e){ return {ok: false, data: {}}; }                     // storage blocked
  const restore = () => {
    const b = backup != null ? parseProfiles(backup) : null;
    if(!b) return null;
    try{ localStorage.setItem("pkProfiles", backup); }catch(e){}
    return b;
  };
  if(raw == null){
    const b = restore();
    return {ok: true, data: b || {}};
  }
  const o = parseProfiles(raw);
  if(o) return {ok: true, data: o};
  try{ if(localStorage.getItem("pkProfilesRescue") == null) localStorage.setItem("pkProfilesRescue", raw); }catch(e){}
  const b = restore();
  return b ? {ok: true, data: b} : {ok: false, data: {}};
}
function profiles(){ return readProfiles().data; }
function writeProfiles(all){
  const cur = readProfiles();
  if(!cur.ok){
    toast("Your saved names couldn't be read, so nothing was saved — and nothing was deleted.");
    return false;
  }
  for(const k in cur.data){
    if(!(k in all)){ toast("Didn't save: that would have lost the name " + (cur.data[k].name || k) + "."); return false; }
  }
  try{
    const prev = localStorage.getItem("pkProfiles");
    if(prev != null) localStorage.setItem("pkProfilesBackup", prev);
    localStorage.setItem("pkProfiles", JSON.stringify(all));
    return true;
  }catch(e){
    toast("Couldn't save — this browser's storage is full or turned off.");
    return false;
  }
}
function keepStorage(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
}

function initAccounts(){
  const key = store.get("pkUser", "");
  const p = key && profiles()[key];
  if(p){ useProfile(key, p); keepStorage(); }
  drawAccount(); refreshView();
}
function useProfile(key, p){
  USER = {key: key, name: p.name};
  OWNED = p.owned || {};
  for(const k in OWNED){                       // old {page, pocket} slots become one number
    const n = slotNumber(OWNED[k].slot, p.binder);
    if(n) OWNED[k].slot = n; else delete OWNED[k].slot;
  }
}

function saveCollection(){
  if(!USER) return;
  const all = profiles();
  all[USER.key] = Object.assign({}, all[USER.key], {name: USER.name, owned: OWNED});   // keeps pw
  writeProfiles(all);
}

/* The gate: anything that changes the collection asks this first. */
function needSignIn(id){
  if(USER) return false;
  pendingOwn = id || "";
  showSignIn();
  return true;
}
function showSignIn(){

  const names = Object.values(profiles()).map(p => p.name).slice(0, 8);
  const enter = ' onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();signIn();}"';
  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="signin" style="z-index:110" onclick="if(event.target===this)closeSignIn(true)">'
    + '<div class="sheet signin"><button class="x" onclick="closeSignIn(true)">&times;</button>'
    + '<div class="pokeball"></div>'
    + '<h2>Sign in to make your collection</h2>'
    + '<p>You have to sign in so we can <b>save your stuff</b> — every card you add, and where it sits in your binder.'
    + ' Your password keeps other people on this device out of your collection.</p>'
    + '<form onsubmit="signIn(event)" autocomplete="on">'
    +   '<input id="signname" maxlength="' + NAME_MAX + '" placeholder="Your name" autocomplete="username" aria-label="Your name"'
    +     ' oninput="signMode()"' + enter + '>'
    +   '<input id="signpw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"' + enter + '>'
    +   '<input id="signpw2" type="password" placeholder="Type the password again" autocomplete="new-password" aria-label="Type the password again" hidden' + enter + '>'
    +   '<div class="signhint" id="signhint"></div>'
    +   '<div class="signerr" id="signerr"></div>'
    +   '<button class="btn-gold" id="signbtn" type="submit">Sign in</button>'
    + '</form>'
    + (names.length ? '<div class="names">Signed in here before?' + names.map(n =>
        '<button type="button" onclick="signInAs(this.dataset.n)" data-n="' + esc(n) + '">' + esc(n) + '</button>').join("") + '</div>' : '')
    + '<small>Your collection saves on this device under your name. There\'s no way to reset a forgotten'
    + ' password, so pick one you\'ll remember.<br>Browsing sets, prices and card search never needs signing in.</small>'

  const inp = document.getElementById("signname");
  if(inp) inp.focus();
}
function closeSignIn(cancelled){
  const m = document.getElementById("signin"); if(m) m.remove();
  if(cancelled) pendingOwn = "";
}
function cleanName(v){ return String(v || "").trim().replace(/\s+/g, " ").slice(0, NAME_MAX); }

/* The box adapts as you type a name: an existing name just needs its password; a new name (or one
   made before passwords existed) needs one picked and typed twice, so a typo can't lock you out. */
function signMode(){
  const name = cleanName((document.getElementById("signname") || {}).value);
  const prof = name ? profiles()[name.toLowerCase()] : null;
  const mode = !name ? "" : !prof ? "new" : !prof.pw ? "set" : "have";
  const pw2 = document.getElementById("signpw2"), pw = document.getElementById("signpw");
  const hint = document.getElementById("signhint"), btn = document.getElementById("signbtn");
  if(!pw2) return mode;
  pw2.hidden = !(mode === "new" || mode === "set");
  pw.setAttribute("autocomplete", mode === "have" ? "current-password" : "new-password");
  hint.textContent = mode === "new" ? "New name — pick a password (at least " + PW_MIN + " characters) and type it twice."
    : mode === "set" ? prof.name + " doesn't have a password yet — pick one now." : "";
  btn.textContent = mode === "new" ? "Make my name" : mode === "set" ? "Set password & sign in" : "Sign in";
  document.getElementById("signerr").textContent = "";
  return mode;
}
function signInAs(name){
  const inp = document.getElementById("signname");
  if(inp) inp.value = name;
  signMode();
  const pw = document.getElementById("signpw");
  if(pw) pw.focus();
}
function signErr(msg, el){
  const e = document.getElementById("signerr");
  if(e) e.textContent = msg;
  if(el) el.focus();
}

const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const fromB64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
async function hashPw(pw, saltB64, iterations){
  const salt = saltB64 ? fromB64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const it = iterations || PW_ITER;
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: it}, key, 256);
  return {salt: toB64(salt), hash: toB64(bits), it: it};
}

let signBusy = false;
async function signIn(ev){
  if(ev) ev.preventDefault();
  if(signBusy) return;
  const nameIn = document.getElementById("signname"), pwIn = document.getElementById("signpw"),
        pw2In = document.getElementById("signpw2"), btn = document.getElementById("signbtn");
  if(!nameIn) return;
  const name = cleanName(nameIn.value);
  if(!name) return signErr("Type a name to sign in.", nameIn);
  if(!(window.crypto && crypto.subtle)) return signErr("This browser can't keep passwords safe here, so signing in is off. Open the site from its web address.");
  const pw = pwIn.value;
  const key = name.toLowerCase();
  const mode = signMode();
  const all = profiles();
  const prof = all[key];
  let pwRecord = null;

  if(mode === "have"){
    if(!pw) return signErr("Type your password.", pwIn);
  }else{
    if(pw.length < PW_MIN) return signErr("Pick a password with at least " + PW_MIN + " characters.", pwIn);
    if(pw !== pw2In.value){ pw2In.value = ""; return signErr("Those two passwords don't match — type it again.", pw2In); }
  }
  signBusy = true; btn.disabled = true;
  try{
    if(mode === "have"){
      const h = await hashPw(pw, prof.pw.salt, prof.pw.it);
      if(h.hash !== prof.pw.hash){ pwIn.value = ""; return signErr("That's not the password for " + prof.name + ".", pwIn); }
    }else{
      pwRecord = await hashPw(pw);
    }
  }catch(e){
    return signErr("Couldn't check the password — " + (e.message || e));
  }finally{
    signBusy = false; if(btn) btn.disabled = false;
  }

  const isNew = !prof;
  if(isNew) all[key] = {name: name, owned: {}, binder: 9};
  if(pwRecord) all[key].pw = pwRecord;

  // A collection saved on this browser before sign-in existed moves into the first name signed in.
  const old = store.get("pkOwned", null);
  let moved = 0;
  if(old && Object.keys(old).length){
    const mine = all[key], taken = {}, oldPerPage = store.get("pkBinder", 9);
    for(const k in mine.owned){ const n = slotNumber(mine.owned[k].slot, mine.binder); if(n) taken[n] = 1; }
    for(const k in old){
      if(mine.owned[k]) continue;
      const e = old[k], n = slotNumber(e.slot, oldPerPage);
      if(n && !taken[n]){ e.slot = n; taken[n] = 1; } else delete e.slot;   // one card per slot
      mine.owned[k] = e; moved++;
    }
  }
  if(!writeProfiles(all)) return;
  if(old){ localStorage.removeItem("pkOwned"); localStorage.removeItem("pkBinder"); }
  store.set("pkUser", key);
  useProfile(key, all[key]);
  keepStorage();

  closeSignIn(false);
  drawAccount(); refreshView(); redrawSheet();
  toast((isNew ? "Hi " + USER.name + "! Your collection saves on this device." : "Welcome back, " + USER.name + "!")
    + (moved ? " Moved " + moved + " card" + (moved === 1 ? "" : "s") + " you'd already saved into it." : ""));
  if(pendingOwn){
    const id = pendingOwn; pendingOwn = "";
    if(!OWNED[id] && CARDS.has(id)) toggleOwn(id);
  }
}
function signOut(){
  USER = null; OWNED = {}; pendingOwn = "";
  try{ localStorage.removeItem("pkUser"); }catch(e){}
  drawAccount(); refreshView(); redrawSheet();
}
function drawAccount(){
  const el = document.getElementById("acct"); if(!el) return;
  el.innerHTML = USER
    ? '<span class="who">' + esc(USER.name) + '</span><button class="back" onclick="signOut()">Sign out</button>'
    : '<button class="btn-gold" onclick="showSignIn()">Sign in</button>';
}
function redrawSheet(){
  if(!modalCard || !document.getElementById("modal")) return;
  const b = document.getElementById("ownbtn");
  if(b) b.outerHTML = ownBtn(modalCard.id);
  redrawBinder(modalCard.id);
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("on"), 5000);
}

/* ---------------- card modal ---------------- */
let modalCard = null, modalVar = "";

// what each TCGplayer printing actually looks like, so you can tell which one is in your hand
const VARIANTS = {
  normal:              ["Normal", "no shine — plain card stock"],
  holofoil:            ["Holofoil", "the artwork itself is shiny"],
  reverseHolofoil:     ["Reverse holofoil", "shiny everywhere except the artwork"],
  "1stEdition":        ["1st Edition", "has the 1st Edition stamp beside the art"],
  "1stEditionNormal":  ["1st Edition", "1st Edition stamp, no shine"],
  "1stEditionHolofoil":["1st Edition holofoil", "1st Edition stamp and shiny art"],
  unlimited:           ["Unlimited", "no 1st Edition stamp"],
  unlimitedHolofoil:   ["Unlimited holofoil", "shiny art, no 1st Edition stamp"]
};
function varLabel(k){
  if(VARIANTS[k]) return VARIANTS[k][0];
  return k.replace(/([A-Z])/g, " $1").replace(/^./, m => m.toUpperCase());
}
function varNote(k){ return VARIANTS[k] ? VARIANTS[k][1] : ""; }

function selectVar(k){
  modalVar = k;
  const pane = document.getElementById("pricepane");
  if(pane) pane.innerHTML = priceBlock(modalCard);
}

function openCard(id){
  const c = CARDS.get(id); if(!c) return;
  closeCard();            // never stack two sheets — duplicate ids would cross their wires
  modalCard = c;
  slotEditing = false;
  const tp = (c.tcgplayer && c.tcgplayer.prices) || {};
  const withPrice = Object.keys(tp).filter(k => tp[k] && tp[k].market != null);
  modalVar = withPrice[0] || Object.keys(tp)[0] || "";
  const typeChips = (c.types || []).map(t => '<span class="chip t" style="background:' + (TYPE_COLORS[t] || "#ccc") + '">' + esc(t) + '</span>').join("");
  const subChips  = (c.subtypes || []).map(s => '<span class="chip">' + esc(s) + '</span>').join("");

  let body = "";
  if(c.abilities && c.abilities.length){
    body += '<div class="blk"><h4>' + esc(c.abilities[0].type || "Ability") + '</h4>'
      + c.abilities.map(a => '<div class="atk"><div><div class="nm">' + esc(a.name) + '</div><div class="txt">' + esc(a.text || "") + '</div></div></div>').join("")
      + '</div>';
  }
  if(c.attacks && c.attacks.length){
    body += '<div class="blk"><h4>Attacks</h4>' + c.attacks.map(a =>
        '<div class="atk"><div><div class="nm">' + energy(a.cost) + ' ' + esc(a.name) + '</div>'
        + (a.text ? '<div class="txt">' + esc(a.text) + '</div>' : '') + '</div>'
        + '<div class="dmg">' + esc(a.damage || "") + '</div></div>').join("") + '</div>';
  }
  const wr = [];
  if(c.weaknesses)  wr.push("Weakness: " + c.weaknesses.map(w => w.type + " " + w.value).join(", "));
  if(c.resistances) wr.push("Resistance: " + c.resistances.map(w => w.type + " " + w.value).join(", "));
  if(c.retreatCost) wr.push("Retreat: " + c.retreatCost.length);
  if(wr.length) body += '<div class="blk"><div style="color:var(--dim);font-size:13px">' + esc(wr.join("   •   ")) + '</div></div>';
  if(c.rules)     body += '<div class="blk"><h4>Rules</h4><div style="color:var(--dim);font-size:13px">' + c.rules.map(esc).join("<br><br>") + '</div></div>';
  if(c.flavorText)body += '<div class="blk"><div style="font-style:italic;color:var(--dim);font-size:13px">' + esc(c.flavorText) + '</div></div>';

  const s = c.set || {};
  const total = s.printedTotal || s.total || "?";
  const idBlock = '<div class="idcard">'
    + '<div><small>Set</small><b>'
    +   (s.images && s.images.symbol ? '<img src="' + s.images.symbol + '" alt="">' : '')
    +   esc(s.name || "—") + '</b></div>'
    + '<div><small>Card number</small><b>' + esc(String(c.number)) + ' / ' + esc(String(total)) + '</b></div>'
    + '<div><small>Rarity</small><b>' + esc(c.rarity || "—") + '</b></div>'
    + '<div><small>Released</small><b>' + fmtDate(s.releaseDate) + '</b></div>'
    + (c.artist ? '<div><small>Illustrator</small><b>' + esc(c.artist) + '</b></div>' : '')
    + '</div>'
    + '<div style="margin:-6px 0 14px;display:flex;gap:8px;flex-wrap:wrap">' + ownBtn(c.id)
    + (s.id && SETS.some(x => x.id === s.id)
        ? '<button class="back" style="padding:6px 12px;font-size:13px" '
          + 'onclick="closeCard(); openSet(\'' + s.id + '\')">See the whole ' + esc(s.name) + ' set &rarr;</button>'
        : '')
    + '</div>';

  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="modal" onclick="if(event.target===this)closeCard()">'
    + '<div class="sheet"><button class="x" onclick="closeCard()">&times;</button>'
    + '<img class="hero" src="' + ((c.images && (c.images.large || c.images.small)) || "") + '" alt="' + esc(c.name) + '">'
    + '<div class="info"><h2>' + esc(c.name) + (c.hp ? ' <span style="color:var(--dim);font-size:16px">HP ' + esc(c.hp) + '</span>' : '') + '</h2>'
    + '<div class="sub">' + esc(c.supertype || "") + ' &nbsp;•&nbsp; check these against the card in your hand</div>'
    + idBlock
    + binderBlock(c.id)
    + '<div id="pricepane">' + priceBlock(c) + '</div>'
    + '<div class="chips">' + typeChips + subChips + '</div>'
    + body + '</div></div></div>');
}

/* Price for the printing currently selected, plus the picker to change it. */
function priceBlock(c){
  const tp = (c.tcgplayer && c.tcgplayer.prices) || {};
  const kinds = Object.keys(tp);
  let out = "";

  if(kinds.length > 1){
    out += '<div class="blk" style="border-top:0;padding-top:0"><h4>Which printing do you have?</h4>'
      + '<div class="vars">' + kinds.map(k =>
          '<button class="' + (k === modalVar ? "on" : "") + '" onclick="selectVar(\'' + k + '\')">'
          + esc(varLabel(k))
          + '<small>' + esc(varNote(k) || (tp[k] && tp[k].market != null ? money(tp[k].market) : "no price")) + '</small>'
          + '</button>').join("")
      + '</div></div>';
  }

  const v = tp[modalVar];
  const mk = v ? (v.market != null ? v.market : (v.mid != null ? v.mid : v.low)) : null;
  if(v && mk != null){
    out += '<div class="bigprice"><b>' + money(mk) + '</b>'
        +  '<span>' + esc(kinds.length > 1 ? varLabel(modalVar).toLowerCase() : "market price")
        +  ' &middot; TCGplayer</span></div>';
    const rows = [["low","Low"],["mid","Mid"],["high","High"],["directLow","Direct low"]]
      .filter(([k]) => v[k] != null)
      .map(([k,lab]) => '<div class="price"><small>' + lab + '</small><b>' + money(v[k]) + '</b></div>').join("");
    if(rows) out += '<div class="prices" style="margin-bottom:12px">' + rows + '</div>';
  } else if(v){
    // the printing is listed but has no sales behind it yet
    const r = cardValue(c);
    out += '<div class="bigprice est"><b>' + (r ? "~" + money(r.v) : "—") + '</b>'
        +  '<span><span class="tag">estimate</span> no sales yet for this printing</span></div>'
        +  (r ? warnBox(r, "TCGplayer lists this printing but has no sales behind it.") : "");
  } else if(!kinds.length){
    const r = cardValue(c);
    if(r && r.est){
      out += '<div class="bigprice est"><b>~' + money(r.v) + '</b>'
          +  '<span><span class="tag">estimate</span> not a real sale price</span></div>'
          +  warnBox(r);
    } else {
      out += '<div class="bigprice"><b style="color:var(--dim);font-size:18px">No price listed</b>'
          +  '<span>TCGplayer has no sales data for this card</span></div>';
    }
  }

  const cm = c.cardmarket && c.cardmarket.prices;
  if(cm && cm.trendPrice){
    out += '<div class="blk"><h4>Cardmarket (EU)</h4><div class="prices">'
      + '<div class="price"><small>trend</small><b>€' + cm.trendPrice.toFixed(2) + '</b></div>'
      + (cm.lowPrice ? '<div class="price"><small>low</small><b>€' + cm.lowPrice.toFixed(2) + '</b></div>' : '')
      + (cm.avg30 ? '<div class="price"><small>30-day avg</small><b>€' + cm.avg30.toFixed(2) + '</b></div>' : '')
      + '</div></div>';
  }
  return out;
}
function energy(cost){
  if(!cost || !cost.length) return "";
  return cost.map(t => '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'
    + (TYPE_COLORS[t] || "#ccc") + ';vertical-align:-2px;margin-right:2px;border:1px solid rgba(0,0,0,.4)" title="' + esc(t) + '"></span>').join("");
}
function closeCard(){ const m = document.getElementById("modal"); if(m) m.remove(); }
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(document.getElementById("signin")) closeSignIn(true);
    else if(document.getElementById("modal")) closeCard();
    else if(VIEW === "set" || VIEW === "search") showSets();
  }
});

/* ---------------- misc ---------------- */
function showSets(){
  closeCard();
  if(VIEW === "search") qIn.value = "";   // the set list filters on the same box
  qIn.placeholder = "Search sets…";
  VIEW = "sets";
  setTab();
  renderSets();
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function fmtDate(d){
  if(!d) return "—";
  const p = d.split("/");
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (M[parseInt(p[1],10)-1] || "") + " " + parseInt(p[2],10) + ", " + p[0];
}
qIn.addEventListener("input", () => {
  if(VIEW === "search") onSearchTyping();
  else if(VIEW === "sets") renderSets();
  else showSets();                       // typing while inside a set backs out to the set list
});
qIn.addEventListener("keydown", e => {
  if(e.key === "Enter" && VIEW === "search"){ clearTimeout(typeTimer); runSearch(qIn.value.trim()); }
});
sortIn.addEventListener("change", () => { if(VIEW === "sets") renderSets(); });
document.getElementById("snap").textContent = PACK_PRICES.d || "—";
loadSets();
initAccounts();
</script>
</body>
</html>
