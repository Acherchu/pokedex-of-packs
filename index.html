    || (s.n || "").toLowerCase().includes(term) || (s.set || "").toLowerCase().includes(term)
    || (s.rar || "").toLowerCase().includes(term) || String(s.num).toLowerCase() === num);
  document.getElementById("oshown").textContent = term ? hits.length + " / " + list.length + " cards" : "";
  document.getElementById("ogrid").innerHTML = sortOwned(hits).map(ownedTile).join("")
    || '<div class="msg" style="grid-column:1/-1">Nothing in your collection matches “' + esc(ownedTerm.trim()) + '”.</div>';
}

/* ---------------- card scanner ----------------
   A faster way into the collection: point the camera at a card and snap it. The site reads two
   things off the photo with Tesseract.js — the card's name from the top strip and its collector
   number ("199/165") from the bottom strip — and looks that printing up in the API.
   Reading a photo is never trusted blindly: what was read shows in editable boxes, the matches are
   ranked (number + set size + name), and you tap "+ Add to collection" on the right one.
   Tesseract (script, wasm and English data from cdn.jsdelivr.net) loads only when the scanner opens;
   nothing else on the site depends on it. The camera needs https or localhost; "Use a photo"
   works anywhere, and on phones opens the camera app. */
const TESS_SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
let scanStream = null, ocrWorker = null, ocrLoading = null, scanSeq = 0;
let scanHits = [], scanRead = {name: "", num: "", total: ""};

function openScanner(){
  if(needSignIn()) return;                   // adding needs somewhere to save it
  if(document.getElementById("scanner")) return;
  buildScanner();
  startCamera();
  getOcr().catch(() => {});                  // warm the reader up while the camera starts
}
/* The scanner's markup on its own, with no camera — so the auto-snap can be tested by feeding the
   <video> a drawn canvas stream instead of a real camera. */
function buildScanner(){
  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="scanner" style="z-index:95" onclick="if(event.target===this)closeScanner()">'
    + '<div class="sheet scan"><button class="x" onclick="closeScanner()">&times;</button>'
    + '<h2>📷 Scan a card</h2>'
    + '<div class="scansub">Hold the card flat inside the yellow box. It snaps by itself once the card is steady and sharp.</div>'
    + '<div class="scanstage" id="scanstage"><video id="scanvideo" playsinline muted autoplay></video>'
    +   '<div class="scanframe" id="scanframe"><span id="framelabel">Put a card in the box</span><i id="holdbar"></i></div></div>'
    + '<div class="scanbtns">'
    +   '<button class="btn-gold" id="snapbtn" onclick="snapCard()">📸 Snap</button>'
    +   '<label class="back">🖼 Use a photo<input type="file" accept="image/*" hidden onchange="scanFile(this)"></label>'
    +   '<label class="autotog"><input type="checkbox" id="autosnap"' + (autoSnapOn ? " checked" : "") + ' onchange="setAutoSnap(this.checked)">Snap by itself</label>'
    + '</div>'
    + '<div class="scanstatus" id="scanstatus">Starting the camera…</div>'
    + '<div class="scanread" id="scanread" hidden>'
    +   'Name <input id="scanname" placeholder="Card name" onkeydown="if(event.key===&quot;Enter&quot;)lookupScan()">'
    +   'Number <input id="scannum" placeholder="199/165" onkeydown="if(event.key===&quot;Enter&quot;)lookupScan()">'
    +   '<button class="back" style="padding:7px 12px;font-size:13px" onclick="lookupScan()">Search</button>'
    + '</div>'
    + '<div class="found" id="scanhits"></div>'
    + '</div></div>');
}
function closeScanner(){
  scanBusy = false;
  stopAutoSnap();
  stopCamera();
  scanSeq++;                                  // drop any read still in flight
  const m = document.getElementById("scanner"); if(m) m.remove();
  scanHits = [];
}
async function startCamera(){
  const status = document.getElementById("scanstatus"), stage = document.getElementById("scanstage");
  const noCam = msg => {
    if(stage) stage.innerHTML = '<div class="camerr"><div>' + msg + '</div></div>';
    const b = document.getElementById("snapbtn"); if(b) b.hidden = true;
    const typed = document.getElementById("scanread"); if(typed) typed.hidden = false;   // typing a card in still works
    if(status) status.textContent = "";
  };
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    return noCam("This browser can't use the camera here.<br>Tap <b>Use a photo</b> instead.");
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: "environment"}, width: {ideal: 2560}, height: {ideal: 1920}}, audio: false
    });
    if(!document.getElementById("scanner")){ stream.getTracks().forEach(t => t.stop()); return; }
    scanStream = stream;
    // widest zoom the camera offers (phones that support it), so it doesn't start zoomed in
    const track = stream.getVideoTracks()[0];
    try{
      const caps = track && track.getCapabilities ? track.getCapabilities() : {};
      if(caps.zoom) track.applyConstraints({advanced: [{zoom: caps.zoom.min}]}).catch(() => {});
    }catch(e){}
    attachVideo(stream);
    if(status) status.textContent = autoSnapOn ? "Hold a card in the yellow box — it snaps by itself when it's steady and sharp."
      : "Fit the card in the yellow box, then tap Snap.";
  }catch(e){
    const n = e && e.name;
    noCam(n === "NotAllowedError" ? "The camera is blocked for this site.<br>Allow it from the icon in the address bar, or tap <b>Use a photo</b>."
      : n === "NotFoundError" || n === "OverconstrainedError" ? "No camera found.<br>Tap <b>Use a photo</b> instead."
      : "The camera didn't start (" + esc(n || e) + ").<br>Tap <b>Use a photo</b> instead.");
  }
}
/* Show the stream in the stage, shaped like the camera's own picture so nothing is cropped away. */
function attachVideo(stream){
  const v = document.getElementById("scanvideo");
  if(!v) return;
  v.onloadedmetadata = v.onresize = fitStage;
  v.srcObject = stream;
  v.play().catch(() => {});
  startAutoSnap();
}
function fitStage(){
  const v = document.getElementById("scanvideo"), stage = document.getElementById("scanstage");
  if(!v || !stage || !v.videoWidth) return;
  stage.style.aspectRatio = v.videoWidth + " / " + v.videoHeight;
  // a portrait picture has room to spare above and below the card; a landscape one doesn't
  stage.style.setProperty("--fh", Math.round(frameHeight(v.videoWidth, v.videoHeight) * 100) + "%");
}
function frameHeight(vw, vh){ return vh >= vw ? 0.68 : 0.84; }
function stopCamera(){
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(!ocrLoading){
    ocrLoading = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = TESS_SRC;
      sc.onload = res;
      sc.onerror = () => { ocrLoading = null; sc.remove(); rej(new Error("Couldn't load the card reader — check your connection.")); };
      document.head.appendChild(sc);
    });
  }
  return ocrLoading;
}
// one shared reader; a failed load clears it so the next snap tries again
function getOcr(){
  if(!ocrWorker){
    ocrWorker = loadTesseract()
      .then(() => Tesseract.createWorker("eng"))
      .catch(e => { ocrWorker = null; throw e; });
  }
  return ocrWorker;
}

/* The yellow box is centred on the stage at 84% of its height with a card's shape; the video is
   drawn object-fit:cover, so map that box back into the video's own pixels to crop the card. */
/* Where the yellow box sits in the video's own pixels. The video is drawn object-fit:contain, so
   undo that scale and letterboxing. Everything that reads a frame — Snap and auto-snap — uses this. */
function frameCrop(v, stage){
  const sw = stage.clientWidth, sh = stage.clientHeight, vw = v.videoWidth, vh = v.videoHeight;
  const scale = Math.min(sw / vw, sh / vh);
  const fh = sh * frameHeight(vw, vh), fw = fh * 63 / 88;
  const fx = (sw - fw) / 2, fy = (sh - fh) / 2;
  const ox = (sw - vw * scale) / 2, oy = (sh - vh * scale) / 2;
  const cx = Math.max(0, (fx - ox) / scale), cy = Math.max(0, (fy - oy) / scale);
  return {x: cx, y: cy, w: Math.min(vw - cx, fw / scale), h: Math.min(vh - cy, fh / scale)};
}
function snapCard(){
  const v = document.getElementById("scanvideo"), stage = document.getElementById("scanstage");
  if(!v || !v.videoWidth || scanBusy) return;
  const r = frameCrop(v, stage);
  const card = document.createElement("canvas");
  card.width = Math.round(r.w); card.height = Math.round(r.h);
  card.getContext("2d").drawImage(v, r.x, r.y, r.w, r.h, 0, 0, card.width, card.height);
  readAndLookup(card);
}

/* ---- auto-snap ----
   Five times a second, look at a tiny grey copy of the yellow box (plus a margin) and ask:
   - is a card lined up with it? — a straight edge (a column or row of strong contrast) near at
     least 3 of the 4 sides, clearly stronger than the background's general texture;
   - is it sharp? — enough fine detail (Laplacian) inside the card;
   - is it steady? — the picture barely changed since the last look.
   When all three hold for AUTO_HOLD looks in a row, snap. Then wait: it won't snap again until
   the card has left the box, so one card isn't scanned over and over.
   Thresholds were tuned on drawn test frames of real card art on wood / carpet / dark / white
   desks, with and without sensor noise, not a real camera. Measured: a still card moves 2.5–3.5,
   6px of motion is 10+; a card 85–100% of the box (or tilted 6°) finds 3–4 edges, an empty desk or
   a card at 60% finds 0. Focus (focusScore) is 0.65–0.73 for every sharp card tried — text-heavy
   1999 cards, full arts, a plain Energy — 0.52–0.62 at a 1.5px blur, ≤0.49 at 3px, 0 on a bare desk.
   Through a video stream the same sharp Pikachu scored 0.60, so AUTO_FOCUS sits a little lower at 0.56.
   A real camera's video compression may pull sharp frames lower still, so a card that has held its best
   focus (≥92% of its peak, and not below AUTO_FOCUS_FLOOR) for AUTO_PATIENT looks also counts. */
const AUTO_W = 72, AUTO_H = 100, AUTO_HOLD = 5, AUTO_PATIENT = 10;
const AUTO_EDGE = 1.9, AUTO_STEADY = 8, AUTO_FOCUS = 0.56, AUTO_FOCUS_FLOOR = 0.45;
let autoSnapOn = store.get("pkAutoSnap", true);
let autoTimer = null, autoPrev = null, autoGood = 0, autoArmed = true, autoEmpty = 0, scanBusy = false;
let autoPeak = 0, autoPresent = 0;          // best focus seen, and how long, since this card came into the box
function setAutoSnap(on){
  autoSnapOn = !!on;
  store.set("pkAutoSnap", autoSnapOn);
  autoGood = 0; showHold(false, 0);
  const st = document.getElementById("scanstatus");
  if(st && !scanBusy && !scanHits.length) st.textContent = autoSnapOn
    ? "Hold a card in the yellow box — it snaps by itself when it's steady and sharp." : "Fit the card in the yellow box, then tap Snap.";
}
function startAutoSnap(){
  stopAutoSnap();
  autoArmed = true; autoPrev = null; autoEmpty = 0;
  autoTimer = setInterval(autoTick, 200);
}
function stopAutoSnap(){
  if(autoTimer) clearInterval(autoTimer);
  autoTimer = null; autoGood = 0;
}
/* Grey pixels of the box plus a 10% margin each side, AUTO_W × AUTO_H. */
function frameGrey(src, r){
  const mx = r.w * 0.1, my = r.h * 0.1;
  const c = frameGrey.c || (frameGrey.c = document.createElement("canvas"));
  c.width = AUTO_W; c.height = AUTO_H;
  const g = c.getContext("2d", {willReadFrequently: true});
  g.drawImage(src, r.x - mx, r.y - my, r.w + 2 * mx, r.h + 2 * my, 0, 0, AUTO_W, AUTO_H);
  const d = g.getImageData(0, 0, AUTO_W, AUTO_H).data, out = new Float32Array(AUTO_W * AUTO_H);
  for(let i = 0, j = 0; i < d.length; i += 4, j++) out[j] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
  return out;
}
function frameStats(gr, prev){
  const W = AUTO_W, H = AUTO_H, at = (x, y) => gr[y * W + x];
  // general texture: mean gradient over the whole picture
  let tex = 0, n = 0;
  for(let y = 1; y < H - 1; y++) for(let x = 1; x < W - 1; x++){ tex += Math.abs(at(x+1, y) - at(x-1, y)) + Math.abs(at(x, y+1) - at(x, y-1)); n++; }
  tex /= n;
  // strongest straight edge in the outer band of each side (the card's edge lands ~8% in)
  const colEdge = (x0, x1) => { let best = 0; for(let x = Math.max(1, x0); x <= Math.min(W - 2, x1); x++){ let m = 0; for(let y = Math.round(H * 0.15); y < H * 0.85; y++) m += Math.abs(at(x+1, y) - at(x-1, y)); best = Math.max(best, m / (H * 0.7)); } return best; };
  const rowEdge = (y0, y1) => { let best = 0; for(let y = Math.max(1, y0); y <= Math.min(H - 2, y1); y++){ let m = 0; for(let x = Math.round(W * 0.15); x < W * 0.85; x++) m += Math.abs(at(x, y+1) - at(x, y-1)); best = Math.max(best, m / (W * 0.7)); } return best; };
  const bw = Math.round(W * 0.2), bh = Math.round(H * 0.2);
  const sides = [colEdge(0, bw), colEdge(W - 1 - bw, W - 1), rowEdge(0, bh), rowEdge(H - 1 - bh, H - 1)];
  const edges = sides.filter(e => e > AUTO_EDGE * (tex / 2) + 6).length;
  // movement since the last look
  let move = 99;
  if(prev){ move = 0; for(let i = 0; i < gr.length; i++) move += Math.abs(gr[i] - prev[i]); move /= gr.length; }
  return {edges: edges, move: move, tex: tex, card: edges >= 3, still: move <= AUTO_STEADY};
}
/* How much of the picture's fine detail a small blur takes away (after Crété-Roffet): a sharp
   picture loses a lot, an already blurry one hardly changes — so it doesn't depend on how much
   print or art a card has. Measured on the top half of the card at 240×150. */
function focusScore(src, r){
  const FW = 240, FH = 150;
  const c = focusScore.c || (focusScore.c = document.createElement("canvas"));
  c.width = FW; c.height = FH;
  const g = c.getContext("2d", {willReadFrequently: true});
  g.drawImage(src, r.x + r.w * 0.06, r.y + r.h * 0.04, r.w * 0.88, r.w * 0.88 * FH / FW, 0, 0, FW, FH);
  const d = g.getImageData(0, 0, FW, FH).data, L = new Float32Array(FW * FH), T = new Float32Array(FW * FH), B = new Float32Array(FW * FH);
  for(let i = 0, j = 0; i < d.length; i += 4, j++) L[j] = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
  for(let y = 0; y < FH; y++) for(let x = 0; x < FW; x++){      // box blur 5, across then down
    let s = 0, n = 0; for(let k = -2; k <= 2; k++){ const xx = x + k; if(xx >= 0 && xx < FW){ s += L[y * FW + xx]; n++; } }
    T[y * FW + x] = s / n;
  }
  for(let y = 0; y < FH; y++) for(let x = 0; x < FW; x++){
    let s = 0, n = 0; for(let k = -2; k <= 2; k++){ const yy = y + k; if(yy >= 0 && yy < FH){ s += T[yy * FW + x]; n++; } }
    B[y * FW + x] = s / n;
  }
  let all = 0, lost = 0;
  for(let y = 0; y < FH - 1; y++) for(let x = 0; x < FW - 1; x++){
    const i = y * FW + x;
    const o = Math.abs(L[i] - L[i + FW]) + Math.abs(L[i] - L[i + 1]);
    const b = Math.abs(B[i] - B[i + FW]) + Math.abs(B[i] - B[i + 1]);
    all += o; lost += Math.max(0, o - b);
  }
  return all ? lost / all : 0;
}
function autoTick(){
  const v = document.getElementById("scanvideo"), stage = document.getElementById("scanstage");
  if(!document.getElementById("scanner")){ stopAutoSnap(); return; }
  if(!v || !v.videoWidth || !stage) return;
  let st;
  try{
    const crop = frameCrop(v, stage);
    const gr = frameGrey(v, crop);
    st = frameStats(gr, autoPrev);
    autoPrev = gr;
    st.focus = st.card ? focusScore(v, crop) : 0;
  }catch(e){ return; }
  if(st.card){ autoPresent++; if(st.still) autoPeak = Math.max(autoPeak, st.focus); }
  else { autoPresent = 0; autoPeak = 0; }
  st.focused = st.focus >= AUTO_FOCUS
    || (st.focus >= AUTO_FOCUS_FLOOR && st.focus >= autoPeak * 0.92 && autoPresent >= AUTO_PATIENT);
  autoTick.last = st;                          // handy when checking the numbers by hand
  // re-arm once the snapped card has gone
  autoEmpty = st.card ? 0 : autoEmpty + 1;
  if(!autoArmed && autoEmpty >= 3) autoArmed = true;
  const good = st.card && st.focused && st.still;
  if(!autoSnapOn || scanBusy || !autoArmed){ autoGood = 0; showHold(st.card && autoArmed, 0, !autoArmed && st.card); return; }
  autoGood = good ? autoGood + 1 : 0;
  showHold(st.card, autoGood / AUTO_HOLD, false, st);
  if(autoGood >= AUTO_HOLD){
    autoGood = 0; autoArmed = false;
    showHold(false, 0, true);
    snapCard();
  }
}
function showHold(ready, fill, done, st){
  const f = document.getElementById("scanframe"), bar = document.getElementById("holdbar"), label = document.getElementById("framelabel");
  if(!f) return;
  f.classList.toggle("ready", !!ready);
  if(bar) bar.style.width = Math.min(100, Math.round(fill * 100)) + "%";
  if(label) label.textContent = done ? "Got it — take the card out for the next one"
    : !autoSnapOn ? "Fit the card in the box"
    : ready ? (fill > 0 ? "Hold still…" : st && !st.still ? "Hold it steady" : st && !st.focused ? "Getting it sharp…" : "Hold it steady")
    : "Put a card in the box";
}
function scanFile(input){
  const f = input.files && input.files[0];
  input.value = "";
  if(!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
    readAndLookup(c, true);
  };
  img.onerror = () => setScanStatus("That file isn't a picture the browser can open.");
  img.src = URL.createObjectURL(f);
}
function setScanStatus(html){ const el = document.getElementById("scanstatus"); if(el) el.innerHTML = html; }

let scanSig = null;          // colour signature of the last snapped card, for matching pictures

async function readAndLookup(card, isPhoto){
  const seq = ++scanSeq;
  scanBusy = true;
  const btn = document.getElementById("snapbtn"); if(btn) btn.disabled = true;
  scanHits = []; drawScanHits();                // don't leave the last card's matches up to be tapped by mistake
  setScanStatus('<span class="spinner" style="display:inline-block;width:14px;height:14px;margin:0 6px -2px 0;border-width:2px"></span>Reading the card…');
  try{
    scanSig = artSignature(card, card.width, card.height);
    const read = await readCard(card, isPhoto);
    if(seq !== scanSeq) return;
    scanRead = read;
    const top = read.numbers[0];
    document.getElementById("scanread").hidden = false;
    document.getElementById("scanname").value = read.name;
    document.getElementById("scannum").value = top ? top.num + "/" + top.total : "";
    await lookupScan(seq, read);
  }catch(e){
    if(seq === scanSeq) setScanStatus(esc(e.message || e));
  }finally{
    if(btn) btn.disabled = false;
    if(seq === scanSeq) scanBusy = false;       // a newer read still running keeps it busy
  }
}

/* ---- reading text off the card ---- */

/* Crops a strip of the card, scales it up and flattens it to high-contrast grey — Tesseract reads
   small printed text far better that way. invert=true handles light text on dark or foil cards. */
function strip(card, x0, y0, x1, y1, invert){
  const w = card.width * (x1 - x0), h = card.height * (y1 - y0);
  const k = Math.max(1, 1400 / w);
  const c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext("2d", {willReadFrequently: true});
  g.imageSmoothingQuality = "high";
  g.drawImage(card, card.width * x0, card.height * y0, w, h, 0, 0, c.width, c.height);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  let lo = 255, hi = 0;
  for(let i = 0; i < d.length; i += 4){
    const l = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    d[i] = l; if(l < lo) lo = l; if(l > hi) hi = l;
  }
  const span = Math.max(1, hi - lo);
  for(let i = 0; i < d.length; i += 4){
    let l = (d[i] - lo) * 255 / span;
    if(invert) l = 255 - l;
    d[i] = d[i+1] = d[i+2] = l;
  }
  g.putImageData(im, 0, 0);
  return c;
}
/* Hard black-and-white version of a region. Full-art and foil cards print the number as small
   slanted white text with a dark outline, which plain contrast can't read; keeping only the darkest
   pixels (the outline) or only the brightest (the fill) turns it back into readable ink. */
function inked(card, x0, y0, x1, y1, thr, keepBright){
  const w = card.width * (x1 - x0), h = card.height * (y1 - y0), k = 1800 / w;
  const c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext("2d", {willReadFrequently: true});
  g.imageSmoothingQuality = "high";
  g.drawImage(card, card.width * x0, card.height * y0, w, h, 0, 0, c.width, c.height);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  for(let i = 0; i < d.length; i += 4){
    const l = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    d[i] = d[i+1] = d[i+2] = (keepBright ? l > thr : l < thr) ? 0 : 255;
  }
  g.putImageData(im, 0, 0);
  return c;
}
async function ocrRun(canvas, psm, whitelist){
  const w = await getOcr();
  await w.setParameters({tessedit_pageseg_mode: String(psm), tessedit_char_whitelist: whitelist || ""});
  return (await w.recognize(canvas, {}, {text: true, blocks: true})).data;
}
async function ocrText(canvas, psm, whitelist){ return (await ocrRun(canvas, psm, whitelist)).text || ""; }

/* The card's name is the biggest text on its top strip, so take the tallest real word there (and
   the equally tall words beside it — "Mr. Mime"). Small print like "STAGE 2" and "Evolves from
   Charmeleon" loses on height. */
const NAME_JUNK = /^(basic|stage|stage1|stage2|hp|evolves|from|put|on|the|trainer|item|supporter|stadium|tool|pokemon|pokémon|energy|special|ability|mega|v|vmax|vstar|ex|gx|tag|team|rule|lv|level|break|prism|star|radiant|x|y)$/i;
function nameFromWords(data){
  const lines = [];
  for(const bl of data.blocks || []) for(const pa of bl.paragraphs || []) for(const li of pa.lines || []) lines.push(li);
  const clean = t => t.replace(/[^A-Za-zÀ-ÿ'’.\-]/g, "");
  const usable = w => {
    const t = clean(w.text);
    return t.replace(/[^A-Za-zÀ-ÿ]/g, "").length >= 3 && !NAME_JUNK.test(t.replace(/[.'’-]/g, ""))
      && !/tage|basic|evolve/i.test(t) && w.confidence >= 35;
  };
  let best = null, bestLine = null;
  for(const li of lines) for(const w of li.words || []){
    if(!usable(w)) continue;
    const h = w.bbox.y1 - w.bbox.y0;
    if(!best || h > best.h){ best = {h: h, t: clean(w.text)}; bestLine = li; }
  }
  if(!best) return "";
  const parts = bestLine.words.filter(w => (w.bbox.y1 - w.bbox.y0) >= best.h * 0.7)
    .map(w => clean(w.text)).filter(t => /[A-Za-zÀ-ÿ]{2,}/.test(t) && !NAME_JUNK.test(t.replace(/[.'’-]/g, "")));
  return (parts.slice(0, 3).join(" ") || best.t).slice(0, 40);
}

/* What's typed in the Number box: "199/165", "004/165", "TG12/TG30", "GG13/GG70". */
function findNumber(text){
  const m = String(text).toUpperCase().replace(/\s*\/\s*/g, "/").match(/\b([A-Z]{0,3}\d{1,3})\/([A-Z]{0,3}\d{1,3})\b/);
  return m ? {num: m[1], total: m[2]} : null;
}

/* Number candidates from OCR text. A tiny slanted number reads noisily — "199/165" comes back as
   "7199/4165", "1997165" (slash read as a digit) or "020/789" (italic 1 read as 7). So every
   plausible reading is tried and scored: trimming stray leading digits costs a little, trimming the
   set size or swapping 7→1 costs more, and a reading only counts at all if its total is a real set
   size from SETS and the number fits that set (secret rares run past it, so up to +150). */
function numberFits(num, total, totals){
  const n = parseInt(num, 10), t = parseInt(total, 10);
  if(!(n >= 1) || !(t >= 1) || num.length > 3 || total.length > 3) return false;
  if(totals.size && !totals.has(t)) return false;
  return n <= t + 150;
}
function numberCandidates(text){
  const totals = new Set(SETS.map(x => x.printedTotal).filter(Boolean));
  const t = String(text).replace(/[|\\]/g, "/").replace(/(?<=\d)[Oo]|[Oo](?=\d)/g, "0").replace(/(?<=\d)[Il]|[Il](?=\d)/g, "1");
  const out = [];
  const add = (num, total, score) => {
    if(!numberFits(num, total, totals)) return;
    if(parseInt(total, 10) < 30) score *= 0.4;          // tiny sets are promos, rarely what's in hand
    out.push({num: num, total: total, score: score});
  };
  const swaps = str => {
    const v = [[str, 0]];
    for(let i = 0; i < str.length; i++) if(str[i] === "7") v.push([str.slice(0, i) + "1" + str.slice(i + 1), 0.4]);
    return v;
  };
  const pre = t.match(/\b([A-Z]{1,3})(\d{1,3})\s*\/\s*([A-Z]{1,3})(\d{1,3})\b/);
  if(pre && pre[1] === pre[3]) out.push({num: pre[1] + pre[2], total: pre[3] + pre[4], score: 4});
  for(const m of t.matchAll(/(\d{1,5})\s*\/\s*(\d{1,5})/g)){
    for(let i = 0; i < m[1].length; i++) for(let j = 0; j <= m[2].length - 2; j++)
      for(const [n, pn] of swaps(m[1].slice(i))) for(const [tt, pt] of swaps(m[2].slice(j)))
        add(n, tt, 3 - 0.3 * i - 0.8 * j - pn - pt);
  }
  for(const m of t.matchAll(/\d{4,8}/g)){
    const run = m[0];
    for(let i = 1; i < run.length; i++) for(const skip of [1, 0]){
      const total = run.slice(i + skip);
      if(total.length < 2) continue;
      for(let k = 0; k < i; k++) for(const [n, pn] of swaps(run.slice(k, i))) for(const [tt, pt] of swaps(total))
        add(n, tt, (skip ? 1 : 0.6) - 0.3 * k - pn - pt);
    }
  }
  return out;
}

async function readCard(card, isPhoto){
  const name = nameFromWords(await ocrRun(strip(card, 0.02, 0.015, 0.8, 0.13), 11));

  // number: modern cards print it bottom-left, older ones bottom-right. Cheapest reads first;
  // stop as soon as the readings agree strongly on one number.
  const digits = "0123456789/";
  const L = [0, 0.88, 0.45, 0.99], R = [0.6, 0.915, 1, 1];
  const passes = [
    () => ocrText(strip(card, 0, 0.87, 1, 0.995), 11),
    () => ocrText(strip(card, L[0], L[1], L[2], L[3]), 11),
    () => ocrText(strip(card, R[0], R[1], R[2], R[3]), 11),
    () => ocrText(inked(card, L[0], L[1], L[2], L[3], 60, false), 11, digits),
    () => ocrText(inked(card, L[0], L[1], L[2], L[3], 235, true), 11, digits),
    () => ocrText(inked(card, R[0], R[1], R[2], R[3], 90, false), 11, digits),
    () => ocrText(inked(card, R[0], R[1], R[2], R[3], 235, true), 11, digits)
  ];
  if(isPhoto) passes.push(() => ocrText(strip(card, 0, 0, 1, 1), 11));   // a loose photo: look everywhere
  const tally = {};
  const keyOf = c => (/^\d+$/.test(c.num) ? String(parseInt(c.num, 10)) : c.num) + "/" + (/^\d+$/.test(c.total) ? String(parseInt(c.total, 10)) : c.total);
  for(const pass of passes){
    for(const c of numberCandidates(await pass())) tally[keyOf(c)] = (tally[keyOf(c)] || 0) + c.score;
    const top = Object.values(tally).sort((x, y) => y - x)[0];
    if(top >= 3) break;
  }
  const numbers = Object.entries(tally).sort((x, y) => y[1] - x[1]).slice(0, 3)
    .map(([k, v]) => ({num: k.split("/")[0], total: k.split("/")[1], score: v}));
  return {name: name, numbers: numbers};
}

/* ---- matching pictures ----
   A small colour thumbnail of the artwork area, centred and scaled to unit length, so comparing
   two is a correlation: ~1 for the same card even under different light, low for different art. */
const SIG_W = 12, SIG_H = 16;
function artSignature(src, w, h){
  try{
    const c = document.createElement("canvas");
    c.width = SIG_W; c.height = SIG_H;
    const g = c.getContext("2d", {willReadFrequently: true});
    g.drawImage(src, w * 0.08, h * 0.1, w * 0.84, h * 0.42, 0, 0, SIG_W, SIG_H);
    const d = g.getImageData(0, 0, SIG_W, SIG_H).data;
    const v = new Float32Array(SIG_W * SIG_H * 3);
    for(let i = 0, j = 0; i < d.length; i += 4){ v[j++] = d[i]; v[j++] = d[i+1]; v[j++] = d[i+2]; }
    let mean = 0; for(const x of v) mean += x; mean /= v.length;
    let norm = 0; for(let i = 0; i < v.length; i++){ v[i] -= mean; norm += v[i] * v[i]; }
    norm = Math.sqrt(norm) || 1;
    for(let i = 0; i < v.length; i++) v[i] /= norm;
    return v;
  }catch(e){ return null; }                     // a picture the browser won't let us read
}
const sigCache = new Map();
function cardSignature(c){
  if(sigCache.has(c.id)) return sigCache.get(c.id);
  const url = c.images && (c.images.small || c.images.large);
  const job = !url ? Promise.resolve(null) : new Promise(res => {
    const img = new Image();
    img.crossOrigin = "anonymous";               // needed to read its pixels
    img.onload = () => res(artSignature(img, img.naturalWidth, img.naturalHeight));
    img.onerror = () => res(null);
    img.src = url + (url.includes("?") ? "&" : "?") + "scan=1";   // not the grid's cached no-CORS copy
    setTimeout(() => res(null), 8000);
  });
  sigCache.set(c.id, job);
  return job;
}
function sigMatch(a, b){
  if(!a || !b) return 0;
  let s = 0; for(let i = 0; i < a.length; i++) s += a[i] * b[i];
  return s;
}
function nameSim(a, b){
  const grams = x => { x = String(x || "").toLowerCase().replace(/[^a-z]/g, ""); const g = []; for(let i = 0; i < x.length - 1; i++) g.push(x.slice(i, i + 2)); return g; };
  const ga = grams(a), gb = grams(b);
  if(!ga.length || !gb.length) return 0;
  const pool = gb.slice(); let hit = 0;
  for(const g of ga){ const k = pool.indexOf(g); if(k >= 0){ hit++; pool.splice(k, 1); } }
  return 2 * hit / (ga.length + gb.length);
}

/* ---- finding the card ----
   Gather likely cards from what was read (number + set size, the number on its own in case the
   set size misread, the number with a letter prefix like GG13, and the name), then rank them by
   number match, name likeness and — most of all — how much their picture looks like the photo. */
async function lookupScan(seqIn, read){
  const seq = seqIn || ++scanSeq;
  const typedName = cleanScanName((document.getElementById("scanname") || {}).value);
  const typedNum = ((document.getElementById("scannum") || {}).value || "").trim();
  let numbers;
  if(read) numbers = read.numbers;
  else{
    const f = findNumber(typedNum);
    numbers = f ? [{num: f.num, total: f.total, score: 3}]
      : (/^[A-Z]{0,3}\d{1,3}$/i.test(typedNum) ? [{num: typedNum.toUpperCase(), total: "", score: 2}] : []);
  }
  const name = typedName;
  if(!name && !numbers.length){
    setScanStatus("Couldn't read this card. Snap it again with the name and the number at the bottom in focus — or type them in the boxes above.");
    document.getElementById("scanread").hidden = false;
    scanHits = []; drawScanHits();
    return;
  }
  setScanStatus('<span class="spinner" style="display:inline-block;width:14px;height:14px;margin:0 6px -2px 0;border-width:2px"></span>Finding '
    + esc([name, numbers[0] ? numbers[0].num + (numbers[0].total ? "/" + numbers[0].total : "") : ""].filter(Boolean).join(" · ")) + '…');

  const apiNum = n => /^\d+$/.test(n) ? String(parseInt(n, 10)) : String(n).toUpperCase();
  const queries = [];
  numbers.slice(0, 2).forEach(n => { if(/^\d+$/.test(n.total)) queries.push('number:"' + apiNum(n.num) + '" set.printedTotal:' + parseInt(n.total, 10)); });
  if(numbers[0]){
    queries.push('number:"' + apiNum(numbers[0].num) + '"');
    if(/^\d+$/.test(numbers[0].num) && /^\d+$/.test(numbers[0].total)) queries.push('number:"*' + apiNum(numbers[0].num) + '" set.printedTotal:' + parseInt(numbers[0].total, 10));
  }
  const firstWord = name.split(" ").sort((x, y) => y.length - x.length)[0] || "";
  if(firstWord.length >= 3) queries.push('name:"*' + firstWord + '*"');

  // all at once — the free API is slow and retries a lot, so waiting on each in turn adds up
  const settled = await Promise.allSettled(queries.map(q =>
    getJSON(API + "/cards?q=" + encodeURIComponent(q) + "&orderBy=-set.releaseDate&pageSize=" + (q.startsWith("name:") ? 100 : 60))));
  if(seq !== scanSeq) return;
  const pool = new Map();
  for(const r of settled) if(r.status === "fulfilled") for(const c of r.value.data || []) pool.set(c.id, c);
  if(!settled.some(r => r.status === "fulfilled")){
    scanHits = []; drawScanHits();              // never leave the last card's matches showing
    setScanStatus("The Pokémon TCG API isn't answering right now — tap Search in a moment.");
    return;
  }
  const cards = [...pool.values()];
  remember(cards);

  // text score first, then compare pictures for the best few dozen
  const textScore = c => {
    let best = 0;
    numbers.forEach((n, k) => {
      const numOk = String(c.number).toUpperCase() === apiNum(n.num);
      const suffixOk = String(c.number).toUpperCase().endsWith(apiNum(n.num));
      const totOk = n.total && c.set && String(c.set.printedTotal) === String(parseInt(n.total, 10));
      const pts = numOk && totOk ? 4 - k * 0.6 : suffixOk && totOk ? 3 - k * 0.6 : numOk ? 1.5 - k * 0.3 : 0;
      if(pts > best) best = pts;
    });
    return best + 3 * nameSim(c.name, name);
  };
  // with a number to go on, the right card is near the top already; with only a name, look at more pictures
  const ranked = cards.map(c => ({c: c, t: textScore(c), img: 0})).sort((x, y) => y.t - x.t).slice(0, numbers.length ? 30 : 60);
  if(scanSig){                                   // a typed re-search still compares against the last snap
    setScanStatus('<span class="spinner" style="display:inline-block;width:14px;height:14px;margin:0 6px -2px 0;border-width:2px"></span>Comparing pictures…');
    const sigs = await Promise.all(ranked.map(r => cardSignature(r.c)));
    if(seq !== scanSeq) return;
    ranked.forEach((r, i) => { r.img = Math.max(0, sigMatch(scanSig, sigs[i])); });
  }
  ranked.forEach(r => { r.total = r.t + 6 * r.img; });
  ranked.sort((x, y) => y.total - x.total);
  scanHits = ranked.slice(0, 12).map(r => r.c);

  const top = ranked[0], next = ranked[1];
  const sure = top && (top.t >= 4 || top.img >= 0.8) && (!next || top.total - next.total >= 1.2);
  setScanStatus(!top ? "No card matched. Fix the name or number above and hit Search."
    : sure ? "Found it: <b>" + esc(top.c.name) + "</b> from " + esc((top.c.set || {}).name || "") + " — tap <b>+ Add to collection</b>. Wrong one? The next closest are below it."
    : "Here are the closest matches — tap <b>+ Add to collection</b> on yours, or fix the name or number above and hit Search.");
  drawScanHits();
}
function cleanScanName(v){ return String(v || "").replace(/[^A-Za-zÀ-ÿ0-9'’.\- ]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 40); }
function drawScanHits(){
  const el = document.getElementById("scanhits"); if(!el) return;
  el.innerHTML = scanHits.map(findTile).join("");
}

/* ---------------- accounts ----------------
   Making a collection needs signing in, so there's someone to save it for. Signing in is a name and
   a password — no Google, no outside service — and each name gets its own collection and binder
   layout, saved on this device:
     pkProfiles = {<lowercased name>: {name, owned, binder, pw:{salt, hash, it}}}
     pkUser     = the lowercased name signed in (a reload keeps you signed in)
   The password is never stored: pw is a PBKDF2-SHA256 hash with a random salt. It keeps other
   people using this device out of your collection on the site; it is not encryption — the
   collection itself is plain JSON that browser dev tools could read. There's no reset (no server),
   and the sign-in box says so. Browsing sets, prices and card search never needs signing in. */
let USER = null;                 // {key, name} of whoever is signed in
let pendingOwn = "";             // a card someone tried to add before signing in; added once they do
const NAME_MAX = 24, PW_MIN = 4, PW_ITER = 150000;

/* Accounts are the one thing on this site that can't be fetched again, so they're handled carefully.
   A site update only replaces index.html — it never touches localStorage — so the rule for any
   future change is: keep the key names pkProfiles / pkUser and the profile shape above, and if the
   shape ever has to change, convert old profiles when they're read. Never rename, clear or reformat
   them in place. On top of that:
   - pkProfilesBackup is the previous good copy, written just before every save. If pkProfiles is
     ever missing or unreadable, it comes back from the backup.
   - If pkProfiles can't be read, nothing writes over it: a copy goes to pkProfilesRescue and saving
     is refused until it can be read again.
   - A save that would leave out a name that already exists is refused — the site has no way to
     delete a name, so that can only be a bug.
   - navigator.storage.persist() asks the browser not to clear the site's storage to free up space. */
function parseProfiles(raw){
  try{ const o = JSON.parse(raw); return o && typeof o === "object" && !Array.isArray(o) ? o : null; }
  catch(e){ return null; }
}
function readProfiles(){
  let raw, backup;
  try{ raw = localStorage.getItem("pkProfiles"); backup = localStorage.getItem("pkProfilesBackup"); }
  catch(e){ return {ok: false, data: {}}; }                     // storage blocked
  const restore = () => {
    const b = backup != null ? parseProfiles(backup) : null;
    if(!b) return null;
    try{ localStorage.setItem("pkProfiles", backup); }catch(e){}
    return b;
  };
  if(raw == null){
    const b = restore();
    return {ok: true, data: b || {}};
  }
  const o = parseProfiles(raw);
  if(o) return {ok: true, data: o};
  try{ if(localStorage.getItem("pkProfilesRescue") == null) localStorage.setItem("pkProfilesRescue", raw); }catch(e){}
  const b = restore();
  return b ? {ok: true, data: b} : {ok: false, data: {}};
}
function profiles(){ return readProfiles().data; }
function writeProfiles(all){
  const cur = readProfiles();
  if(!cur.ok){
    toast("Your saved names couldn't be read, so nothing was saved — and nothing was deleted.");
    return false;
  }
  for(const k in cur.data){
    if(!(k in all)){ toast("Didn't save: that would have lost the name " + (cur.data[k].name || k) + "."); return false; }
  }
  try{
    const prev = localStorage.getItem("pkProfiles");
    if(prev != null) localStorage.setItem("pkProfilesBackup", prev);
    localStorage.setItem("pkProfiles", JSON.stringify(all));
    return true;
  }catch(e){
    toast("Couldn't save — this browser's storage is full or turned off.");
    return false;
  }
}
function keepStorage(){
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
}

function initAccounts(){
  const key = store.get("pkUser", "");
  const p = key && profiles()[key];
  if(p){ useProfile(key, p); keepStorage(); }
  drawAccount(); refreshView();
}
function useProfile(key, p){
  USER = {key: key, name: p.name};
  OWNED = p.owned || {};
  for(const k in OWNED){                       // old {page, pocket} slots become one number
    const n = slotNumber(OWNED[k].slot, p.binder);
    if(n) OWNED[k].slot = n; else delete OWNED[k].slot;
  }
}

function saveCollection(){
  if(!USER) return;
  const all = profiles();
  all[USER.key] = Object.assign({}, all[USER.key], {name: USER.name, owned: OWNED});   // keeps pw
  writeProfiles(all);
}

/* The gate: anything that changes the collection asks this first. */
function needSignIn(id){
  if(USER) return false;
  pendingOwn = id || "";
  showSignIn();
  return true;
}
function showSignIn(){
  if(document.getElementById("signin")) return;
  const names = Object.values(profiles()).map(p => p.name).slice(0, 8);
  const enter = ' onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();signIn();}"';
  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="signin" style="z-index:110" onclick="if(event.target===this)closeSignIn(true)">'
    + '<div class="sheet signin"><button class="x" onclick="closeSignIn(true)">&times;</button>'
    + '<div class="pokeball"></div>'
    + '<h2>Sign in to make your collection</h2>'
    + '<p>You have to sign in so we can <b>save your stuff</b> — every card you add, and where it sits in your binder.'
    + ' Your password keeps other people on this device out of your collection.</p>'
    + '<form onsubmit="signIn(event)" autocomplete="on">'
    +   '<input id="signname" maxlength="' + NAME_MAX + '" placeholder="Your name" autocomplete="username" aria-label="Your name"'
    +     ' oninput="signMode()"' + enter + '>'
    +   '<input id="signpw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"' + enter + '>'
    +   '<input id="signpw2" type="password" placeholder="Type the password again" autocomplete="new-password" aria-label="Type the password again" hidden' + enter + '>'
    +   '<div class="signhint" id="signhint"></div>'
    +   '<div class="signerr" id="signerr"></div>'
    +   '<button class="btn-gold" id="signbtn" type="submit">Sign in</button>'
    + '</form>'
    + (names.length ? '<div class="names">Signed in here before?' + names.map(n =>
        '<button type="button" onclick="signInAs(this.dataset.n)" data-n="' + esc(n) + '">' + esc(n) + '</button>').join("") + '</div>' : '')
    + '<small>Your collection saves on this device under your name. There\'s no way to reset a forgotten'
    + ' password, so pick one you\'ll remember.<br>Browsing sets, prices and card search never needs signing in.</small>'
    + '</div></div>');
  const inp = document.getElementById("signname");
  if(inp) inp.focus();
}
function closeSignIn(cancelled){
  const m = document.getElementById("signin"); if(m) m.remove();
  if(cancelled) pendingOwn = "";
}
function cleanName(v){ return String(v || "").trim().replace(/\s+/g, " ").slice(0, NAME_MAX); }

/* The box adapts as you type a name: an existing name just needs its password; a new name (or one
   made before passwords existed) needs one picked and typed twice, so a typo can't lock you out. */
function signMode(){
  const name = cleanName((document.getElementById("signname") || {}).value);
  const prof = name ? profiles()[name.toLowerCase()] : null;
  const mode = !name ? "" : !prof ? "new" : !prof.pw ? "set" : "have";
  const pw2 = document.getElementById("signpw2"), pw = document.getElementById("signpw");
  const hint = document.getElementById("signhint"), btn = document.getElementById("signbtn");
  if(!pw2) return mode;
  pw2.hidden = !(mode === "new" || mode === "set");
  pw.setAttribute("autocomplete", mode === "have" ? "current-password" : "new-password");
  hint.textContent = mode === "new" ? "New name — pick a password (at least " + PW_MIN + " characters) and type it twice."
    : mode === "set" ? prof.name + " doesn't have a password yet — pick one now." : "";
  btn.textContent = mode === "new" ? "Make my name" : mode === "set" ? "Set password & sign in" : "Sign in";
  document.getElementById("signerr").textContent = "";
  return mode;
}
function signInAs(name){
  const inp = document.getElementById("signname");
  if(inp) inp.value = name;
  signMode();
  const pw = document.getElementById("signpw");
  if(pw) pw.focus();
}
function signErr(msg, el){
  const e = document.getElementById("signerr");
  if(e) e.textContent = msg;
  if(el) el.focus();
}

const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const fromB64 = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
async function hashPw(pw, saltB64, iterations){
  const salt = saltB64 ? fromB64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const it = iterations || PW_ITER;
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: it}, key, 256);
  return {salt: toB64(salt), hash: toB64(bits), it: it};
}

let signBusy = false;
async function signIn(ev){
  if(ev) ev.preventDefault();
  if(signBusy) return;
  const nameIn = document.getElementById("signname"), pwIn = document.getElementById("signpw"),
        pw2In = document.getElementById("signpw2"), btn = document.getElementById("signbtn");
  if(!nameIn) return;
  const name = cleanName(nameIn.value);
  if(!name) return signErr("Type a name to sign in.", nameIn);
  if(!(window.crypto && crypto.subtle)) return signErr("This browser can't keep passwords safe here, so signing in is off. Open the site from its web address.");
  const pw = pwIn.value;
  const key = name.toLowerCase();
  const mode = signMode();
  const all = profiles();
  const prof = all[key];
  let pwRecord = null;

  if(mode === "have"){
    if(!pw) return signErr("Type your password.", pwIn);
  }else{
    if(pw.length < PW_MIN) return signErr("Pick a password with at least " + PW_MIN + " characters.", pwIn);
    if(pw !== pw2In.value){ pw2In.value = ""; return signErr("Those two passwords don't match — type it again.", pw2In); }
  }
  signBusy = true; btn.disabled = true;
  try{
    if(mode === "have"){
      const h = await hashPw(pw, prof.pw.salt, prof.pw.it);
      if(h.hash !== prof.pw.hash){ pwIn.value = ""; return signErr("That's not the password for " + prof.name + ".", pwIn); }
    }else{
      pwRecord = await hashPw(pw);
    }
  }catch(e){
    return signErr("Couldn't check the password — " + (e.message || e));
  }finally{
    signBusy = false; if(btn) btn.disabled = false;
  }

  const isNew = !prof;
  if(isNew) all[key] = {name: name, owned: {}, binder: 9};
  if(pwRecord) all[key].pw = pwRecord;

  // A collection saved on this browser before sign-in existed moves into the first name signed in.
  const old = store.get("pkOwned", null);
  let moved = 0;
  if(old && Object.keys(old).length){
    const mine = all[key], taken = {}, oldPerPage = store.get("pkBinder", 9);
    for(const k in mine.owned){ const n = slotNumber(mine.owned[k].slot, mine.binder); if(n) taken[n] = 1; }
    for(const k in old){
      if(mine.owned[k]) continue;
      const e = old[k], n = slotNumber(e.slot, oldPerPage);
      if(n && !taken[n]){ e.slot = n; taken[n] = 1; } else delete e.slot;   // one card per slot
      mine.owned[k] = e; moved++;
    }
  }
  if(!writeProfiles(all)) return;
  if(old){ localStorage.removeItem("pkOwned"); localStorage.removeItem("pkBinder"); }
  store.set("pkUser", key);
  useProfile(key, all[key]);
  keepStorage();

  closeSignIn(false);
  drawAccount(); refreshView(); redrawSheet();
  toast((isNew ? "Hi " + USER.name + "! Your collection saves on this device." : "Welcome back, " + USER.name + "!")
    + (moved ? " Moved " + moved + " card" + (moved === 1 ? "" : "s") + " you'd already saved into it." : ""));
  if(pendingOwn){
    const id = pendingOwn; pendingOwn = "";
    if(!OWNED[id] && CARDS.has(id)) toggleOwn(id);
  }
}
function signOut(){
  USER = null; OWNED = {}; pendingOwn = "";
  try{ localStorage.removeItem("pkUser"); }catch(e){}
  drawAccount(); refreshView(); redrawSheet();
}
function drawAccount(){
  const el = document.getElementById("acct"); if(!el) return;
  el.innerHTML = USER
    ? '<span class="who">' + esc(USER.name) + '</span><button class="back" onclick="signOut()">Sign out</button>'
    : '<button class="btn-gold" onclick="showSignIn()">Sign in</button>';
}
function redrawSheet(){
  if(!modalCard || !document.getElementById("modal")) return;
  const b = document.getElementById("ownbtn");
  if(b) b.outerHTML = ownBtn(modalCard.id);
  redrawBinder(modalCard.id);
}
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("on"), 5000);
}

/* ---------------- card modal ---------------- */
let modalCard = null, modalVar = "";

// what each TCGplayer printing actually looks like, so you can tell which one is in your hand
const VARIANTS = {
  normal:              ["Normal", "no shine — plain card stock"],
  holofoil:            ["Holofoil", "the artwork itself is shiny"],
  reverseHolofoil:     ["Reverse holofoil", "shiny everywhere except the artwork"],
  "1stEdition":        ["1st Edition", "has the 1st Edition stamp beside the art"],
  "1stEditionNormal":  ["1st Edition", "1st Edition stamp, no shine"],
  "1stEditionHolofoil":["1st Edition holofoil", "1st Edition stamp and shiny art"],
  unlimited:           ["Unlimited", "no 1st Edition stamp"],
  unlimitedHolofoil:   ["Unlimited holofoil", "shiny art, no 1st Edition stamp"]
};
function varLabel(k){
  if(VARIANTS[k]) return VARIANTS[k][0];
  return k.replace(/([A-Z])/g, " $1").replace(/^./, m => m.toUpperCase());
}
function varNote(k){ return VARIANTS[k] ? VARIANTS[k][1] : ""; }

function selectVar(k){
  modalVar = k;
  const pane = document.getElementById("pricepane");
  if(pane) pane.innerHTML = priceBlock(modalCard);
}

function openCard(id){
  const c = CARDS.get(id); if(!c) return;
  closeCard();            // never stack two sheets — duplicate ids would cross their wires
  modalCard = c;
  slotEditing = false;
  const tp = (c.tcgplayer && c.tcgplayer.prices) || {};
  const withPrice = Object.keys(tp).filter(k => tp[k] && tp[k].market != null);
  modalVar = withPrice[0] || Object.keys(tp)[0] || "";
  const typeChips = (c.types || []).map(t => '<span class="chip t" style="background:' + (TYPE_COLORS[t] || "#ccc") + '">' + esc(t) + '</span>').join("");
  const subChips  = (c.subtypes || []).map(s => '<span class="chip">' + esc(s) + '</span>').join("");

  let body = "";
  if(c.abilities && c.abilities.length){
    body += '<div class="blk"><h4>' + esc(c.abilities[0].type || "Ability") + '</h4>'
      + c.abilities.map(a => '<div class="atk"><div><div class="nm">' + esc(a.name) + '</div><div class="txt">' + esc(a.text || "") + '</div></div></div>').join("")
      + '</div>';
  }
  if(c.attacks && c.attacks.length){
    body += '<div class="blk"><h4>Attacks</h4>' + c.attacks.map(a =>
        '<div class="atk"><div><div class="nm">' + energy(a.cost) + ' ' + esc(a.name) + '</div>'
        + (a.text ? '<div class="txt">' + esc(a.text) + '</div>' : '') + '</div>'
        + '<div class="dmg">' + esc(a.damage || "") + '</div></div>').join("") + '</div>';
  }
  const wr = [];
  if(c.weaknesses)  wr.push("Weakness: " + c.weaknesses.map(w => w.type + " " + w.value).join(", "));
  if(c.resistances) wr.push("Resistance: " + c.resistances.map(w => w.type + " " + w.value).join(", "));
  if(c.retreatCost) wr.push("Retreat: " + c.retreatCost.length);
  if(wr.length) body += '<div class="blk"><div style="color:var(--dim);font-size:13px">' + esc(wr.join("   •   ")) + '</div></div>';
  if(c.rules)     body += '<div class="blk"><h4>Rules</h4><div style="color:var(--dim);font-size:13px">' + c.rules.map(esc).join("<br><br>") + '</div></div>';
  if(c.flavorText)body += '<div class="blk"><div style="font-style:italic;color:var(--dim);font-size:13px">' + esc(c.flavorText) + '</div></div>';

  const s = c.set || {};
  const total = s.printedTotal || s.total || "?";
  const idBlock = '<div class="idcard">'
    + '<div><small>Set</small><b>'
    +   (s.images && s.images.symbol ? '<img src="' + s.images.symbol + '" alt="">' : '')
    +   esc(s.name || "—") + '</b></div>'
    + '<div><small>Card number</small><b>' + esc(String(c.number)) + ' / ' + esc(String(total)) + '</b></div>'
    + '<div><small>Rarity</small><b>' + esc(c.rarity || "—") + '</b></div>'
    + '<div><small>Released</small><b>' + fmtDate(s.releaseDate) + '</b></div>'
    + (c.artist ? '<div><small>Illustrator</small><b>' + esc(c.artist) + '</b></div>' : '')
    + '</div>'
    + '<div style="margin:-6px 0 14px;display:flex;gap:8px;flex-wrap:wrap">' + ownBtn(c.id)
    + (s.id && SETS.some(x => x.id === s.id)
        ? '<button class="back" style="padding:6px 12px;font-size:13px" '
          + 'onclick="closeCard(); openSet(\'' + s.id + '\')">See the whole ' + esc(s.name) + ' set &rarr;</button>'
        : '')
    + '</div>';

  document.body.insertAdjacentHTML("beforeend",
    '<div class="modal" id="modal" onclick="if(event.target===this)closeCard()">'
    + '<div class="sheet"><button class="x" onclick="closeCard()">&times;</button>'
    + '<img class="hero" src="' + ((c.images && (c.images.large || c.images.small)) || "") + '" alt="' + esc(c.name) + '">'
    + '<div class="info"><h2>' + esc(c.name) + (c.hp ? ' <span style="color:var(--dim);font-size:16px">HP ' + esc(c.hp) + '</span>' : '') + '</h2>'
    + '<div class="sub">' + esc(c.supertype || "") + ' &nbsp;•&nbsp; check these against the card in your hand</div>'
    + idBlock
    + binderBlock(c.id)
    + '<div id="pricepane">' + priceBlock(c) + '</div>'
    + '<div class="chips">' + typeChips + subChips + '</div>'
    + body + '</div></div></div>');
}

/* Price for the printing currently selected, plus the picker to change it. */
function priceBlock(c){
  const tp = (c.tcgplayer && c.tcgplayer.prices) || {};
  const kinds = Object.keys(tp);
  let out = "";

  if(kinds.length > 1){
    out += '<div class="blk" style="border-top:0;padding-top:0"><h4>Which printing do you have?</h4>'
      + '<div class="vars">' + kinds.map(k =>
          '<button class="' + (k === modalVar ? "on" : "") + '" onclick="selectVar(\'' + k + '\')">'
          + esc(varLabel(k))
          + '<small>' + esc(varNote(k) || (tp[k] && tp[k].market != null ? money(tp[k].market) : "no price")) + '</small>'
          + '</button>').join("")
      + '</div></div>';
  }

  const v = tp[modalVar];
  const mk = v ? (v.market != null ? v.market : (v.mid != null ? v.mid : v.low)) : null;
  if(v && mk != null){
    out += '<div class="bigprice"><b>' + money(mk) + '</b>'
        +  '<span>' + esc(kinds.length > 1 ? varLabel(modalVar).toLowerCase() : "market price")
        +  ' &middot; TCGplayer</span></div>';
    const rows = [["low","Low"],["mid","Mid"],["high","High"],["directLow","Direct low"]]
      .filter(([k]) => v[k] != null)
      .map(([k,lab]) => '<div class="price"><small>' + lab + '</small><b>' + money(v[k]) + '</b></div>').join("");
    if(rows) out += '<div class="prices" style="margin-bottom:12px">' + rows + '</div>';
  } else if(v){
    // the printing is listed but has no sales behind it yet
    const r = cardValue(c);
    out += '<div class="bigprice est"><b>' + (r ? "~" + money(r.v) : "—") + '</b>'
        +  '<span><span class="tag">estimate</span> no sales yet for this printing</span></div>'
        +  (r ? warnBox(r, "TCGplayer lists this printing but has no sales behind it.") : "");
  } else if(!kinds.length){
    const r = cardValue(c);
    if(r && r.est){
      out += '<div class="bigprice est"><b>~' + money(r.v) + '</b>'
          +  '<span><span class="tag">estimate</span> not a real sale price</span></div>'
          +  warnBox(r);
    } else {
      out += '<div class="bigprice"><b style="color:var(--dim);font-size:18px">No price listed</b>'
          +  '<span>TCGplayer has no sales data for this card</span></div>';
    }
  }

  const cm = c.cardmarket && c.cardmarket.prices;
  if(cm && cm.trendPrice){
    out += '<div class="blk"><h4>Cardmarket (EU)</h4><div class="prices">'
      + '<div class="price"><small>trend</small><b>€' + cm.trendPrice.toFixed(2) + '</b></div>'
      + (cm.lowPrice ? '<div class="price"><small>low</small><b>€' + cm.lowPrice.toFixed(2) + '</b></div>' : '')
      + (cm.avg30 ? '<div class="price"><small>30-day avg</small><b>€' + cm.avg30.toFixed(2) + '</b></div>' : '')
      + '</div></div>';
  }
  return out;
}
function energy(cost){
  if(!cost || !cost.length) return "";
  return cost.map(t => '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'
    + (TYPE_COLORS[t] || "#ccc") + ';vertical-align:-2px;margin-right:2px;border:1px solid rgba(0,0,0,.4)" title="' + esc(t) + '"></span>').join("");
}
function closeCard(){ const m = document.getElementById("modal"); if(m) m.remove(); }
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(document.getElementById("signin")) closeSignIn(true);
    else if(document.getElementById("modal")) closeCard();
    else if(document.getElementById("scanner")) closeScanner();
    else if(VIEW === "set" || VIEW === "search") showSets();
  }
});

/* ---------------- misc ---------------- */
function showSets(){
  closeCard();
  if(VIEW === "search") qIn.value = "";   // the set list filters on the same box
  qIn.placeholder = "Search sets…";
  VIEW = "sets";
  setTab();
  renderSets();
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function fmtDate(d){
  if(!d) return "—";
  const p = d.split("/");
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (M[parseInt(p[1],10)-1] || "") + " " + parseInt(p[2],10) + ", " + p[0];
}
qIn.addEventListener("input", () => {
  if(VIEW === "search") onSearchTyping();
  else if(VIEW === "sets") renderSets();
  else showSets();                       // typing while inside a set backs out to the set list
});
qIn.addEventListener("keydown", e => {
  if(e.key === "Enter" && VIEW === "search"){ clearTimeout(typeTimer); runSearch(qIn.value.trim()); }
});
sortIn.addEventListener("change", () => { if(VIEW === "sets") renderSets(); });
document.getElementById("snap").textContent = PACK_PRICES.d || "—";
loadSets();
initAccounts();
</script>
